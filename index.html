<script>
(function() {
    if (!window.UI) window.UI = {};
    if (!window.ToolJavaScriptGio) {
        window.ToolJavaScriptGio = {
            aplicarClase: (el, cls) => { if (el) el.classList.add(cls); }
        };
    }
    if (!window.UIColorPicker) {
        window.UIColorPicker = class {
            constructor({ initialColor = { r: 255, g: 255, b: 255 }, onChange = () => {} } = {}) {
                this.onChange = onChange;
                this.panel = document.createElement('div');
                this.panel.className = 'fb-colorpicker';
                const lbl = document.createElement('span');
                lbl.textContent = 'Paleta & Color';
                const inp = document.createElement('input');
                inp.type = 'color';
                const r = initialColor.r.toString(16).padStart(2, '0');
                const g = initialColor.g.toString(16).padStart(2, '0');
                const b = initialColor.b.toString(16).padStart(2, '0');
                inp.value = `#${r}${g}${b}`;
                inp.addEventListener('input', (e) => {
                    const hex = e.target.value;
                    const cr = parseInt(hex.slice(1, 3), 16);
                    const cg = parseInt(hex.slice(3, 5), 16);
                    const cb = parseInt(hex.slice(5, 7), 16);
                    this.onChange({ r: cr, g: cg, b: cb, a: 1 }, {}, hex, {});
                });
                this.input = inp;
                this.panel.appendChild(lbl);
                this.panel.appendChild(inp);
                this.element = this.panel;
            }
            setHex(hex) { if (this.input) this.input.value = hex; }
        };
    }
    if (!window.UI.Container) {
        window.UI.Container = class {
            constructor({ id, width }) {
                this.element = document.createElement('div');
                this.element.id = id;
                this.element.className = 'fb-container';
                if (width) this.element.style.width = width + 'px';
            }
            mount(parent) { parent.appendChild(this.element); return this; }
            addPanel(panel) {
                if (panel.element) this.element.appendChild(panel.element);
                else if (panel instanceof HTMLElement) this.element.appendChild(panel);
                return this;
            }
        };
    }
    if (!window.UI.SmartPanel) {
        window.UI.SmartPanel = class {
            constructor({ title }) {
                this.element = document.createElement('div');
                this.element.className = 'fb-panel';
                if (title) {
                    const t = document.createElement('div');
                    t.className = 'fb-panel-title';
                    t.textContent = title;
                    this.element.appendChild(t);
                }
            }
            append(el) {
                if (el.element) this.element.appendChild(el.element);
                else if (el instanceof HTMLElement) this.element.appendChild(el);
            }
        };
    }
    if (!window.UI.Accordion) {
        window.UI.Accordion = class {
            constructor() {
                this.element = document.createElement('div');
                this.element.style.display = 'flex';
                this.element.style.flexDirection = 'column';
                this.element.style.gap = '6px';
            }
            addItem({ title, open = true }) {
                const item = document.createElement('details');
                if (open) item.open = true;
                item.style.background = '#0f172a';
                item.style.border = '1px solid #334155';
                item.style.borderRadius = '4px';
                item.style.padding = '4px 6px';
                const sm = document.createElement('summary');
                sm.style.cursor = 'pointer';
                sm.style.fontWeight = 'bold';
                sm.style.color = '#94a3b8';
                sm.textContent = title;
                item.appendChild(sm);
                const content = document.createElement('div');
                content.style.display = 'flex';
                content.style.flexDirection = 'column';
                content.style.gap = '6px';
                content.style.paddingTop = '6px';
                item.appendChild(content);
                this.element.appendChild(item);
                return {
                    addRow: (gap = 4) => {
                        const r = document.createElement('div');
                        r.className = 'fb-row';
                        r.style.gap = gap + 'px';
                        content.appendChild(r);
                        return {
                            append: (child) => {
                                if (child.element) r.appendChild(child.element);
                                else if (child instanceof HTMLElement) r.appendChild(child);
                            }
                        };
                    },
                    append: (child) => {
                        if (child.element) content.appendChild(child.element);
                        else if (child instanceof HTMLElement) content.appendChild(child);
                    }
                };
            }
        };
    }
    if (!window.UI.Button) {
        window.UI.Button = class {
            constructor({ text, variant = '', onClick = () => {} }) {
                this.element = document.createElement('button');
                this.element.className = `fb-btn ${variant === 'primary' ? 'fb-btn-primary' : ''} ${variant === 'danger' ? 'fb-btn-danger' : ''}`;
                this.element.textContent = text;
                this.element.onclick = onClick;
            }
        };
    }
    if (!window.UI.Select) {
        window.UI.Select = class {
            constructor({ options = [], value = '' }) {
                this.element = document.createElement('select');
                this.element.className = 'fb-select';
                options.forEach(opt => {
                    const o = document.createElement('option');
                    o.value = opt.value;
                    o.textContent = opt.label;
                    if (opt.value === value) o.selected = true;
                    this.element.appendChild(o);
                });
            }
            getValue() { return this.element.value; }
        };
    }
    if (!window.UI.ConfigurableSlider) {
        window.UI.ConfigurableSlider = class {
            constructor({ label, min = 0, max = 100, step = 1, value = 0, onChange = () => {} }) {
                this.element = document.createElement('div');
                this.element.className = 'custom-slider-box';
                this.element.style.width = '100%';
                const head = document.createElement('div');
                head.className = 'custom-slider-header';
                const tit = document.createElement('span');
                tit.textContent = label;
                const val = document.createElement('span');
                val.textContent = value;
                head.appendChild(tit);
                head.appendChild(val);
                const inp = document.createElement('input');
                inp.type = 'range';
                inp.className = 'custom-slider-range';
                inp.min = min;
                inp.max = max;
                inp.step = step;
                inp.value = value;
                inp.addEventListener('input', (e) => {
                    const v = parseFloat(e.target.value);
                    val.textContent = v;
                    onChange(v);
                });
                this.element.appendChild(head);
                this.element.appendChild(inp);
            }
        };
    }
    if (!window.UI.Toggle) {
        window.UI.Toggle = class {
            constructor({ label, value = false, onChange = () => {} }) {
                this.element = document.createElement('label');
                this.element.style.display = 'flex';
                this.element.style.alignItems = 'center';
                this.element.style.gap = '6px';
                this.element.style.cursor = 'pointer';
                this.input = document.createElement('input');
                this.input.type = 'checkbox';
                this.input.checked = value;
                this.input.addEventListener('change', () => onChange(this.input.checked));
                const span = document.createElement('span');
                span.textContent = label;
                this.element.appendChild(this.input);
                this.element.appendChild(span);
            }
            setValue(v) { this.input.checked = v; }
        };
    }
    if (!window.UI.ReorderList) {
        window.UI.ReorderList = class {
            constructor({ items = [], onSelect = () => {}, onVisibilityChange = () => {}, onReorder = () => {} }) {
                this.items = items;
                this.onSelect = onSelect;
                this.onVisibilityChange = onVisibilityChange;
                this.onReorder = onReorder;
                this.element = document.createElement('div');
                this.element.className = 'fb-reorder-list';
                this.selectedIndex = 0;
                this.render();
            }
            setItems(items, selectedIndex = 0) {
                this.items = items;
                this.selectedIndex = selectedIndex;
                this.render();
            }
            render() {
                this.element.innerHTML = '';
                this.items.forEach((item, idx) => {
                    const row = document.createElement('div');
                    row.className = `fb-reorder-item ${idx === this.selectedIndex ? 'active' : ''}`;
                    const name = document.createElement('span');
                    name.textContent = item.name;
                    name.onclick = () => {
                        this.selectedIndex = idx;
                        this.render();
                        this.onSelect(item);
                    };
                    const chk = document.createElement('input');
                    chk.type = 'checkbox';
                    chk.checked = item.visible !== false;
                    chk.onclick = (e) => {
                        e.stopPropagation();
                        this.onVisibilityChange(item, idx, chk.checked);
                    };
                    row.appendChild(chk);
                    row.appendChild(name);
                    this.element.appendChild(row);
                });
            }
        };
    }
})();

const MathCad = {
    distanciaPuntoSegmento(p, a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const len2 = dx * dx + dy * dy;
        if (len2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
        let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
    },
    rdp(puntos, epsilon) {
        if (puntos.length < 3) return puntos.slice();
        let dMax = 0;
        let index = 0;
        const end = puntos.length - 1;
        for (let i = 1; i < end; i++) {
            const d = this.distanciaPuntoSegmento(puntos[i], puntos[0], puntos[end]);
            if (d > dMax) {
                index = i;
                dMax = d;
            }
        }
        if (dMax > epsilon) {
            const izq = this.rdp(puntos.slice(0, index + 1), epsilon);
            const der = this.rdp(puntos.slice(index), epsilon);
            return izq.slice(0, -1).concat(der);
        } else {
            return [puntos[0], puntos[end]];
        }
    },
    deCasteljau(puntos, t) {
        let temp = puntos.map(p => ({ x: p.x, y: p.y }));
        for (let r = 1; r < puntos.length; r++) {
            for (let i = 0; i < puntos.length - r; i++) {
                temp[i] = {
                    x: (1 - t) * temp[i].x + t * temp[i + 1].x,
                    y: (1 - t) * temp[i].y + t * temp[i + 1].y
                };
            }
        }
        return temp[0];
    },
    generarBezier(pts, samples = 100) {
        if (pts.length < 2) return pts.slice();
        const res = [];
        for (let i = 0; i <= samples; i++) {
            res.push(this.deCasteljau(pts, i / samples));
        }
        return res;
    },
    regresionPolinomica2D(points, degree = 3, samplesCount = 100) {
        const n = points.length;
        if (n < 2) return points.slice();
        degree = Math.min(degree, n - 1);
        const t = new Float64Array(n);
        t[0] = 0;
        for (let i = 1; i < n; i++) {
            const d = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
            t[i] = t[i - 1] + (d > 0 ? d : 0.0001);
        }
        const totalLength = t[n - 1];
        for (let i = 0; i < n; i++) t[i] /= totalLength;

        function fit1D(tVals, vals, deg) {
            const m = deg + 1;
            const A = Array.from({ length: m }, () => new Float64Array(m));
            const B = new Float64Array(m);
            const powers = new Float64Array(2 * deg + 1);
            for (let i = 0; i < n; i++) {
                let p = 1;
                for (let j = 0; j <= 2 * deg; j++) {
                    powers[j] += p;
                    p *= tVals[i];
                }
            }
            for (let r = 0; r < m; r++) {
                for (let c = 0; c < m; c++) A[r][c] = powers[r + c];
            }
            for (let i = 0; i < n; i++) {
                let p = 1;
                for (let r = 0; r < m; r++) {
                    B[r] += vals[i] * p;
                    p *= tVals[i];
                }
            }
            for (let i = 0; i < m; i++) {
                let maxRow = i;
                for (let k = i + 1; k < m; k++) {
                    if (Math.abs(A[k][i]) > Math.abs(A[maxRow][i])) maxRow = k;
                }
                [A[i], A[maxRow]] = [A[maxRow], A[i]];
                [B[i], B[maxRow]] = [B[maxRow], B[i]];
                for (let k = i + 1; k < m; k++) {
                    const factor = A[k][i] / (A[i][i] || 1e-12);
                    for (let j = i; j < m; j++) A[k][j] -= factor * A[i][j];
                    B[k] -= factor * B[i];
                }
            }
            const coeffs = new Float64Array(m);
            for (let i = m - 1; i >= 0; i--) {
                let sum = B[i];
                for (let j = i + 1; j < m; j++) sum -= A[i][j] * coeffs[j];
                coeffs[i] = sum / (A[i][i] || 1e-12);
            }
            return coeffs;
        }

        function evalPoly(coeffs, valT) {
            let res = 0;
            let p = 1;
            for (let i = 0; i < coeffs.length; i++) {
                res += coeffs[i] * p;
                p *= valT;
            }
            return res;
        }

        const coeffsX = fit1D(t, points.map(p => p.x), degree);
        const coeffsY = fit1D(t, points.map(p => p.y), degree);
        const resultado = [];
        for (let i = 0; i <= samplesCount; i++) {
            const curT = i / samplesCount;
            resultado.push({ x: evalPoly(coeffsX, curT), y: evalPoly(coeffsY, curT) });
        }
        return resultado;
    },
    generarArco3Puntos(p1, p2, p3, samples = 100) {
        const d = 2 * (p1.x * (p2.y - p3.y) + p2.x * (p3.y - p1.y) + p3.x * (p1.y - p2.y));
        if (Math.abs(d) < 1e-6) return null;
        const cx = ((p1.x**2 + p1.y**2) * (p2.y - p3.y) + (p2.x**2 + p2.y**2) * (p3.y - p1.y) + (p3.x**2 + p3.y**2) * (p1.y - p2.y)) / d;
        const cy = ((p1.x**2 + p1.y**2) * (p3.x - p2.x) + (p2.x**2 + p2.y**2) * (p1.x - p3.x) + (p3.x**2 + p3.y**2) * (p2.x - p1.x)) / d;
        const r = Math.hypot(p1.x - cx, p1.y - cy);
        let ang1 = Math.atan2(p1.y - cy, p1.x - cx);
        let ang2 = Math.atan2(p2.y - cy, p2.x - cx);
        let ang3 = Math.atan2(p3.y - cy, p3.x - cx);
        const norm = a => (a < 0 ? a + Math.PI * 2 : a);
        let a1 = norm(ang1), a2 = norm(ang2), a3 = norm(ang3);
        let cw = a1 < a3 ? !(a1 < a2 && a2 < a3) : (a3 < a2 && a2 < a1);
        let diff = ang3 - ang1;
        if (cw && diff > 0) diff -= Math.PI * 2;
        if (!cw && diff < 0) diff += Math.PI * 2;
        const res = [];
        for (let i = 0; i <= samples; i++) {
            const theta = ang1 + diff * (i / samples);
            res.push({ x: cx + r * Math.cos(theta), y: cy + r * Math.sin(theta) });
        }
        return res;
    },
    generarArco2Puntos(p1, p2, h, samples = 80) {
        const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        if (d === 0) return [p1, p2];
        const mx = (p1.x + p2.x) / 2;
        const my = (p1.y + p2.y) / 2;
        const nx = -(p2.y - p1.y) / d;
        const ny = (p2.x - p1.x) / d;
        const pc = { x: mx + nx * h, y: my + ny * h };
        const res = [];
        for (let i = 0; i <= samples; i++) {
            const t = i / samples;
            res.push({
                x: (1 - t)**2 * p1.x + 2 * (1 - t) * t * pc.x + t**2 * p2.x,
                y: (1 - t)**2 * p1.y + 2 * (1 - t) * t * pc.y + t**2 * p2.y
            });
        }
        return res;
    },
    generarCirculo(c, p, samples = 120) {
        const r = Math.hypot(p.x - c.x, p.y - c.y);
        const res = [];
        for (let i = 0; i <= samples; i++) {
            const theta = (i / samples) * Math.PI * 2;
            res.push({ x: c.x + r * Math.cos(theta), y: c.y + r * Math.sin(theta) });
        }
        return res;
    },
    generarElipse(p1, p2, samples = 120) {
        const cx = (p1.x + p2.x) / 2;
        const cy = (p1.y + p2.y) / 2;
        const rx = Math.abs(p2.x - p1.x) / 2 || 1;
        const ry = Math.abs(p2.y - p1.y) / 2 || 1;
        const res = [];
        for (let i = 0; i <= samples; i++) {
            const theta = (i / samples) * Math.PI * 2;
            res.push({ x: cx + rx * Math.cos(theta), y: cy + ry * Math.sin(theta) });
        }
        return res;
    },
    generarRectangulo(p1, p2) {
        return [
            { x: p1.x, y: p1.y },
            { x: p2.x, y: p1.y },
            { x: p2.x, y: p2.y },
            { x: p1.x, y: p2.y },
            { x: p1.x, y: p1.y }
        ];
    },
    generarPoligonoRegular(c, p, nLados) {
        const r = Math.hypot(p.x - c.x, p.y - c.y);
        const a0 = Math.atan2(p.y - c.y, p.x - c.x);
        const res = [];
        for (let i = 0; i <= nLados; i++) {
            const theta = a0 + (i * 2 * Math.PI / nLados);
            res.push({ x: c.x + r * Math.cos(theta), y: c.y + r * Math.sin(theta) });
        }
        return res;
    },
    generarTrapezoide(p1, p2, p3, p4) {
        return [
            { x: p1.x, y: p1.y },
            { x: p2.x, y: p2.y },
            { x: p3.x, y: p3.y },
            { x: p4.x, y: p4.y },
            { x: p1.x, y: p1.y }
        ];
    }
};

class FloodFillTool {
    static isLittleEndian = (() => {
        const u8 = new Uint8Array([0xAA, 0xBB]);
        const u16 = new Uint16Array(u8.buffer);
        return u16[0] === 0xBBAA;
    })();

    static hexToRgba(colorStr) {
        if (!colorStr) return { r: 0, g: 0, b: 0, a: 255 };
        let c = String(colorStr).trim();
        if (c.startsWith('rgba') || c.startsWith('rgb')) {
            const nums = c.match(/[\d.]+/g);
            if (nums && nums.length >= 3) {
                return {
                    r: Math.min(255, Math.max(0, parseInt(nums[0], 10))),
                    g: Math.min(255, Math.max(0, parseInt(nums[1], 10))),
                    b: Math.min(255, Math.max(0, parseInt(nums[2], 10))),
                    a: nums[3] !== undefined ? Math.min(255, Math.max(0, Math.round(parseFloat(nums[3]) * 255))) : 255
                };
            }
        }
        c = c.replace('#', '');
        if (c.length === 3) c = c.split('').map(x => x + x).join('');
        if (c.length === 6) c += 'ff';
        const num = parseInt(c, 16);
        if (isNaN(num)) return { r: 0, g: 0, b: 0, a: 255 };
        return {
            r: (num >> 24) & 255,
            g: (num >> 16) & 255,
            b: (num >> 8) & 255,
            a: num & 255
        };
    }

    static packColor(r, g, b, a) {
        if (this.isLittleEndian) {
            return ((a & 0xFF) << 24) | ((b & 0xFF) << 16) | ((g & 0xFF) << 8) | (r & 0xFF);
        } else {
            return ((r & 0xFF) << 24) | ((g & 0xFF) << 16) | ((b & 0xFF) << 8) | (a & 0xFF);
        }
    }

    static unpackColor(c32) {
        if (this.isLittleEndian) {
            return {
                r: c32 & 0xFF,
                g: (c32 >> 8) & 0xFF,
                b: (c32 >> 16) & 0xFF,
                a: (c32 >> 24) & 0xFF
            };
        } else {
            return {
                r: (c32 >> 24) & 0xFF,
                g: (c32 >> 16) & 0xFF,
                b: (c32 >> 8) & 0xFF,
                a: c32 & 0xFF
            };
        }
    }

    static fill(layer, startX, startY, fillColorStr, opacity = 1.0, tolerance = 15, selectionManager = null) {
        if (!layer) return false;
        const w = layer.width;
        const h = layer.height;
        const x0 = Math.floor(startX);
        const y0 = Math.floor(startY);

        if (x0 < 0 || x0 >= w || y0 < 0 || y0 >= h) return false;

        const imgData = layer.ctx.getImageData(0, 0, w, h);
        const data32 = new Uint32Array(imgData.data.buffer);
        const startIndex = y0 * w + x0;
        const targetColor = data32[startIndex];

        const fc = this.hexToRgba(fillColorStr);
        const finalAlpha = Math.min(255, Math.max(0, Math.round(fc.a * Math.min(1.0, Math.max(0.01, opacity)))));
        const fillColor32 = this.packColor(fc.r, fc.g, fc.b, finalAlpha);

        if (targetColor === fillColor32) return false;

        let selData = null;
        if (selectionManager && selectionManager.hasSelection) {
            selData = selectionManager.maskCtx.getImageData(0, 0, w, h).data;
        }

        const tc = this.unpackColor(targetColor);
        const maxDiff = (tolerance / 100) * 255;

        const matchesTarget = (col) => {
            const sc = this.unpackColor(col);
            return Math.abs(sc.r - tc.r) <= maxDiff &&
                   Math.abs(sc.g - tc.g) <= maxDiff &&
                   Math.abs(sc.b - tc.b) <= maxDiff &&
                   Math.abs(sc.a - tc.a) <= maxDiff;
        };

        const isAllowed = (px, py) => {
            if (!selData) return true;
            return selData[(py * w + px) * 4 + 3] > 0;
        };

        if (!isAllowed(x0, y0)) return false;

        const visited = new Uint8Array(w * h);
        const queue = [x0, y0];

        while (queue.length > 0) {
            const y = queue.pop();
            const x = queue.pop();
            const idx = y * w + x;

            if (visited[idx]) continue;
            visited[idx] = 1;

            if (!matchesTarget(data32[idx])) continue;
            data32[idx] = fillColor32;

            if (x > 0 && !visited[idx - 1] && isAllowed(x - 1, y)) queue.push(x - 1, y);
            if (x < w - 1 && !visited[idx + 1] && isAllowed(x + 1, y)) queue.push(x + 1, y);
            if (y > 0 && !visited[idx - w] && isAllowed(x, y - 1)) queue.push(x, y - 1);
            if (y < h - 1 && !visited[idx + w] && isAllowed(x, y + 1)) queue.push(x, y + 1);
        }

        layer.ctx.putImageData(imgData, 0, 0);
        return true;
    }
}

class PureCadCurve {
    constructor({ type = 'bezier', degree = 3, style = {} } = {}) {
        this.type = type;
        this.degree = degree;
        this.pts = [];
        this.style = { stroke: '#38bdf8', lineWidth: 2, fill: null, ...style };
        this.forcedReady = false;
        this.cachedPoints = null;
        this.isDirty = true;
    }
    markDirty() {
        this.isDirty = true;
        this.cachedPoints = null;
    }
    minPoints() {
        switch (this.type) {
            case 'bezier': return 2;
            case 'poly': return 2;
            case 'arc3': return 3;
            case 'arc2': return 2;
            case 'circle': return 2;
            case 'ellipse': return 2;
            case 'rect': return 2;
            case 'polygon': return 2;
            case 'trapezoid': return 4;
            default: return 2;
        }
    }
    isReady() {
        return this.forcedReady || (this.pts.length >= this.minPoints());
    }
    computePoints(extraPoint = null) {
        if (!extraPoint && !this.isDirty && this.cachedPoints) {
            return this.cachedPoints;
        }
        const pList = extraPoint ? [...this.pts, extraPoint] : [...this.pts];
        if (pList.length < 2) return [];
        let res = [];
        switch (this.type) {
            case 'bezier':
                res = MathCad.generarBezier(pList, 64);
                break;
            case 'poly':
                res = MathCad.regresionPolinomica2D(pList, Math.min(this.degree, pList.length - 1), 64);
                break;
            case 'arc3':
                if (pList.length >= 3) {
                    res = MathCad.generarArco3Puntos(pList[0], pList[1], pList[2], 64) || [pList[0], pList[pList.length - 1]];
                } else {
                    res = [pList[0], pList[pList.length - 1]];
                }
                break;
            case 'arc2':
                if (pList.length >= 2) {
                    const d = Math.hypot(pList[1].x - pList[0].x, pList[1].y - pList[0].y);
                    res = MathCad.generarArco2Puntos(pList[0], pList[1], d * 0.25, 48);
                } else {
                    res = pList;
                }
                break;
            case 'circle':
                res = MathCad.generarCirculo(pList[0], pList[1], 64);
                break;
            case 'ellipse':
                res = MathCad.generarElipse(pList[0], pList[1], 64);
                break;
            case 'rect':
                res = MathCad.generarRectangulo(pList[0], pList[1]);
                break;
            case 'polygon':
                res = MathCad.generarPoligonoRegular(pList[0], pList[1], 5);
                break;
            case 'trapezoid':
                res = (pList.length >= 4) ? MathCad.generarTrapezoide(pList[0], pList[1], pList[2], pList[3]) : pList;
                break;
            default:
                res = MathCad.generarBezier(pList, 64);
                break;
        }
        if (!extraPoint) {
            this.cachedPoints = res;
            this.isDirty = false;
        }
        return res;
    }
    clone() {
        const c = new PureCadCurve({ type: this.type, degree: this.degree, style: this.style });
        c.pts = this.pts.map(p => ({ x: p.x, y: p.y }));
        c.forcedReady = this.forcedReady;
        c.isDirty = true;
        return c;
    }
    serialize() {
        return {
            type: this.type,
            degree: this.degree,
            pts: this.pts.map(p => ({ x: p.x, y: p.y })),
            style: { ...this.style },
            forcedReady: this.forcedReady
        };
    }
    static deserialize(d) {
        const c = new PureCadCurve({ type: d.type, degree: d.degree, style: d.style });
        c.pts = d.pts.map(p => ({ x: p.x, y: p.y }));
        c.forcedReady = !!d.forcedReady;
        c.isDirty = true;
        return c;
    }
}

class CadVectorEngine {
    constructor({ canvas, brushEngine = null, getCoords = (e)=>({x:e.clientX,y:e.clientY}), onStateChange = ()=>{} } = {}) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.brushEngine = brushEngine;
        this.getCoords = getCoords;
        this.onStateChange = onStateChange;
        this.shapes = [];
        this.current = null;
        this.currentType = 'bezier';
        this.currentDegree = 3;
        this.defaultStyle = { stroke: '#38bdf8', lineWidth: 2, fill: null };
        this.selected = null;
        this.selectedPointIndex = -1;
        this.dragging = null;
        this.hoverPoint = null;
        this.history = [];
        this.historyIndex = -1;
        this.active = false;
        this.useBrushStamp = false;
        this.isPanningActive = false;
        this._bind();
        this._snapshot();
    }
    _bind() {
        window.addEventListener('keydown', (e) => this._onKey(e));
    }
    setSize(w, h) {
        this.canvas.width = w;
        this.canvas.height = h;
        this.canvas.style.width = w + 'px';
        this.canvas.style.height = h + 'px';
        this.render();
    }
    handlePointerDown(x, y, e) {
        if (!this.active || this.isPanningActive) return;
        const p = { x, y };

        if (this.selected) {
            for (let i = 0; i < this.selected.pts.length; i++) {
                if (Math.hypot(p.x - this.selected.pts[i].x, p.y - this.selected.pts[i].y) <= 8) {
                    this.dragging = { shape: this.selected, index: i };
                    this.selectedPointIndex = i;
                    this.render();
                    return;
                }
            }
        }

        for (let s = this.shapes.length - 1; s >= 0; s--) {
            const sh = this.shapes[s];
            const poly = sh.computePoints();
            for (let i = 1; i < poly.length; i++) {
                if (MathCad.distanciaPuntoSegmento(p, poly[i - 1], poly[i]) <= 8) {
                    this.selected = sh;
                    this.selectedPointIndex = -1;
                    this.render();
                    return;
                }
            }
        }

        this.selected = null;
        this.selectedPointIndex = -1;

        if (!this.current) {
            this.current = new PureCadCurve({
                type: this.currentType,
                degree: this.currentDegree,
                style: { ...this.defaultStyle }
            });
        }
        this.current.pts.push(p);
        this.current.markDirty();

        if (this.current.pts.length === this.current.minPoints() && this.current.type !== 'bezier' && this.current.type !== 'poly') {
            this.current.forcedReady = true;
            this.shapes.push(this.current);
            this.current = null;
            this.hoverPoint = null;
            this._snapshot();
        }

        this.render();
    }
    handlePointerMove(x, y) {
        if (!this.active || this.isPanningActive) return;
        const p = { x, y };
        if (this.dragging) {
            this.dragging.shape.pts[this.dragging.index] = p;
            this.dragging.shape.markDirty();
            this.render();
            return;
        }
        if (this.current) {
            this.hoverPoint = p;
            this.render();
        }
    }
    handlePointerUp() {
        if (this.dragging) {
            this.dragging = null;
            this._snapshot();
            this.render();
        }
    }
    _onKey(e) {
        if (!this.active) return;
        if (e.key === 'Escape') {
            e.preventDefault();
            this.finishCurrent();
            this.selected = null;
            this.selectedPointIndex = -1;
            this.render();
        } else if (e.key === 'Enter') {
            e.preventDefault();
            this.finishCurrent();
        } else if (e.key === 'Delete' || e.key === 'Backspace') {
            if (this.selected) {
                this.deleteSelected();
                e.preventDefault();
            }
        }
    }
    finishCurrent() {
        if (this.current) {
            if (this.current.pts.length >= 2) {
                this.current.forcedReady = true;
                this.shapes.push(this.current);
                this._snapshot();
            }
            this.current = null;
        }
        this.hoverPoint = null;
        this.selected = null;
        this.selectedPointIndex = -1;
        this.render();
    }
    _snapshot() {
        const state = {
            shapes: this.shapes.map(s => s.serialize()),
            current: this.current ? this.current.serialize() : null,
            selectedIdx: this.selected ? this.shapes.indexOf(this.selected) : -1,
            selectedPointIndex: this.selectedPointIndex
        };
        this.history = this.history.slice(0, this.historyIndex + 1);
        this.history.push(state);
        if (this.history.length > 25) this.history.shift();
        this.historyIndex = this.history.length - 1;
        if (typeof this.onStateChange === 'function') this.onStateChange(this);
    }
    undo() {
        if (this.historyIndex > 0) {
            this.historyIndex--;
            this._restore(this.history[this.historyIndex]);
        }
    }
    redo() {
        if (this.historyIndex < this.history.length - 1) {
            this.historyIndex++;
            this._restore(this.history[this.historyIndex]);
        }
    }
    _restore(state) {
        this.shapes = state.shapes.map(d => PureCadCurve.deserialize(d));
        this.current = state.current ? PureCadCurve.deserialize(state.current) : null;
        this.selected = (state.selectedIdx >= 0 && state.selectedIdx < this.shapes.length) ? this.shapes[state.selectedIdx] : null;
        this.selectedPointIndex = state.selectedPointIndex !== undefined ? state.selectedPointIndex : -1;
        this.dragging = null;
        this.hoverPoint = null;
        this.render();
        if (typeof this.onStateChange === 'function') this.onStateChange(this);
    }
    deleteSelected() {
        if (!this.selected) return;
        const i = this.shapes.indexOf(this.selected);
        if (i >= 0) this.shapes.splice(i, 1);
        this.selected = null;
        this.selectedPointIndex = -1;
        this._snapshot();
        this.render();
    }
    clearAll() {
        this.shapes = [];
        this.current = null;
        this.selected = null;
        this.selectedPointIndex = -1;
        this._snapshot();
        this.render();
    }
    render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        for (let i = 0; i < this.shapes.length; i++) {
            const sh = this.shapes[i];
            this.drawShapeDirect(this.ctx, sh, {
                selected: sh === this.selected,
                selectedPointIndex: sh === this.selected ? this.selectedPointIndex : -1
            });
        }
        if (this.current) {
            this.drawShapeDirect(this.ctx, this.current, {
                preview: true,
                extraPoint: this.hoverPoint
            });
        }
    }
    drawShapeDirect(ctx, shape, opts = {}) {
        const rawPts = shape.computePoints(opts.extraPoint || null);
        if (rawPts.length < 2) return;

        if (this.useBrushStamp && this.brushEngine) {
            this.drawStampsAlongPolyline(ctx, rawPts);
        } else {
            ctx.save();
            ctx.lineWidth = shape.style.lineWidth;
            ctx.strokeStyle = opts.preview ? '#2563eb' : shape.style.stroke;
            ctx.fillStyle = shape.style.fill || 'transparent';
            ctx.setLineDash(opts.preview ? [4, 4] : []);
            if (opts.selected) { ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 8; }

            ctx.beginPath();
            ctx.moveTo(rawPts[0].x, rawPts[0].y);
            for (let i = 1; i < rawPts.length; i++) ctx.lineTo(rawPts[i].x, rawPts[i].y);
            if (shape.style.fill) ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        if (opts.selected || opts.preview) {
            ctx.save();
            ctx.setLineDash([2, 3]);
            ctx.strokeStyle = 'rgba(120, 120, 120, 0.6)';
            ctx.beginPath();
            for (let i = 0; i < shape.pts.length; i++) {
                if (i === 0) ctx.moveTo(shape.pts[i].x, shape.pts[i].y);
                else ctx.lineTo(shape.pts[i].x, shape.pts[i].y);
            }
            if (opts.extraPoint) ctx.lineTo(opts.extraPoint.x, opts.extraPoint.y);
            ctx.stroke();

            const ptsToDraw = opts.extraPoint ? [...shape.pts, opts.extraPoint] : shape.pts;
            for (let i = 0; i < ptsToDraw.length; i++) {
                const p = ptsToDraw[i];
                const isSel = opts.selectedPointIndex === i;
                ctx.beginPath();
                ctx.arc(p.x, p.y, isSel ? 6 : 4, 0, Math.PI * 2);
                ctx.fillStyle = isSel ? '#38bdf8' : '#e11d48';
                ctx.fill();
                if (isSel) { ctx.strokeStyle = '#0ea5e9'; ctx.lineWidth = 2; ctx.stroke(); }
            }
            ctx.restore();
        }
    }
    drawStampsAlongPolyline(ctx, polyline) {
        if (!this.brushEngine || polyline.length < 2) return;
        const be = this.brushEngine;
        const step = Math.max(1, be.size * (Math.max(1, be.spacing) / 100));
        const dims = be.getStampDimensions();
        const tip = be.getTipCanvas();

        ctx.save();
        ctx.globalAlpha = be.opacity * (be.force / 100);

        const drawAt = (x, y) => {
            const ang = be.randomRotation ? (Math.random() * 180 - 90) : be.angle;
            ctx.save();
            ctx.translate(x, y);
            if (ang !== 0) ctx.rotate((ang * Math.PI) / 180);
            ctx.drawImage(tip, -dims.w / 2, -dims.h / 2, dims.w, dims.h);
            ctx.restore();
        };

        drawAt(polyline[0].x, polyline[0].y);
        let distAccum = 0;
        for (let i = 1; i < polyline.length; i++) {
            const p1 = polyline[i - 1], p2 = polyline[i];
            const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            if (dist === 0) continue;
            distAccum += dist;
            if (distAccum >= step) {
                const n = Math.floor(distAccum / step);
                for (let s = 1; s <= n; s++) {
                    const t = (step * s) / dist;
                    drawAt(p1.x + (p2.x - p1.x) * t, p1.y + (p2.y - p1.y) * t);
                }
                distAccum %= step;
            }
        }
        ctx.restore();
    }
    bakeToLayer(layer, brushEngine = null) {
        if (!layer) return;
        const be = brushEngine || this.brushEngine;
        for (const sh of this.shapes) {
            const poly = sh.computePoints();
            if (this.useBrushStamp && be) {
                const step = Math.max(1, be.size * (Math.max(1, be.spacing) / 100));
                const dims = be.getStampDimensions();
                const tip = be.getTipCanvas();
                layer.ctx.save();
                layer.ctx.globalAlpha = be.opacity * (be.force / 100);
                const drawAt = (x, y) => {
                    const ang = be.randomRotation ? (Math.random() * 180 - 90) : be.angle;
                    layer.ctx.save();
                    layer.ctx.translate(x, y);
                    if (ang !== 0) layer.ctx.rotate((ang * Math.PI) / 180);
                    layer.ctx.drawImage(tip, -dims.w / 2, -dims.h / 2, dims.w, dims.h);
                    layer.ctx.restore();
                };
                drawAt(poly[0].x, poly[0].y);
                let distAccum = 0;
                for (let i = 1; i < poly.length; i++) {
                    const p1 = poly[i - 1], p2 = poly[i];
                    const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                    if (dist === 0) continue;
                    distAccum += dist;
                    if (distAccum >= step) {
                        const n = Math.floor(distAccum / step);
                        for (let s = 1; s <= n; s++) {
                            const t = (step * s) / dist;
                            drawAt(p1.x + (p2.x - p1.x) * t, p1.y + (p2.y - p1.y) * t);
                        }
                        distAccum %= step;
                    }
                }
                layer.ctx.restore();
            } else {
                layer.ctx.save();
                layer.ctx.lineWidth = sh.style.lineWidth;
                layer.ctx.strokeStyle = sh.style.stroke;
                layer.ctx.fillStyle = sh.style.fill || 'transparent';
                layer.ctx.beginPath();
                layer.ctx.moveTo(poly[0].x, poly[0].y);
                for (let i = 1; i < poly.length; i++) layer.ctx.lineTo(poly[i].x, poly[i].y);
                if (sh.style.fill) layer.ctx.fill();
                layer.ctx.stroke();
                layer.ctx.restore();
            }
        }
    }
}

class BrushTipRenderer {
    constructor() {
        this.cacheCanvas = document.createElement('canvas');
        this.cacheCtx = this.cacheCanvas.getContext('2d', { willReadFrequently: true });
        this.lastConfigKey = "";
    }
    _hexToRgb(hex) {
        return FloodFillTool.hexToRgba(hex);
    }
    renderTip({ size = 50, hardness = 0.5, color = '#ffffff', texture = null } = {}) {
        const res = 512;
        const configKey = `${size}_${hardness}_${color}_${texture ? (texture.src || texture.width) : 'none'}`;
        if (this.lastConfigKey === configKey && this.cacheCanvas.width === res) return this.cacheCanvas;
        this.lastConfigKey = configKey;

        this.cacheCanvas.width = res;
        this.cacheCanvas.height = res;
        const ctx = this.cacheCtx;
        ctx.clearRect(0, 0, res, res);

        if (texture) {
            ctx.drawImage(texture, 0, 0, res, res);
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, res, res);
        }

        const imgData = ctx.getImageData(0, 0, res, res);
        const d = imgData.data;
        const cx = res / 2;
        const cy = res / 2;
        const maxR = res / 2;
        const rgb = this._hexToRgb(color);
        const tintR = rgb.r / 255, tintG = rgb.g / 255, tintB = rgb.b / 255;
        const hard = Math.max(0, Math.min(0.999, hardness));

        for (let y = 0; y < res; y++) {
            for (let x = 0; x < res; x++) {
                const idx = (y * res + x) * 4;
                const dist = Math.hypot(x - cx, y - cy) / maxR;
                let grad = 0;
                if (dist <= hard) {
                    grad = 1;
                } else if (dist < 1) {
                    grad = 1 - (dist - hard) / (1 - hard);
                }
                d[idx]     = d[idx] * tintR;
                d[idx + 1] = d[idx + 1] * tintG;
                d[idx + 2] = d[idx + 2] * tintB;
                d[idx + 3] = Math.round(d[idx + 3] * grad);
            }
        }
        ctx.putImageData(imgData, 0, 0);
        return this.cacheCanvas;
    }
}

class CanvasZoomManager {
    constructor({ container, target, onTransformChange = () => {} } = {}) {
        this.container = container;
        this.target = target;
        this.onTransformChange = onTransformChange;
        this.scale = 1.0;
        this.panX = 0;
        this.panY = 0;
        this.isPanning = false;
        this.lastX = 0;
        this.lastY = 0;
        this.init();
    }
    init() {
        this.container.addEventListener('wheel', (e) => this.handleWheel(e), { passive: false });
    }
    handleWheel(e) {
        e.preventDefault();
        const rect = this.container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const prevScale = this.scale;
        const factor = e.deltaY < 0 ? 1.15 : 0.85;
        this.scale = Math.min(Math.max(0.05, this.scale * factor), 15.0);
        this.panX = mouseX - (mouseX - this.panX) * (this.scale / prevScale);
        this.panY = mouseY - (mouseY - this.panY) * (this.scale / prevScale);
        this.apply();
    }
    startPan(clientX, clientY) {
        this.isPanning = true;
        this.lastX = clientX;
        this.lastY = clientY;
    }
    pan(clientX, clientY) {
        if (!this.isPanning) return;
        this.panX += clientX - this.lastX;
        this.panY += clientY - this.lastY;
        this.lastX = clientX;
        this.lastY = clientY;
        this.apply();
    }
    endPan() { this.isPanning = false; }
    zoomDelta(delta) {
        const factor = delta > 0 ? 1.2 : 0.8;
        const cx = this.container.clientWidth / 2;
        const cy = this.container.clientHeight / 2;
        const prevScale = this.scale;
        this.scale = Math.min(Math.max(0.05, this.scale * factor), 15.0);
        this.panX = cx - (cx - this.panX) * (this.scale / prevScale);
        this.panY = cy - (cy - this.panY) * (this.scale / prevScale);
        this.apply();
    }
    screenToWorld(clientX, clientY) {
        const rect = this.container.getBoundingClientRect();
        return {
            x: (clientX - rect.left - this.panX) / this.scale,
            y: (clientY - rect.top - this.panY) / this.scale
        };
    }
    apply() {
        this.target.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.scale})`;
        this.onTransformChange(this.scale, this.panX, this.panY);
    }
}

class HistoryManager {
    constructor({ onStateChange = () => {} } = {}) {
        this.undoStack = [];
        this.redoStack = [];
        this.maxStates = 30;
        this.onStateChange = onStateChange;
    }
    push(action) {
        this.undoStack.push(action);
        if (this.undoStack.length > this.maxStates) this.undoStack.shift();
        this.redoStack = [];
        this.notify();
    }
    undo() {
        if (!this.canUndo()) return;
        const action = this.undoStack.pop();
        action.undo();
        this.redoStack.push(action);
        this.notify();
    }
    redo() {
        if (!this.canRedo()) return;
        const action = this.redoStack.pop();
        action.redo();
        this.undoStack.push(action);
        this.notify();
    }
    canUndo() { return this.undoStack.length > 0; }
    canRedo() { return this.redoStack.length > 0; }
    notify() { this.onStateChange(this.canUndo(), this.canRedo(), this.undoStack.length, this.redoStack.length); }
}

class Layer {
    constructor(id, name, width, height) {
        this.id = id;
        this.name = name;
        this.width = width;
        this.height = height;
        this.visible = true; 
        this.opacity = 1.0;
        this.canvas = document.createElement('canvas');
        this.canvas.width = width;
        this.canvas.height = height;
        this.canvas.style.width = width + 'px';
        this.canvas.style.height = height + 'px';
        this.canvas.className = 'engine-canvas-layer';
        this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
    }
    setSize(w, h, preserveData = true) {
        let temp = null;
        if (preserveData) {
            temp = document.createElement('canvas');
            temp.width = this.width;
            temp.height = this.height;
            temp.getContext('2d').drawImage(this.canvas, 0, 0);
        }
        this.width = w;
        this.height = h;
        this.canvas.width = w;
        this.canvas.height = h;
        this.canvas.style.width = w + 'px';
        this.canvas.style.height = h + 'px';
        if (temp) {
            this.ctx.drawImage(temp, 0, 0, temp.width, temp.height, 0, 0, w, h);
        }
    }
    getSnapshot() { return this.ctx.getImageData(0, 0, this.width, this.height); }
    restoreSnapshot(data) {
        if (this.width !== data.width || this.height !== data.height) {
            this.setSize(data.width, data.height, false);
        }
        this.ctx.putImageData(data, 0, 0);
    }
}

class LayerStackEngine {
    constructor({ defaultWidth = 1024, defaultHeight = 768, renderContainer, onStackChanged = () => {} } = {}) {
        this.defaultWidth = defaultWidth;
        this.defaultHeight = defaultHeight;
        this.container = renderContainer;
        this.onStackChanged = onStackChanged;
        this.layers = [];
        this.activeLayerId = null;
        this.counter = 0;
    }
    createLayer(name = null, width = null, height = null) {
        this.counter++;
        const id = 'layer_' + this.counter + '_' + Math.random().toString(36).substring(2, 7);
        const layerName = name || `Capa ${this.counter}`;
        
        const active = this.getActiveLayer();
        const w = width || (active ? active.width : this.defaultWidth);
        const h = height || (active ? active.height : this.defaultHeight);
        
        const layer = new Layer(id, layerName, w, h);
        this.layers.push(layer);
        this.activeLayerId = id;
        this.syncDOM();
        this.onStackChanged(this.getLayerList(), this.activeLayerId);
        return layer;
    }
    duplicateLayer(id) {
        const src = this.getLayerById(id);
        if (!src) return null;
        this.counter++;
        const newLayer = new Layer('layer_' + this.counter + '_' + Math.random().toString(36).substring(2, 7), `${src.name} (Copia)`, src.width, src.height);
        newLayer.ctx.drawImage(src.canvas, 0, 0);
        newLayer.opacity = src.opacity;
        newLayer.visible = src.visible;
        const idx = this.layers.findIndex(l => l.id === id);
        this.layers.splice(idx + 1, 0, newLayer);
        this.activeLayerId = newLayer.id;
        this.syncDOM();
        this.onStackChanged(this.getLayerList(), this.activeLayerId);
        return newLayer;
    }
    deleteLayer(id) {
        if (this.layers.length <= 1) return;
        const idx = this.layers.findIndex(l => l.id === id);
        if (idx === -1) return;
        this.layers.splice(idx, 1);
        if (this.activeLayerId === id) this.activeLayerId = this.layers[Math.max(0, idx - 1)].id;
        this.syncDOM();
        this.onStackChanged(this.getLayerList(), this.activeLayerId);
    }
    moveUp(id) {
        const idx = this.layers.findIndex(l => l.id === id);
        if (idx < this.layers.length - 1) {
            const temp = this.layers[idx];
            this.layers[idx] = this.layers[idx + 1];
            this.layers[idx + 1] = temp;
            this.syncDOM();
            this.onStackChanged(this.getLayerList(), this.activeLayerId);
        }
    }
    moveDown(id) {
        const idx = this.layers.findIndex(l => l.id === id);
        if (idx > 0) {
            const temp = this.layers[idx];
            this.layers[idx] = this.layers[idx - 1];
            this.layers[idx - 1] = temp;
            this.syncDOM();
            this.onStackChanged(this.getLayerList(), this.activeLayerId);
        }
    }
    flipHoriz(id) {
        const layer = this.getLayerById(id);
        if (!layer) return;
        const temp = document.createElement('canvas');
        temp.width = layer.width; temp.height = layer.height;
        const tctx = temp.getContext('2d');
        tctx.translate(layer.width, 0);
        tctx.scale(-1, 1);
        tctx.drawImage(layer.canvas, 0, 0);
        layer.ctx.clearRect(0, 0, layer.width, layer.height);
        layer.ctx.drawImage(temp, 0, 0);
    }
    flipVert(id) {
        const layer = this.getLayerById(id);
        if (!layer) return;
        const temp = document.createElement('canvas');
        temp.width = layer.width; temp.height = layer.height;
        const tctx = temp.getContext('2d');
        tctx.translate(0, layer.height);
        tctx.scale(1, -1);
        tctx.drawImage(layer.canvas, 0, 0);
        layer.ctx.clearRect(0, 0, layer.width, layer.height);
        layer.ctx.drawImage(temp, 0, 0);
    }
    getLayerById(id) { return this.layers.find(l => l.id === id) || null; }
    getActiveLayer() { return this.getLayerById(this.activeLayerId); }
    setActiveLayer(id) {
        this.activeLayerId = id;
        this.onStackChanged(this.getLayerList(), this.activeLayerId);
    }
    setLayerVisibility(id, v) {
        const layer = this.getLayerById(id);
        if (layer) {
            layer.visible = v;
            layer.canvas.style.display = v ? 'block' : 'none';
            this.onStackChanged(this.getLayerList(), this.activeLayerId);
        }
    }
    setLayerOpacity(id, op) {
        const layer = this.getLayerById(id);
        if (layer) {
            layer.opacity = op;
            layer.canvas.style.opacity = op;
            this.onStackChanged(this.getLayerList(), this.activeLayerId);
        }
    }
    reorder(newLayerList) {
        const map = new Map(this.layers.map(l => [l.id, l]));
        this.layers = newLayerList.map(item => map.get(item.id)).filter(Boolean);
        this.syncDOM();
        this.onStackChanged(this.getLayerList(), this.activeLayerId);
    }
    syncDOM() {
        this.container.innerHTML = '';
        this.layers.forEach((l, idx) => {
            l.canvas.style.display = l.visible ? 'block' : 'none';
            l.canvas.style.opacity = l.opacity;
            l.canvas.style.zIndex = String(idx + 1);
            this.container.appendChild(l.canvas);
        });
    }
    getLayerList() {
        return this.layers.map(l => ({
            id: l.id,
            name: `${l.name} (${l.width}x${l.height})`,
            visible: l.visible,
            opacity: l.opacity
        }));
    }
}

class BrushSettingsEngine {
    constructor({ onSettingsChange = () => {} } = {}) {
        this.size = 60;
        this.aspectRatio = 0.0;
        this.hardness = 0.5;
        this.opacity = 1.0;
        this.force = 100.0;
        this.angle = 0;
        this.randomRotation = false;
        this.spacing = 25.0;
        this.fillShape = false;
        this.mainColor = '#ffffff';
        this.stampImage = null;
        this.tipRenderer = new BrushTipRenderer();
        this.onSettingsChange = onSettingsChange;
    }
    set(key, val, silent = false) {
        this[key] = val;
        if (!silent) this.onSettingsChange(key, val);
    }
    getStampDimensions() {
        const sx = this.aspectRatio >= 0 ? 1 : 1 + this.aspectRatio;
        const sy = this.aspectRatio <= 0 ? 1 : 1 - Math.abs(this.aspectRatio);
        return {
            w: Math.max(1, this.size * Math.max(0.01, sx)),
            h: Math.max(1, this.size * Math.max(0.01, sy))
        };
    }
    getTipCanvas() {
        return this.tipRenderer.renderTip({
            size: this.size,
            hardness: this.hardness,
            color: this.mainColor,
            texture: this.stampImage
        });
    }
}

class SelectionManager {
    constructor({ selectionCanvas, onSelectionChange = () => {} } = {}) {
        this.canvas = selectionCanvas;
        this.ctx = this.canvas.getContext('2d');
        this.onSelectionChange = onSelectionChange;
        this.polygon = [];
        this.hasSelection = false;
        this.maskCanvas = document.createElement('canvas');
        this.maskCtx = this.maskCanvas.getContext('2d');
    }
    setSize(w, h) {
        this.canvas.width = w;
        this.canvas.height = h;
        this.canvas.style.width = w + 'px';
        this.canvas.style.height = h + 'px';
        this.maskCanvas.width = w;
        this.maskCanvas.height = h;
    }
    setRect(x, y, w, h) {
        this.polygon = [{ x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h }];
        this.hasSelection = (w > 1 && h > 1);
        this.updateMask();
        this.drawMarchingAnts();
        this.onSelectionChange(this.hasSelection);
    }
    setLasso(points) {
        this.polygon = points.map(p => ({ x: p.x, y: p.y }));
        this.hasSelection = points.length > 2;
        this.updateMask();
        this.drawMarchingAnts();
        this.onSelectionChange(this.hasSelection);
    }
    updateMask() {
        this.maskCtx.clearRect(0, 0, this.maskCanvas.width, this.maskCanvas.height);
        if (!this.hasSelection || this.polygon.length < 3) return;
        this.maskCtx.fillStyle = '#ffffff';
        this.maskCtx.beginPath();
        this.maskCtx.moveTo(this.polygon[0].x, this.polygon[0].y);
        for (let i = 1; i < this.polygon.length; i++) this.maskCtx.lineTo(this.polygon[i].x, this.polygon[i].y);
        this.maskCtx.closePath();
        this.maskCtx.fill();
    }
    clear() {
        this.polygon = [];
        this.hasSelection = false;
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.maskCtx.clearRect(0, 0, this.maskCanvas.width, this.maskCanvas.height);
        this.onSelectionChange(false);
    }
    applyClipping(targetCtx) {
        if (!this.hasSelection || this.polygon.length < 3) return false;
        targetCtx.beginPath();
        targetCtx.moveTo(this.polygon[0].x, this.polygon[0].y);
        for (let i = 1; i < this.polygon.length; i++) targetCtx.lineTo(this.polygon[i].x, this.polygon[i].y);
        targetCtx.closePath();
        targetCtx.clip();
        return true;
    }
    drawMarchingAnts(previewPoints = null) {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    const pts = previewPoints || this.polygon;
    if (!pts || pts.length < 2) return;
    this.ctx.save();
    this.ctx.strokeStyle = '#38bdf8';
    this.ctx.lineWidth = 1.5;
    this.ctx.setLineDash([5, 5]);
    this.ctx.beginPath();
    this.ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
        this.ctx.lineTo(pts[i].x, pts[i].y);
    }
    if (!previewPoints && pts.length > 2) {
        this.ctx.closePath();
    }
    this.ctx.stroke();
    this.ctx.restore();
}
    getBounds() {
        if (!this.hasSelection || this.polygon.length === 0) return { x: 0, y: 0, width: this.canvas.width, height: this.canvas.height };
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        this.polygon.forEach(p => {
            if (p.x < minX) minX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.x > maxX) maxX = p.x;
            if (p.y > maxY) maxY = p.y;
        });
        return {
            x: Math.max(0, Math.floor(minX)),
            y: Math.max(0, Math.floor(minY)),
            width: Math.min(this.canvas.width - minX, Math.ceil(maxX - minX)),
            height: Math.min(this.canvas.height - minY, Math.ceil(maxY - minY))
        };
    }
}

class ClipboardManager {
    constructor({ onClipboardChanged = () => {} } = {}) {
        this.buffer = null;
        this.bounds = null;
        this.onClipboardChanged = onClipboardChanged;
    }
    async copy(layer, selectionManager) {
        if (!layer) return null;
        const b = selectionManager.getBounds();
        if (b.width <= 0 || b.height <= 0) return null;

        const clipCanvas = document.createElement('canvas');
        clipCanvas.width = b.width;
        clipCanvas.height = b.height;
        const cctx = clipCanvas.getContext('2d');

        if (selectionManager.hasSelection) {
            cctx.save();
            cctx.drawImage(selectionManager.maskCanvas, b.x, b.y, b.width, b.height, 0, 0, b.width, b.height);
            cctx.globalCompositeOperation = 'source-in';
            cctx.drawImage(layer.canvas, b.x, b.y, b.width, b.height, 0, 0, b.width, b.height);
            cctx.restore();
        } else {
            cctx.drawImage(layer.canvas, b.x, b.y, b.width, b.height, 0, 0, b.width, b.height);
        }

        this.buffer = clipCanvas;
        this.bounds = { ...b };
        this.onClipboardChanged(true);

        try {
            clipCanvas.toBlob(async (blob) => {
                if (blob && navigator.clipboard && window.ClipboardItem) {
                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                }
            }, 'image/png');
        } catch (e) {}

        return clipCanvas;
    }
    async cut(layer, selectionManager) {
        if (!layer) return null;
        const res = await this.copy(layer, selectionManager);
        this.deleteArea(layer, selectionManager);
        return res;
    }
    deleteArea(layer, selectionManager) {
        if (!layer) return;
        const ctx = layer.ctx;
        ctx.save();
        if (selectionManager.hasSelection) {
            ctx.globalCompositeOperation = 'destination-out';
            selectionManager.applyClipping(ctx);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, layer.width, layer.height);
        } else {
            ctx.clearRect(0, 0, layer.width, layer.height);
        }
        ctx.restore();
    }
}

class ToolManager {
    constructor({ previewCanvas, layerStackEngine, brushSettingsEngine, selectionManager, cadEngine, onColorSampled = () => {}, onStrokeStart = () => {}, onStrokeFinished = () => {} } = {}) {
        this.preview = previewCanvas;
        this.pctx = previewCanvas.getContext('2d');
        this.layers = layerStackEngine;
        this.brush = brushSettingsEngine;
        this.selection = selectionManager;
        this.cad = cadEngine;
        this.onColorSampled = onColorSampled;
        this.onStrokeStart = onStrokeStart;
        this.onStrokeFinished = onStrokeFinished;

        this.currentTool = 'brush';
        this.isDrawing = false;
        this.startX = 0;
        this.startY = 0;
        this.lastX = 0;
        this.lastY = 0;
        this.distAccum = 0;
        this.cloneSource = null;
        this.cloneBuffer = null;
        this.lassoPoints = [];
        this.polyPoints = [];
        this.lastPolyClickTime = 0;
        this.moveSnapshotCanvas = null;
    }
  setTool(tool) {
    if (this.currentTool === 'poly' && tool !== 'poly') {
        this.polyPoints = [];
        this.selection.clear();
    }
    this.currentTool = tool;
    if (this.cad) this.cad.active = (tool === 'cad');
}
    cancelSelection() {
        this.lassoPoints = [];
        this.polyPoints = [];
        this.isDrawing = false;
        if (this.preview && this.pctx) {
            this.pctx.clearRect(0, 0, this.preview.width, this.preview.height);
        }
        if (this.selection) {
            this.selection.clear();
        }
    }
    pointerDown(x, y, e) {
        if (this.currentTool === 'cad' && this.cad) {
            this.cad.handlePointerDown(x, y, e);
            return;
        }

        if (this.currentTool === 'poly') {
            if (e.button === 2) {
                this.polyPoints = [];
                this.selection.clear();
                return;
            }
            const now = performance.now();
            const isDoubleClick = (now - this.lastPolyClickTime < 320) || e.detail === 2;
            this.lastPolyClickTime = now;

            if (this.polyPoints.length >= 3) {
                const d = Math.hypot(x - this.polyPoints[0].x, y - this.polyPoints[0].y);
                if (d < 15 || isDoubleClick) {
                    this.finishPolySelection();
                    return;
                }
            }
            this.polyPoints.push({ x, y });
            this.selection.drawMarchingAnts(this.polyPoints);
            return;
        }

        if (this.currentTool === 'fill') {
            const layer = this.layers.getActiveLayer();
            if (layer) { 
                this.onStrokeStart(layer); 
                const filled = FloodFillTool.fill(
                    layer, 
                    x, 
                    y, 
                    this.brush.mainColor, 
                    this.brush.opacity,
                    15, 
                    this.selection
                );
                if (filled) {
                    this.onStrokeFinished(layer);
                }
            }
            this.isDrawing = false;
            return;
        }

        if ((e.button === 2 || e.altKey) && this.currentTool === 'clone') {
            const active = this.layers.getActiveLayer();
            if (active) {
                this.cloneSource = { x, y };
                this.cloneBuffer = document.createElement('canvas');
                this.cloneBuffer.width = active.width;
                this.cloneBuffer.height = active.height;
                this.cloneBuffer.getContext('2d').drawImage(active.canvas, 0, 0);
                const hud = document.getElementById('hud');
                if (hud) hud.textContent = `Punto de origen de clonación fijado en (${Math.round(x)}, ${Math.round(y)})`;
            }
            return;
        }

        if (e.button !== 0) return;
        const layer = this.layers.getActiveLayer();
        if (!layer) return;

        this.onStrokeStart(layer);
        this.isDrawing = true;
        this.startX = x;
        this.startY = y;
        this.lastX = x;
        this.lastY = y;
        this.distAccum = 0;

        if (this.currentTool === 'move') {
            this.moveSnapshotCanvas = document.createElement('canvas');
            this.moveSnapshotCanvas.width = layer.width;
            this.moveSnapshotCanvas.height = layer.height;
            this.moveSnapshotCanvas.getContext('2d').drawImage(layer.canvas, 0, 0);
            return;
        }

        if (this.currentTool === 'eyedropper') {
            this.sampleColor(x, y);
            this.isDrawing = false;
            return;
        }

        if (this.currentTool === 'lasso') {
            this.lassoPoints = [{ x, y }];
            return;
        }

        if (this.currentTool === 'rectSelect') {
            this.selection.clear();
            return;
        }

        if (['brush', 'eraser', 'clone', 'stamp'].includes(this.currentTool)) {
            layer.ctx.save();
            this.selection.applyClipping(layer.ctx);
            layer.ctx.globalCompositeOperation = (this.currentTool === 'eraser') ? 'destination-out' : 'source-over';
            layer.ctx.globalAlpha = this.brush.opacity * (this.brush.force / 100);
            this.drawInterpolatedStampDirect(layer.ctx, x, y);
            layer.ctx.restore();
        }
    }
    pointerMove(x, y) {
        if (this.currentTool === 'cad') {
            if (this.cad) this.cad.handlePointerMove(x, y);
            return;
        }

        if (this.currentTool === 'poly') {
            if (this.polyPoints.length > 0) {
                const preview = this.polyPoints.concat([{ x, y }]);
                this.selection.drawMarchingAnts(preview);
            }
            return;
        }

        if (!this.isDrawing) return;
        const layer = this.layers.getActiveLayer();
        if (!layer) return;

        if (['brush', 'eraser', 'clone', 'stamp'].includes(this.currentTool)) {
            layer.ctx.save();
            this.selection.applyClipping(layer.ctx);
            layer.ctx.globalCompositeOperation = (this.currentTool === 'eraser') ? 'destination-out' : 'source-over';
            layer.ctx.globalAlpha = this.brush.opacity * (this.brush.force / 100);
            this.drawContinuousStroke(layer.ctx, this.lastX, this.lastY, x, y);
            layer.ctx.restore();
        } else if (this.currentTool === 'move') {
            if (this.moveSnapshotCanvas) {
                const totalDx = Math.round(x - this.startX);
                const totalDy = Math.round(y - this.startY);
                layer.ctx.clearRect(0, 0, layer.width, layer.height);
                layer.ctx.drawImage(this.moveSnapshotCanvas, totalDx, totalDy);
            }
        } else if (this.currentTool === 'rectSelect') {
            this.selection.setRect(
                Math.min(this.startX, x), Math.min(this.startY, y),
                Math.abs(x - this.startX), Math.abs(y - this.startY)
            );
        } else if (this.currentTool === 'lasso') {
            this.lassoPoints.push({ x, y });
            this.selection.setLasso(this.lassoPoints);
        } else {
            this.renderShapePreview(x, y);
        }
        this.lastX = x;
        this.lastY = y;
    }

    pointerUp(x, y) {
        if (this.currentTool === 'cad' && this.cad) {
            this.cad.handlePointerUp();
            return;
        }
        if (this.currentTool === 'poly') {
            return;
        }
        if (!this.isDrawing) {
            if (this.currentTool === 'rectSelect' || this.currentTool === 'lasso') {
                this.selection.clear();
            }
            return;
        }
        this.isDrawing = false;
        this.distAccum = 0;
        this.moveSnapshotCanvas = null;

        const layer = this.layers.getActiveLayer();
        if (layer && ['line', 'rect', 'circle', 'arrow'].includes(this.currentTool)) {
            this.pctx.clearRect(0, 0, this.preview.width, this.preview.height);
            this.drawShape(layer.ctx, this.startX, this.startY, x, y);
        }
        if (this.currentTool === 'rectSelect') {
            const w = Math.abs(x - this.startX);
            const h = Math.abs(y - this.startY);
            if (w <= 2 && h <= 2) {
                this.selection.clear();
            }
        }
        if (this.currentTool === 'lasso') {
            if (this.lassoPoints.length <= 2) {
                this.selection.clear();
            } else {
                this.selection.setLasso(this.lassoPoints);
            }
        }
        this.onStrokeFinished(layer);
    }
    
    finishPolySelection() {
    if (this.polyPoints.length >= 3) {
        const puntos = this.polyPoints.map(p => ({ x: p.x, y: p.y }));
        this.polyPoints = [];
        this.selection.setLasso(puntos);
    } else {
        this.polyPoints = [];
        this.selection.clear();
    }
}
    drawContinuousStroke(ctx, x1, y1, x2, y2) {
        const dist = Math.hypot(x2 - x1, y2 - y1);
        const step = Math.max(1, this.brush.size * (Math.max(1, this.brush.spacing) / 100));

        if (dist === 0) {
            if (this.distAccum >= step) {
                this.drawInterpolatedStampDirect(ctx, x2, y2);
                this.distAccum = 0;
            }
            return;
        }

        this.distAccum += dist;
        if (this.distAccum >= step) {
            const n = Math.floor(this.distAccum / step);
            for (let i = 1; i <= n; i++) {
                const t = Math.min(1.0, (step * i) / dist);
                this.drawInterpolatedStampDirect(ctx, x1 + (x2 - x1) * t, y1 + (y2 - y1) * t);
            }
            this.distAccum %= step;
        }
    }
    drawInterpolatedStampDirect(ctx, x, y) {
        const dims = this.brush.getStampDimensions();

        if (this.currentTool === 'clone') {
            if (!this.cloneSource || !this.cloneBuffer) return;
            const sx = this.cloneSource.x + (x - this.startX);
            const sy = this.cloneSource.y + (y - this.startY);
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, dims.w / 2, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(this.cloneBuffer, sx - dims.w / 2, sy - dims.h / 2, dims.w, dims.h, x - dims.w / 2, y - dims.h / 2, dims.w, dims.h);
            ctx.restore();
            return;
        }

        const currentAngle = this.brush.randomRotation ? (Math.random() * 180 - 90) : this.brush.angle;
        const tipCanvas = this.brush.getTipCanvas();
        ctx.save();
        ctx.translate(x, y);
        if (currentAngle !== 0) ctx.rotate((currentAngle * Math.PI) / 180);
        ctx.drawImage(tipCanvas, -dims.w / 2, -dims.h / 2, dims.w, dims.h);
        ctx.restore();
    }
    renderShapePreview(x, y) {
        this.pctx.clearRect(0, 0, this.preview.width, this.preview.height);
        this.drawShape(this.pctx, this.startX, this.startY, x, y);
    }
    drawShape(ctx, x1, y1, x2, y2) {
        ctx.save();
        this.selection.applyClipping(ctx);
        ctx.strokeStyle = this.brush.mainColor;
        ctx.fillStyle = this.brush.mainColor;
        ctx.lineWidth = this.brush.size;
        ctx.globalAlpha = this.brush.opacity;

        if (this.currentTool === 'line') {
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        } else if (this.currentTool === 'rect') {
            const rx = Math.min(x1, x2), ry = Math.min(y1, y2), rw = Math.abs(x2 - x1), rh = Math.abs(y2 - y1);
            if (this.brush.fillShape) ctx.fillRect(rx, ry, rw, rh); else ctx.strokeRect(rx, ry, rw, rh);
        } else if (this.currentTool === 'circle') {
            const rx = (x2 - x1) / 2, ry = (y2 - y1) / 2;
            ctx.beginPath(); ctx.ellipse(x1 + rx, y1 + ry, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI * 2);
            if (this.brush.fillShape) ctx.fill(); else ctx.stroke();
        } else if (this.currentTool === 'arrow') {
            this.drawArrow(ctx, x1, y1, x2, y2);
        }
        ctx.restore();
    }
    drawArrow(ctx, fromx, fromy, tox, toy) {
        const headlen = Math.max(10, this.brush.size * 2.5);
        const angle = Math.atan2(toy - fromy, tox - fromx);
        ctx.beginPath(); ctx.moveTo(fromx, fromy); ctx.lineTo(tox, toy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tox, toy);
        ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
        ctx.closePath(); ctx.fill();
    }
    sampleColor(x, y) {
        const layer = this.layers.getActiveLayer();
        if (!layer) return;
        const px = layer.ctx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
        const hex = "#" + ((1 << 24) + (px[0] << 16) + (px[1] << 8) + px[2]).toString(16).slice(1);
        this.onColorSampled(hex);
    }
}

class ProjectExporter {
    static exportImage(layerStack, format = 'png') {
        let maxWidth = 1;
        let maxHeight = 1;
        layerStack.layers.forEach(l => {
            if (l.width > maxWidth) maxWidth = l.width;
            if (l.height > maxHeight) maxHeight = l.height;
        });

        const out = document.createElement('canvas');
        out.width = maxWidth;
        out.height = maxHeight;
        const octx = out.getContext('2d');
        layerStack.layers.forEach(l => {
            if (l.visible) {
                octx.save();
                octx.globalAlpha = l.opacity;
                octx.drawImage(l.canvas, 0, 0);
                octx.restore();
            }
        });
        const a = document.createElement('a');
        a.download = `substance_output_${Date.now()}.${format}`;
        a.href = out.toDataURL(format === 'png' ? 'image/png' : 'image/jpeg', 0.95);
        a.click();
    }
}
