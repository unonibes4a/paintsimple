<script>
(function() {
    if (!window.UI) window.UI = {};
    if (!window.ToolJavaScriptGio) {
        window.ToolJavaScriptGio = {
            aplicarClase: (el, cls) => { if (el) el.classList.add(cls); }
        };
    }
    if (!window.UIColorPicker) {
        window.UIColorPicker = class {
            constructor({ initialColor = { r: 255, g: 255, b: 255 }, onChange = () => {} } = {}) {
                this.onChange = onChange;
                this.panel = document.createElement('div');
                this.panel.className = 'fb-colorpicker';
                const lbl = document.createElement('span');
                lbl.textContent = 'Paleta & Color';
                lbl.style.fontWeight = 'bold';
                lbl.style.color = '#38bdf8';
                
                const inp = document.createElement('input');
                inp.type = 'color';
                const r = Math.min(255, Math.max(0, initialColor.r || 255)).toString(16).padStart(2, '0');
                const g = Math.min(255, Math.max(0, initialColor.g || 255)).toString(16).padStart(2, '0');
                const b = Math.min(255, Math.max(0, initialColor.b || 255)).toString(16).padStart(2, '0');
                inp.value = `#${r}${g}${b}`;
                
                inp.addEventListener('input', (e) => {
                    const hex = e.target.value;
                    const cr = parseInt(hex.slice(1, 3), 16);
                    const cg = parseInt(hex.slice(3, 5), 16);
                    const cb = parseInt(hex.slice(5, 7), 16);
                    this.onChange({ r: cr, g: cg, b: cb, a: 1 }, {}, hex, {});
                });
                this.input = inp;
                this.panel.appendChild(lbl);
                this.panel.appendChild(inp);
                this.element = this.panel;
            }
            setHex(hex) {

 const MathCad = {
    distanciaPuntoSegmento(p, a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const len2 = dx * dx + dy * dy;
        if (len2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
        let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
    },
    deCasteljau(puntos, t) {
        let temp = puntos.map(p => ({ x: p.x, y: p.y }));
        for (let r = 1; r < puntos.length; r++) {
            for (let i = 0; i < puntos.length - r; i++) {
                temp[i] = {
                    x: (1 - t) * temp[i].x + t * temp[i + 1].x,
                    y: (1 - t) * temp[i].y + t * temp[i + 1].y
                };
            }
        }
        return temp[0];
    },
    generarBezier(pts, samples = 80) {
        if (pts.length < 2) return pts.slice();
        const res = [];
        for (let i = 0; i <= samples; i++) {
            res.push(this.deCasteljau(pts, i / samples));
        }
        return res;
    },
    generarCirculo(c, p, samples = 80) {
        const r = Math.hypot(p.x - c.x, p.y - c.y);
        const res = [];
        for (let i = 0; i <= samples; i++) {
            const theta = (i / samples) * Math.PI * 2;
            res.push({ x: c.x + r * Math.cos(theta), y: c.y + r * Math.sin(theta) });
        }
        return res;
    },
    generarRectangulo(p1, p2) {
        return [
            { x: p1.x, y: p1.y },
            { x: p2.x, y: p1.y },
            { x: p2.x, y: p2.y },
            { x: p1.x, y: p2.y },
            { x: p1.x, y: p1.y }
        ];
    }
};
class FloodFillTool {
    static hexToRgba(colorStr) {
        if (!colorStr) return { r: 0, g: 0, b: 0, a: 255 };
        let c = String(colorStr).trim();
        if (c.startsWith('rgba') || c.startsWith('rgb')) {
            const nums = c.match(/[\d.]+/g);
            if (nums && nums.length >= 3) {
                return {
                    r: Math.min(255, Math.max(0, parseInt(nums[0], 10))),
                    g: Math.min(255, Math.max(0, parseInt(nums[1], 10))),
                    b: Math.min(255, Math.max(0, parseInt(nums[2], 10))),
                    a: nums[3] !== undefined ? Math.min(255, Math.max(0, Math.round(parseFloat(nums[3]) * 255))) : 255
                };
            }
        }
        c = c.replace('#', '');
        if (c.length === 3) c = c.split('').map(x => x + x).join('') + 'ff';
        else if (c.length === 6) c += 'ff';
        return {
            r: parseInt(c.slice(0, 2), 16) || 0,
            g: parseInt(c.slice(2, 4), 16) || 0,
            b: parseInt(c.slice(4, 6), 16) || 0,
            a: parseInt(c.slice(6, 8), 16) ?? 255
        };
    }

    static fill(layer, startX, startY, fillColorStr, opacity = 1.0, tolerance = 15, selectionManager = null) {
        if (!layer) return false;
        const w = layer.width;
        const h = layer.height;
        const x0 = Math.floor(startX);
        const y0 = Math.floor(startY);

        if (x0 < 0 || x0 >= w || y0 < 0 || y0 >= h) return false;

        const imgData = layer.ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        const startIndex = (y0 * w + x0) * 4;
        
        const tr = d[startIndex];
        const tg = d[startIndex + 1];
        const tb = d[startIndex + 2];
        const ta = d[startIndex + 3];

        const fc = this.hexToRgba(fillColorStr);
        const fr = fc.r;
        const fg = fc.g;
        const fb = fc.b;
        const fa = Math.min(255, Math.max(0, Math.round(fc.a * Math.min(1.0, Math.max(0.01, opacity)))));

        if (tr === fr && tg === fg && tb === fb && ta === fa) return false;

        let selData = null;
        if (selectionManager && selectionManager.hasSelection) {
            selData = selectionManager.maskCtx.getImageData(0, 0, w, h).data;
        }

        const maxDiff = (tolerance / 100) * 255;
        const matchesTarget = (idx) => {
            return Math.abs(d[idx]     - tr) <= maxDiff &&
                   Math.abs(d[idx + 1] - tg) <= maxDiff &&
                   Math.abs(d[idx + 2] - tb) <= maxDiff &&
                   Math.abs(d[idx + 3] - ta) <= maxDiff;
        };

        const isAllowed = (px, py) => {
            if (!selData) return true;
            return selData[(py * w + px) * 4 + 3] > 0;
        };

        if (!isAllowed(x0, y0)) return false;

        const visited = new Uint8Array(w * h);
        const queue = [x0, y0];

        while (queue.length > 0) {
            const py = queue.pop();
            const px = queue.pop();
            const pIdx = py * w + px;

            if (visited[pIdx]) continue;
            visited[pIdx] = 1;

            const dIdx = pIdx * 4;
            if (!matchesTarget(dIdx)) continue;

            d[dIdx]     = fr;
            d[dIdx + 1] = fg;
            d[dIdx + 2] = fb;
            d[dIdx + 3] = fa;

            if (px > 0 && !visited[pIdx - 1] && isAllowed(px - 1, py)) queue.push(px - 1, py);
            if (px < w - 1 && !visited[pIdx + 1] && isAllowed(px + 1, py)) queue.push(px + 1, py);
            if (py > 0 && !visited[pIdx - w] && isAllowed(px, py - 1)) queue.push(px, py - 1);
            if (py < h - 1 && !visited[pIdx + w] && isAllowed(px, py + 1)) queue.push(px, py + 1);
        }

        layer.ctx.putImageData(imgData, 0, 0);
        return true;
    }
}

class PureCadCurve {
    constructor({ type = 'bezier', degree = 3, style = {} } = {}) {
        this.type = type;
        this.degree = degree;
        this.pts = [];
        this.style = { stroke: '#38bdf8', lineWidth: 2, fill: null, ...style };
        this.forcedReady = false;
    }
    computePoints(extraPoint = null) {
        const pList = extraPoint ? [...this.pts, extraPoint] : [...this.pts];
        if (pList.length < 2) return [];
        return MathCad.generarBezier(pList, 64);
    }
}

class CadVectorEngine {
    constructor({ canvas, brushEngine = null } = {}) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.brushEngine = brushEngine;
        this.shapes = [];
        this.current = null;
        this.currentType = 'bezier';
        this.currentDegree = 3;
        this.defaultStyle = { stroke: '#38bdf8', lineWidth: 2, fill: null };
        this.selected = null;
        this.selectedPointIndex = -1;
        this.dragging = null;
        this.hoverPoint = null;
        this.active = false;
        this.useBrushStamp = false;
    }
    setSize(w, h) {
        this.canvas.width = w; this.canvas.height = h;
        this.canvas.style.width = w + 'px'; this.canvas.style.height = h + 'px';
        this.render();
    }
    handlePointerDown(x, y, e) {
        if (!this.active) return;
        if (e.button === 2) {
            this.finishCurrent();
            this.selected = null;
            this.selectedPointIndex = -1;
            this.render();
            return;
        }
        if (e.button !== 0) return;

        const p = { x, y };
        if (!this.current) {
            this.current = new PureCadCurve({ type: this.currentType, degree: this.currentDegree, style: { ...this.defaultStyle } });
        }
        this.current.pts.push(p);
        this.render();
    }
    handlePointerMove(x, y) {
        if (!this.active) return;
        if (this.current) {
            this.hoverPoint = { x, y };
            this.render();
        }
    }
    handlePointerUp() {}
    finishCurrent() {
        if (this.current) {
            if (this.current.pts.length >= 2) {
                this.current.forcedReady = true;
                this.shapes.push(this.current);
            }
            this.current = null;
        }
        this.hoverPoint = null;
        this.render();
    }
    clearAll() {
        this.shapes = [];
        this.current = null;
        this.selected = null;
        this.render();
    }
    render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        for (let sh of this.shapes) this.drawShapeDirect(this.ctx, sh);
        if (this.current) this.drawShapeDirect(this.ctx, this.current, { preview: true, extraPoint: this.hoverPoint });
    }
    drawShapeDirect(ctx, shape, opts = {}) {
        const rawPts = shape.computePoints(opts.extraPoint || null);
        if (rawPts.length < 2) return;
        ctx.save();
        ctx.lineWidth = shape.style.lineWidth;
        ctx.strokeStyle = opts.preview ? '#38bdf8' : shape.style.stroke;
        ctx.setLineDash(opts.preview ? [4, 4] : []);
        ctx.beginPath();
        ctx.moveTo(rawPts[0].x, rawPts[0].y);
        for (let i = 1; i < rawPts.length; i++) ctx.lineTo(rawPts[i].x, rawPts[i].y);
        ctx.stroke();
        ctx.restore();
    }
    bakeToLayer(layer) {
        if (!layer) return;
        for (const sh of this.shapes) {
            const poly = sh.computePoints();
            layer.ctx.save();
            layer.ctx.lineWidth = sh.style.lineWidth;
            layer.ctx.strokeStyle = sh.style.stroke;
            layer.ctx.beginPath();
            layer.ctx.moveTo(poly[0].x, poly[0].y);
            for (let i = 1; i < poly.length; i++) layer.ctx.lineTo(poly[i].x, poly[i].y);
            layer.ctx.stroke();
            layer.ctx.restore();
        }
    }
}

class BrushTipRenderer {
    constructor() {
        this.cacheCanvas = document.createElement('canvas');
        this.cacheCtx = this.cacheCanvas.getContext('2d', { willReadFrequently: true });
        this.lastConfigKey = "";
    }
    renderTip({ size = 50, hardness = 0.5, color = '#ffffff', texture = null } = {}) {
        const res = 256;
        const configKey = `${size}_${hardness}_${color}_${texture ? (texture.src || 'custom') : 'none'}`;
        if (this.lastConfigKey === configKey && this.cacheCanvas.width === res) return this.cacheCanvas;
        this.lastConfigKey = configKey;

        this.cacheCanvas.width = res;
        this.cacheCanvas.height = res;
        const ctx = this.cacheCtx;
        ctx.clearRect(0, 0, res, res);

        if (texture) {
            ctx.drawImage(texture, 0, 0, res, res);
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, res, res);
        }

        const imgData = ctx.getImageData(0, 0, res, res);
        const d = imgData.data;
        const cx = res / 2;
        const cy = res / 2;
        const maxR = res / 2;
        const rgb = FloodFillTool.hexToRgba(color);
        const tintR = rgb.r / 255, tintG = rgb.g / 255, tintB = rgb.b / 255;
        const hard = Math.max(0, Math.min(0.999, hardness));

        for (let y = 0; y < res; y++) {
            for (let x = 0; x < res; x++) {
                const idx = (y * res + x) * 4;
                const dist = Math.hypot(x - cx, y - cy) / maxR;
                let grad = 0;
                if (dist <= hard) grad = 1;
                else if (dist < 1) grad = 1 - (dist - hard) / (1 - hard);

                d[idx]     = Math.round(d[idx] * tintR);
                d[idx + 1] = Math.round(d[idx + 1] * tintG);
                d[idx + 2] = Math.round(d[idx + 2] * tintB);
                d[idx + 3] = Math.round(d[idx + 3] * grad);
            }
        }
        ctx.putImageData(imgData, 0, 0);
        return this.cacheCanvas;
    }
}

class CanvasZoomManager {
    constructor({ container, target, onTransformChange = () => {} } = {}) {
        this.container = container;
        this.target = target;
        this.onTransformChange = onTransformChange;
        this.scale = 1.0;
        this.panX = 0;
        this.panY = 0;
        this.isPanning = false;
        this.lastX = 0;
        this.lastY = 0;
        this.init();
    }
    init() {
        this.container.addEventListener('wheel', (e) => this.handleWheel(e), { passive: false });
    }
    handleWheel(e) {
        e.preventDefault();
        const rect = this.container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const prevScale = this.scale;
        const factor = e.deltaY < 0 ? 1.15 : 0.85;
        this.scale = Math.min(Math.max(0.05, this.scale * factor), 15.0);
        this.panX = mouseX - (mouseX - this.panX) * (this.scale / prevScale);
        this.panY = mouseY - (mouseY - this.panY) * (this.scale / prevScale);
        this.apply();
    }
    startPan(clientX, clientY) {
        this.isPanning = true;
        this.lastX = clientX;
        this.lastY = clientY;
    }
    pan(clientX, clientY) {
        if (!this.isPanning) return;
        this.panX += clientX - this.lastX;
        this.panY += clientY - this.lastY;
        this.lastX = clientX;
        this.lastY = clientY;
        this.apply();
    }
    endPan() { this.isPanning = false; }
    zoomDelta(delta) {
        const factor = delta > 0 ? 1.2 : 0.8;
        const cx = this.container.clientWidth / 2;
        const cy = this.container.clientHeight / 2;
        const prevScale = this.scale;
        this.scale = Math.min(Math.max(0.05, this.scale * factor), 15.0);
        this.panX = cx - (cx - this.panX) * (this.scale / prevScale);
        this.panY = cy - (cy - this.panY) * (this.scale / prevScale);
        this.apply();
    }
    screenToWorld(clientX, clientY) {
        const rect = this.container.getBoundingClientRect();
        return {
            x: (clientX - rect.left - this.panX) / this.scale,
            y: (clientY - rect.top - this.panY) / this.scale
        };
    }
    apply() {
        this.target.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.scale})`;
        this.onTransformChange(this.scale, this.panX, this.panY);
    }
}

class HistoryManager {
    constructor({ onStateChange = () => {} } = {}) {
        this.undoStack = [];
        this.redoStack = [];
        this.maxStates = 30;
        this.onStateChange = onStateChange;
    }
    push(action) {
        this.undoStack.push(action);
        if (this.undoStack.length > this.maxStates) this.undoStack.shift();
        this.redoStack = [];
        this.notify();
    }
    undo() {
        if (!this.canUndo()) return;
        const action = this.undoStack.pop();
        action.undo();
        this.redoStack.push(action);
        this.notify();
    }
    redo() {
        if (!this.canRedo()) return;
        const action = this.redoStack.pop();
        action.redo();
        this.undoStack.push(action);
        this.notify();
    }
    canUndo() { return this.undoStack.length > 0; }
    canRedo() { return this.redoStack.length > 0; }
    notify() { this.onStateChange(this.canUndo(), this.canRedo(), this.undoStack.length, this.redoStack.length); }
}

class Layer {
    constructor(id, name, width, height) {
        this.id = id;
        this.name = name;
        this.width = width;
        this.height = height;
        this.originalWidth = width;
        this.originalHeight = height;
        
        this.visible = true; 
        this.opacity = 1.0;
        this.blendMode = 'normal';
        
        this.canvas = document.createElement('canvas');
        this.canvas.width = width;
        this.canvas.height = height;
        this.canvas.style.width = width + 'px';
        this.canvas.style.height = height + 'px';
        this.canvas.className = 'engine-canvas-layer';
        this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
    }
    setSize(w, h, preserveData = true) {
        let temp = null;
        if (preserveData) {
            temp = document.createElement('canvas');
            temp.width = this.width;
            temp.height = this.height;
            temp.getContext('2d').drawImage(this.canvas, 0, 0);
        }
        this.width = w;
        this.height = h;
        this.canvas.width = w;
        this.canvas.height = h;
        this.canvas.style.width = w + 'px';
        this.canvas.style.height = h + 'px';
        if (temp) {
            this.ctx.drawImage(temp, 0, 0, temp.width, temp.height, 0, 0, w, h);
        }
    }
    getSnapshot() { return this.ctx.getImageData(0, 0, this.width, this.height); }
    restoreSnapshot(data) {
        if (this.width !== data.width || this.height !== data.height) {
            this.setSize(data.width, data.height, false);
        }
        this.ctx.putImageData(data, 0, 0);
    }
}

class LayerStackEngine {
    constructor({ defaultWidth = 1024, defaultHeight = 768, renderContainer, onStackChanged = () => {} } = {}) {
        this.defaultWidth = defaultWidth;
        this.defaultHeight = defaultHeight;
        this.container = renderContainer;
        this.onStackChanged = onStackChanged;
        this.layers = [];
        this.activeLayerId = null;
        this.counter = 0;
    }
    mergeDown(id) {
        const idx = this.layers.findIndex(l => l.id === id);
        if (idx <= 0) return null;

        const topLayer = this.layers[idx];
        const bottomLayer = this.layers[idx - 1];

        bottomLayer.ctx.save();
        bottomLayer.ctx.globalAlpha = topLayer.opacity;
        bottomLayer.ctx.globalCompositeOperation = (topLayer.blendMode === 'normal') 
            ? 'source-over' 
            : (topLayer.blendMode || 'source-over');
        
        bottomLayer.ctx.drawImage(topLayer.canvas, 0, 0);
        bottomLayer.ctx.restore();

        this.layers.splice(idx, 1);
        this.activeLayerId = bottomLayer.id;
        this.syncDOM();
        this.onStackChanged(this.getLayerList(), this.activeLayerId);

        return { topLayer, bottomLayer, index: idx };
    }
    createLayer(name = null, width = null, height = null) {
        this.counter++;
        const id = 'layer_' + this.counter + '_' + Math.random().toString(36).substring(2, 7);
        const layerName = name || `Capa ${this.counter}`;
        
        const active = this.getActiveLayer();
        const w = width || (active ? active.width : this.defaultWidth);
        const h = height || (active ? active.height : this.defaultHeight);
        
        const layer = new Layer(id, layerName, w, h);
        this.layers.push(layer);
        this.activeLayerId = id;
        this.syncDOM();
        this.onStackChanged(this.getLayerList(), this.activeLayerId);
        return layer;
    }
    duplicateLayer(id) {
        const src = this.getLayerById(id);
        if (!src) return null;
        this.counter++;
        const newLayer = new Layer('layer_' + this.counter + '_' + Math.random().toString(36).substring(2, 7), `${src.name} (Copia)`, src.width, src.height);
        newLayer.ctx.drawImage(src.canvas, 0, 0);
        newLayer.opacity = src.opacity;
        newLayer.visible = src.visible;
        newLayer.blendMode = src.blendMode;
        const idx = this.layers.findIndex(l => l.id === id);
        this.layers.splice(idx + 1, 0, newLayer);
        this.activeLayerId = newLayer.id;
        this.syncDOM();
        this.onStackChanged(this.getLayerList(), this.activeLayerId);
        return newLayer;
    }
    deleteLayer(id) {
        if (this.layers.length <= 1) return null;
        const idx = this.layers.findIndex(l => l.id === id);
        if (idx === -1) return null;
        const deleted = this.layers.splice(idx, 1)[0];
        if (this.activeLayerId === id) {
            this.activeLayerId = this.layers[Math.max(0, idx - 1)].id;
        }
        this.syncDOM();
        this.onStackChanged(this.getLayerList(), this.activeLayerId);
        return { layer: deleted, index: idx };
    }
    moveUp(id) {
        const idx = this.layers.findIndex(l => l.id === id);
        if (idx < this.layers.length - 1) {
            const temp = this.layers[idx];
            this.layers[idx] = this.layers[idx + 1];
            this.layers[idx + 1] = temp;
            this.syncDOM();
            this.onStackChanged(this.getLayerList(), this.activeLayerId);
            return true;
        }
        return false;
    }
    moveDown(id) {
        const idx = this.layers.findIndex(l => l.id === id);
        if (idx > 0) {
            const temp = this.layers[idx];
            this.layers[idx] = this.layers[idx - 1];
            this.layers[idx - 1] = temp;
            this.syncDOM();
            this.onStackChanged(this.getLayerList(), this.activeLayerId);
            return true;
        }
        return false;
    }
    flipHoriz(id) {
        const layer = this.getLayerById(id);
        if (!layer) return;
        const temp = document.createElement('canvas');
        temp.width = layer.width; temp.height = layer.height;
        const tctx = temp.getContext('2d');
        tctx.translate(layer.width, 0);
        tctx.scale(-1, 1);
        tctx.drawImage(layer.canvas, 0, 0);
        layer.ctx.clearRect(0, 0, layer.width, layer.height);
        layer.ctx.drawImage(temp, 0, 0);
    }
    flipVert(id) {
        const layer = this.getLayerById(id);
        if (!layer) return;
        const temp = document.createElement('canvas');
        temp.width = layer.width; temp.height = layer.height;
        const tctx = temp.getContext('2d');
        tctx.translate(0, layer.height);
        tctx.scale(1, -1);
        tctx.drawImage(layer.canvas, 0, 0);
        layer.ctx.clearRect(0, 0, layer.width, layer.height);
        layer.ctx.drawImage(temp, 0, 0);
    }
    getLayerById(id) { return this.layers.find(l => l.id === id) || null; }
    getActiveLayer() { return this.getLayerById(this.activeLayerId); }
    setActiveLayer(id) {
        this.activeLayerId = id;
        this.onStackChanged(this.getLayerList(), this.activeLayerId);
    }
    setLayerVisibility(id, v) {
        const layer = this.getLayerById(id);
        if (layer) {
            layer.visible = v;
            layer.canvas.style.display = v ? 'block' : 'none';
            this.onStackChanged(this.getLayerList(), this.activeLayerId);
        }
    }
    setLayerOpacity(id, op) {
        const layer = this.getLayerById(id);
        if (layer) {
            layer.opacity = op;
            layer.canvas.style.opacity = op;
            this.onStackChanged(this.getLayerList(), this.activeLayerId);
        }
    }
    setLayerBlendMode(id, mode) {
        const layer = this.getLayerById(id);
        if (layer) {
            layer.blendMode = mode;
            layer.canvas.style.mixBlendMode = mode;
            this.onStackChanged(this.getLayerList(), this.activeLayerId);
        }
    }
    syncDOM() {
        this.container.innerHTML = '';
        this.layers.forEach((l, idx) => {
            l.canvas.style.display = l.visible ? 'block' : 'none';
            l.canvas.style.opacity = l.opacity;
            l.canvas.style.mixBlendMode = l.blendMode || 'normal';
            l.canvas.style.zIndex = String(idx + 1);
            this.container.appendChild(l.canvas);
        });
    }
    getLayerList() {
        return this.layers.map(l => ({
            id: l.id,
            name: `${l.name} (${l.width}x${l.height})`,
            visible: l.visible,
            opacity: l.opacity,
            blendMode: l.blendMode || 'normal'
        }));
    }
}

class BrushSettingsEngine {
    constructor({ onSettingsChange = () => {} } = {}) {
        this.size = 50;
        this.aspectRatio = 0.0;
        this.hardness = 0.5;
        this.opacity = 1.0;
        this.force = 100.0;
        this.angle = 0;
        this.randomRotation = false;
        this.spacing = 15.0;
        this.fillShape = false;
        this.mainColor = '#ffffff';
        this.stampImage = null;
        this.tipRenderer = new BrushTipRenderer();
        this.onSettingsChange = onSettingsChange;
    }
    set(key, val, silent = false) {
        this[key] = val;
        if (!silent) this.onSettingsChange(key, val);
    }
    getStampDimensions() {
        return { w: this.size, h: this.size };
    }
    getTipCanvas() {
        return this.tipRenderer.renderTip({
            size: this.size,
            hardness: this.hardness,
            color: this.mainColor,
            texture: this.stampImage
        });
    }
}

class SelectionManager {
    constructor({ selectionCanvas, onSelectionChange = () => {} } = {}) {
        this.canvas = selectionCanvas;
        this.ctx = this.canvas.getContext('2d');
        this.onSelectionChange = onSelectionChange;
        this.polygon = [];
        this.hasSelection = false;
        this.maskCanvas = document.createElement('canvas');
        this.maskCtx = this.maskCanvas.getContext('2d');
        this.antsOffset = 0;
        this.animateAnts();
    }
    animateAnts() {
        if (this.hasSelection) {
            this.antsOffset = (this.antsOffset + 0.35) % 10;
            this.drawMarchingAnts();
        }
        requestAnimationFrame(() => this.animateAnts());
    }
    setSize(w, h) {
        this.canvas.width = w; this.canvas.height = h;
        this.canvas.style.width = w + 'px'; this.canvas.style.height = h + 'px';
        this.maskCanvas.width = w; this.maskCanvas.height = h;
        this.updateMask();
        this.drawMarchingAnts();
    }
    setRect(x, y, w, h) {
        this.polygon = [{ x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h }];
        this.hasSelection = (w > 1 && h > 1);
        this.updateMask();
        this.drawMarchingAnts();
        this.onSelectionChange(this.hasSelection);
    }
    setLasso(points) {
        this.polygon = points.map(p => ({ x: p.x, y: p.y }));
        this.hasSelection = points.length > 2;
        this.updateMask();
        this.drawMarchingAnts();
        this.onSelectionChange(this.hasSelection);
    }
    updateMask() {
        this.maskCtx.clearRect(0, 0, this.maskCanvas.width, this.maskCanvas.height);
        if (!this.hasSelection || this.polygon.length < 3) return;
        this.maskCtx.fillStyle = '#ffffff';
        this.maskCtx.beginPath();
        this.maskCtx.moveTo(this.polygon[0].x, this.polygon[0].y);
        for (let i = 1; i < this.polygon.length; i++) this.maskCtx.lineTo(this.polygon[i].x, this.polygon[i].y);
        this.maskCtx.closePath();
        this.maskCtx.fill();
    }
    clear() {
        this.polygon = [];
        this.hasSelection = false;
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.maskCtx.clearRect(0, 0, this.maskCanvas.width, this.maskCanvas.height);
        this.onSelectionChange(false);
    }
    applyClipping(targetCtx) {
        if (!this.hasSelection || this.polygon.length < 3) return false;
        targetCtx.beginPath();
        targetCtx.moveTo(this.polygon[0].x, this.polygon[0].y);
        for (let i = 1; i < this.polygon.length; i++) targetCtx.lineTo(this.polygon[i].x, this.polygon[i].y);
        targetCtx.closePath();
        targetCtx.clip();
        return true;
    }
    drawMarchingAnts(previewPoints = null) {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        const pts = previewPoints || this.polygon;
        if (!pts || pts.length < 2) return;
        
        this.ctx.save();
        this.ctx.strokeStyle = '#ffffff';
        this.ctx.lineWidth = 1.5;
        this.ctx.setLineDash([5, 5]);
        this.ctx.lineDashOffset = -this.antsOffset;
        
        this.ctx.beginPath();
        this.ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) this.ctx.lineTo(pts[i].x, pts[i].y);
        if (!previewPoints && pts.length > 2) this.ctx.closePath();
        this.ctx.stroke();

        this.ctx.strokeStyle = '#0284c7';
        this.ctx.lineDashOffset = -this.antsOffset + 5;
        this.ctx.stroke();

        this.ctx.restore();
    }
    getBounds(layer = null) {
        if (!this.hasSelection || this.polygon.length === 0) {
            const w = layer ? layer.width : this.canvas.width;
            const h = layer ? layer.height : this.canvas.height;
            return { x: 0, y: 0, width: w, height: h };
        }
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        this.polygon.forEach(p => {
            if (p.x < minX) minX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.x > maxX) maxX = p.x;
            if (p.y > maxY) maxY = p.y;
        });
        const maxW = layer ? layer.width : this.canvas.width;
        const maxH = layer ? layer.height : this.canvas.height;
        return {
            x: Math.max(0, Math.floor(minX)),
            y: Math.max(0, Math.floor(minY)),
            width: Math.min(maxW - minX, Math.ceil(maxX - minX)),
            height: Math.min(maxH - minY, Math.ceil(maxY - minY))
        };
    }
}

class ClipboardManager {
    constructor() {
        this.buffer = null;
        this.bounds = null;
    }
    async copy(layer, selectionManager) {
        if (!layer) return null;
        const b = selectionManager.getBounds(layer);
        if (b.width <= 0 || b.height <= 0) return null;

        const clipCanvas = document.createElement('canvas');
        clipCanvas.width = b.width;
        clipCanvas.height = b.height;
        const cctx = clipCanvas.getContext('2d');

        if (selectionManager.hasSelection) {
            cctx.save();
            cctx.drawImage(selectionManager.maskCanvas, b.x, b.y, b.width, b.height, 0, 0, b.width, b.height);
            cctx.globalCompositeOperation = 'source-in';
            cctx.drawImage(layer.canvas, b.x, b.y, b.width, b.height, 0, 0, b.width, b.height);
            cctx.restore();
        } else {
            cctx.drawImage(layer.canvas, 0, 0);
        }

        this.buffer = clipCanvas;
        this.bounds = { ...b };

        try {
            clipCanvas.toBlob(async (blob) => {
                if (blob && navigator.clipboard && window.ClipboardItem) {
                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                }
            }, 'image/png');
        } catch (e) {}

        const hud = document.getElementById('hud');
        if (hud) hud.textContent = `✓ Trozo copiado: ${b.width}x${b.height} px`;

        return clipCanvas;
    }
    async cut(layer, selectionManager) {
        if (!layer) return null;
        const res = await this.copy(layer, selectionManager);
        const ctx = layer.ctx;
        ctx.save();
        if (selectionManager.hasSelection) {
            ctx.globalCompositeOperation = 'destination-out';
            selectionManager.applyClipping(ctx);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, layer.width, layer.height);
        } else {
            ctx.clearRect(0, 0, layer.width, layer.height);
        }
        ctx.restore();
        return res;
    }
}

class ToolManager {
    constructor({ previewCanvas, layerStackEngine, brushSettingsEngine, selectionManager, cadEngine, onColorSampled = () => {}, onStrokeStart = () => {}, onStrokeFinished = () => {} } = {}) {
        this.preview = previewCanvas;
        this.pctx = previewCanvas.getContext('2d');
        this.layers = layerStackEngine;
        this.brush = brushSettingsEngine;
        this.selection = selectionManager;
        this.cad = cadEngine;
        this.onColorSampled = onColorSampled;
        this.onStrokeStart = onStrokeStart;
        this.onStrokeFinished = onStrokeFinished;

        this.currentTool = 'brush';
        this.isDrawing = false;
        this.startX = 0;
        this.startY = 0;
        this.lastX = 0;
        this.lastY = 0;
        this.distAccum = 0;
        this.cloneSource = null;
        this.cloneBuffer = null;
        this.lassoPoints = [];
        this.polyPoints = [];
        this.lastPolyClickTime = 0;
        this.moveSnapshotCanvas = null;
    }
   setTool(tool) {
    if (this.currentTool === 'poly' && tool !== 'poly') {
        this.polyPoints = [];
    }
    this.currentTool = tool;
    if (this.cad) this.cad.active = (tool === 'cad');
    const hud = document.getElementById('hud');
    if (hud) hud.textContent = `Herramienta Activa: ${tool.toUpperCase()}`;
}
    cancelSelection() {
        this.lassoPoints = [];
        this.polyPoints = [];
        this.isDrawing = false;
        if (this.preview && this.pctx) this.pctx.clearRect(0, 0, this.preview.width, this.preview.height);
        if (this.selection) this.selection.clear();
    }
   pointerDown(x, y, e) {
    if (this.currentTool === 'cad' && this.cad) {
        this.cad.handlePointerDown(x, y, e);
        return;
    }

    if (e.button === 2) return;

    if (this.currentTool === 'poly') {
        const now = performance.now();
        const isDoubleClick = (now - this.lastPolyClickTime < 320) || e.detail === 2;
        this.lastPolyClickTime = now;

        if (this.polyPoints.length >= 3) {
            const d = Math.hypot(x - this.polyPoints[0].x, y - this.polyPoints[0].y);
            if (d < 15 || isDoubleClick) {
                this.finishPolySelection();
                return;
            }
        }
        this.polyPoints.push({ x, y });
        this.selection.drawMarchingAnts(this.polyPoints);
        return;
    }

    if (this.currentTool === 'fill') {
        const layer = this.layers.getActiveLayer();
        if (layer) { 
            this.onStrokeStart(layer); 
            const filled = FloodFillTool.fill(layer, x, y, this.brush.mainColor, this.brush.opacity, 15, this.selection);
            if (filled) this.onStrokeFinished(layer);
        }
        return;
    }

    if (e.altKey && this.currentTool === 'clone') {
        this.fijarOrigenClonacion(x, y);
        return;
    }

    if (e.button !== 0) return;
    const layer = this.layers.getActiveLayer();
    if (!layer) return;

    if (['brush', 'eraser', 'clone', 'stamp', 'move'].includes(this.currentTool)) {
        this.onStrokeStart(layer);
    }

    this.isDrawing = true;
    this.startX = x;
    this.startY = y;
    this.lastX = x;
    this.lastY = y;
    this.distAccum = 0;

    if (this.currentTool === 'move') {
        this.moveSnapshotCanvas = document.createElement('canvas');
        this.moveSnapshotCanvas.width = layer.width;
        this.moveSnapshotCanvas.height = layer.height;
        this.moveSnapshotCanvas.getContext('2d').drawImage(layer.canvas, 0, 0);
        return;
    }

    if (this.currentTool === 'eyedropper') {
        this.sampleColor(x, y);
        this.isDrawing = false;
        return;
    }

    if (this.currentTool === 'lasso') {
        this.lassoPoints = [{ x, y }];
        return;
    }

    if (this.currentTool === 'rectSelect') {
        this.selection.clear();
        return;
    }

    if (['brush', 'eraser', 'clone', 'stamp'].includes(this.currentTool)) {
        layer.ctx.save();
        this.selection.applyClipping(layer.ctx);
        layer.ctx.globalCompositeOperation = (this.currentTool === 'eraser') ? 'destination-out' : 'source-over';
        layer.ctx.globalAlpha = this.brush.opacity * (this.brush.force / 100);
        this.drawInterpolatedStampDirect(layer.ctx, x, y);
        layer.ctx.restore();
    }
}
   
    fijarOrigenClonacion(x, y) {
        const active = this.layers.getActiveLayer();
        if (active) {
            this.cloneSource = { x, y };
            this.cloneBuffer = document.createElement('canvas');
            this.cloneBuffer.width = active.width;
            this.cloneBuffer.height = active.height;
            this.cloneBuffer.getContext('2d').drawImage(active.canvas, 0, 0);
            const hud = document.getElementById('hud');
            if (hud) hud.textContent = `✓ Origen de clonación fijado en (${Math.round(x)}, ${Math.round(y)})`;
        }
    }
    pointerMove(x, y) {
        if (this.currentTool === 'cad') {
            if (this.cad) this.cad.handlePointerMove(x, y);
            return;
        }

        if (this.currentTool === 'poly') {
            if (this.polyPoints.length > 0) {
                this.selection.drawMarchingAnts(this.polyPoints.concat([{ x, y }]));
            }
            return;
        }

        if (!this.isDrawing) return;
        const layer = this.layers.getActiveLayer();
        if (!layer) return;

        if (['brush', 'eraser', 'clone', 'stamp'].includes(this.currentTool)) {
            layer.ctx.save();
            this.selection.applyClipping(layer.ctx);
            layer.ctx.globalCompositeOperation = (this.currentTool === 'eraser') ? 'destination-out' : 'source-over';
            layer.ctx.globalAlpha = this.brush.opacity * (this.brush.force / 100);
            this.drawContinuousStroke(layer.ctx, this.lastX, this.lastY, x, y);
            layer.ctx.restore();
        } else if (this.currentTool === 'move') {
            if (this.moveSnapshotCanvas) {
                layer.ctx.clearRect(0, 0, layer.width, layer.height);
                layer.ctx.drawImage(this.moveSnapshotCanvas, Math.round(x - this.startX), Math.round(y - this.startY));
            }
        } else if (this.currentTool === 'rectSelect') {
            this.selection.setRect(
                Math.min(this.startX, x), Math.min(this.startY, y),
                Math.abs(x - this.startX), Math.abs(y - this.startY)
            );
        } else if (this.currentTool === 'lasso') {
            this.lassoPoints.push({ x, y });
            this.selection.setLasso(this.lassoPoints);
        }
        this.lastX = x;
        this.lastY = y;
    }

    pointerUp(x, y) {
    if (this.currentTool === 'cad' && this.cad) {
        this.cad.handlePointerUp();
        return;
    }
    if (this.currentTool === 'poly') return;

    if (!this.isDrawing) return;
    this.isDrawing = false;
    this.distAccum = 0;
    this.moveSnapshotCanvas = null;

    const layer = this.layers.getActiveLayer();
    if (this.currentTool === 'rectSelect') {
        if (Math.abs(x - this.startX) <= 2 && Math.abs(y - this.startY) <= 2) {
            this.selection.clear();
        }
        return;
    }

    if (this.currentTool === 'lasso') {
        return;
    }

    if (layer) this.onStrokeFinished(layer);
}


    finishPolySelection() {
        if (this.polyPoints.length >= 3) {
            const puntos = this.polyPoints.map(p => ({ x: p.x, y: p.y }));
            this.polyPoints = [];
            this.selection.setLasso(puntos);
        } else {
            this.polyPoints = [];
            this.selection.clear();
        }
    }
    drawContinuousStroke(ctx, x1, y1, x2, y2) {
        const dist = Math.hypot(x2 - x1, y2 - y1);
        const step = Math.max(1, this.brush.size * (Math.max(1, this.brush.spacing) / 100));

        if (dist === 0) {
            if (this.distAccum >= step) {
                this.drawInterpolatedStampDirect(ctx, x2, y2);
                this.distAccum = 0;
            }
            return;
        }

        this.distAccum += dist;
        if (this.distAccum >= step) {
            const n = Math.floor(this.distAccum / step);
            for (let i = 1; i <= n; i++) {
                const t = Math.min(1.0, (step * i) / dist);
                this.drawInterpolatedStampDirect(ctx, x1 + (x2 - x1) * t, y1 + (y2 - y1) * t);
            }
            this.distAccum %= step;
        }
    }
    drawInterpolatedStampDirect(ctx, x, y) {
        const dims = this.brush.getStampDimensions();

        if (this.currentTool === 'clone') {
            if (!this.cloneSource || !this.cloneBuffer) return;
            const sx = this.cloneSource.x + (x - this.startX);
            const sy = this.cloneSource.y + (y - this.startY);
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, dims.w / 2, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(this.cloneBuffer, sx - dims.w / 2, sy - dims.h / 2, dims.w, dims.h, x - dims.w / 2, y - dims.h / 2, dims.w, dims.h);
            ctx.restore();
            return;
        }

        const tipCanvas = this.brush.getTipCanvas();
        ctx.save();
        ctx.translate(x, y);
        ctx.drawImage(tipCanvas, -dims.w / 2, -dims.h / 2, dims.w, dims.h);
        ctx.restore();
    }
    sampleColor(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        let sampled = null;
        
        for (let i = this.layers.layers.length - 1; i >= 0; i--) {
            const l = this.layers.layers[i];
            if (!l.visible || ix < 0 || ix >= l.width || iy < 0 || iy >= l.height) continue;
            const px = l.ctx.getImageData(ix, iy, 1, 1).data;
            if (px[3] > 10) {
                sampled = "#" + ((1 << 24) + (px[0] << 16) + (px[1] << 8) + px[2]).toString(16).slice(1);
                break;
            }
        }
        if (!sampled) sampled = "#000000";
        this.onColorSampled(sampled);
        const hud = document.getElementById('hud');
        if (hud) hud.textContent = `Color muestreado: ${sampled.toUpperCase()}`;
    }
}

class ProjectExporter {
    static exportImage(layerStack, format = 'png') {
        let maxWidth = 1;
        let maxHeight = 1;
        layerStack.layers.forEach(l => {
            if (l.width > maxWidth) maxWidth = l.width;
            if (l.height > maxHeight) maxHeight = l.height;
        });

        const out = document.createElement('canvas');
        out.width = maxWidth;
        out.height = maxHeight;
        const octx = out.getContext('2d');

        if (format === 'jpg' || format === 'jpeg') {
            octx.fillStyle = '#ffffff';
            octx.fillRect(0, 0, maxWidth, maxHeight);
        }

        layerStack.layers.forEach(l => {
            if (l.visible) {
                octx.save();
                octx.globalAlpha = l.opacity;
                octx.globalCompositeOperation = (l.blendMode === 'normal') ? 'source-over' : (l.blendMode || 'source-over');
                octx.drawImage(l.canvas, 0, 0);
                octx.restore();
            }
        });

        const mime = (format === 'jpg' || format === 'jpeg') ? 'image/jpeg' : 'image/png';
        const a = document.createElement('a');
        a.download = `proyecto_${Date.now()}.${format}`;
        a.href = out.toDataURL(mime, 0.95);
        a.click();
    }
}

    syncInteractiveCanvases(w, h) {
        this.previewCanvas.width = w; this.previewCanvas.height = h;
        this.previewCanvas.style.width = w + 'px'; this.previewCanvas.style.height = h + 'px';

        this.cadCanvas.width = w; this.cadCanvas.height = h;
        this.cadCanvas.style.width = w + 'px'; this.cadCanvas.style.height = h + 'px';

        this.selectionCanvas.width = w; this.selectionCanvas.height = h;
        this.selectionCanvas.style.width = w + 'px'; this.selectionCanvas.style.height = h + 'px';

        if (this.cad) this.cad.setSize(w, h);
        if (this.selection) this.selection.setSize(w, h);
    }
    initEngines() {
        this.zoom = new CanvasZoomManager({
            container: this.stage,
            target: this.target,
            onTransformChange: (scale) => {
                const hud = document.getElementById('hud');
                if (hud) {
                    hud.textContent = `Zoom: ${(scale * 100).toFixed(0)}% | Q: Adaptar Trozo`;
                }
            }
        });

        this.history = new HistoryManager({ onStateChange: () => {} });

        this.layers = new LayerStackEngine({
            defaultWidth: this.defaultWidth,
            defaultHeight: this.defaultHeight,
            renderContainer: this.layersContainer,
            onStackChanged: (list, activeId) => {
                if (this.reorderList) {
                    this.reorderList.setItems(list.map(l => ({
                        id: l.id, name: l.name, visible: l.visible, opacity: l.opacity
                    })), list.findIndex(l => l.id === activeId));
                }
            }
        });

        this.brush = new BrushSettingsEngine({
            onSettingsChange: (k, v) => {
                if (k === 'mainColor' && this.colorPicker && !this.isInternalColorSync) {
                    this.isInternalColorSync = true;
                    this.colorPicker.setHex(v);
                    this.isInternalColorSync = false;
                }
            }
        });

        this.selection = new SelectionManager({ selectionCanvas: this.selectionCanvas });
        this.clipboard = new ClipboardManager();
        this.cad = new CadVectorEngine({ canvas: this.cadCanvas, brushEngine: this.brush });

        this.tools = new ToolManager({
            previewCanvas: this.previewCanvas,
            layerStackEngine: this.layers,
            brushSettingsEngine: this.brush,
            selectionManager: this.selection,
            cadEngine: this.cad,
            onColorSampled: (hex) => {
                this.isInternalColorSync = true;
                this.brush.set('mainColor', hex, true);
                if (this.colorPicker) this.colorPicker.setHex(hex);
                this.isInternalColorSync = false;
            },
            onStrokeStart: (layer) => { this.preStrokeState = layer.getSnapshot(); },
            onStrokeFinished: (layer) => {
                if (!this.preStrokeState) return;
                const before = this.preStrokeState;
                const after = layer.getSnapshot();
                const targetLayer = layer;
                this.history.push({
                    undo: () => targetLayer.restoreSnapshot(before),
                    redo: () => targetLayer.restoreSnapshot(after)
                });
                this.preStrokeState = null;
            }
        });

        this.layers.createLayer('Fondo', this.defaultWidth, this.defaultHeight);
        requestAnimationFrame(() => this.ajustarCanvasACapaActiva());
    }
    centerView(w = null, h = null) {
        const act = this.layers.getActiveLayer();
        const width = w || (act ? act.width : this.defaultWidth);
        const height = h || (act ? act.height : this.defaultHeight);
        const leftMargin = 70;
        const rightMargin = 330;
        const availW = Math.max(100, window.innerWidth - leftMargin - rightMargin);
        const availH = Math.max(100, window.innerHeight - 50);

        const fit = Math.min(availW / width, availH / height, 1.0) * 0.90;
        this.zoom.scale = Math.max(0.05, fit);
        const centerX = leftMargin + availW / 2;
        const centerY = window.innerHeight / 2;
        this.zoom.panX = centerX - (width * this.zoom.scale) / 2;
        this.zoom.panY = centerY - (height * this.zoom.scale) / 2;
        this.zoom.apply();
    }
    ajustarCanvasACapaActiva() {
        const act = this.layers.getActiveLayer();
        if (!act) return;

        // El ancho y alto exacto de la capa es el del trozo
        const targetW = act.originalWidth || act.width;
        const targetH = act.originalHeight || act.height;

        if (act.width !== targetW || act.height !== targetH) {
            act.setSize(targetW, targetH, true);
        }

        this.layers.layers.forEach(l => {
            l.canvas.style.display = l.visible ? 'block' : 'none';
        });

        this.defaultWidth = targetW;
        this.defaultHeight = targetH;
        this.layers.defaultWidth = targetW;
        this.layers.defaultHeight = targetH;

        if (this.layersContainer) {
            this.layersContainer.style.width = targetW + 'px';
            this.layersContainer.style.height = targetH + 'px';
            this.layersContainer.style.overflow = 'hidden';
        }

        this.syncInteractiveCanvases(targetW, targetH);
        this.centerView(targetW, targetH);

        if (this.reorderList) {
            this.reorderList.setItems(
                this.layers.getLayerList(),
                this.layers.layers.findIndex(l => l.id === act.id)
            );
        }

        const hud = document.getElementById('hud');
        if (hud) {
            hud.textContent = `✓ Capa Trozo: ${act.name} [${targetW}x${targetH} px]`;
        }
    }
    adaptarCapaActivaAlCanvas() {
        const act = this.layers.getActiveLayer();
        if (!act) return;
        const targetW = this.initialCanvasWidth;
        const targetH = this.initialCanvasHeight;
        if (act.width === targetW && act.height === targetH) return;

        const before = act.getSnapshot();
        act.setSize(targetW, targetH, true);
        const after = act.getSnapshot();

        this.history.push({
            undo: () => {
                act.restoreSnapshot(before);
                this.syncInteractiveCanvases(before.width, before.height);
                this.centerView(before.width, before.height);
            },
            redo: () => {
                act.restoreSnapshot(after);
                this.syncInteractiveCanvases(after.width, after.height);
                this.centerView(after.width, after.height);
            }
        });
        this.syncInteractiveCanvases(targetW, targetH);
        this.centerView(targetW, targetH);
    }
    // PEGAR COMO CAPA EL TROZO EXACTO Y VER SOLO ESE TROZO
    pegarComoNuevaCapa(canvasRecorte, nombre = 'Trozo Pegado') {
        if (!canvasRecorte || canvasRecorte.width <= 0 || canvasRecorte.height <= 0) return;
        
        // Dimensiones exactas del recorte copiado
        const w = canvasRecorte.naturalWidth || canvasRecorte.width;
        const h = canvasRecorte.naturalHeight || canvasRecorte.height;

        // Crear nueva capa con el tamaño exacto del trozo
        const nuevaCapa = this.layers.createLayer(`${nombre} (${w}x${h})`, w, h);
        nuevaCapa.originalWidth = w;
        nuevaCapa.originalHeight = h;
        
        // Dibujar el trozo en (0,0) de esta nueva capa
        nuevaCapa.ctx.drawImage(canvasRecorte, 0, 0, w, h);

        const capaId = nuevaCapa.id;
        const indiceOriginal = this.layers.layers.findIndex(l => l.id === capaId);

        this.layers.setActiveLayer(nuevaCapa.id);

        this.history.push({
            undo: () => this.layers.deleteLayer(capaId),
            redo: () => {
                this.layers.layers.splice(indiceOriginal, 0, nuevaCapa);
                this.layers.setActiveLayer(nuevaCapa.id);
                this.layers.syncDOM();
                this.ajustarCanvasACapaActiva();
            }
        });

        // Limpiar selección para ver el trozo limpio
        this.selection.clear();

     
        this.ajustarCanvasACapaActiva();
    }

            menu.style.display = 'none';

            if (act) {
                const before = act.getSnapshot();
                await this.clipboard.cut(act, this.selection);
                const after = act.getSnapshot();
                this.history.push({
                    undo: () => act.restoreSnapshot(before),
                    redo: () => act.restoreSnapshot(after)
                });

        };

        document.getElementById('ctx-paste').onclick = () => {

        const rMove = itemLayers.addRow(4);
        rMove.append(new UI.Button({ text: 'Move Up ▲', onClick: () => { this.layers.moveUp(this.layers.activeLayerId); this.ajustarCanvasACapaActiva(); } }));
        rMove.append(new UI.Button({ text: 'Move Down ▼', onClick: () => { this.layers.moveDown(this.layers.activeLayerId); this.ajustarCanvasACapaActiva(); } }));
        rMove.append(new UI.Button({ text: 'Flip H', onClick: () => this.layers.flipHoriz(this.layers.activeLayerId) }));
        rMove.append(new UI.Button({ text: 'Flip V', onClick: () => this.layers.flipVert(this.layers.activeLayerId) }));
 
        const rBlend = itemLayers.addRow(4);
        const selBlend = new UI.Select({
            options: [
          { value: 'normal',      label: 'Blend: Normal' },
{ value: 'multiply',    label: 'Blend: Multiply' },
{ value: 'screen',      label: 'Blend: Screen' },
{ value: 'overlay',     label: 'Blend: Overlay' },
{ value: 'darken',      label: 'Blend: Darken' },
{ value: 'lighten',     label: 'Blend: Lighten' },
{ value: 'color-dodge', label: 'Blend: Color Dodge' },
{ value: 'color-burn',  label: 'Blend: Color Burn' }
            ],
            value: 'normal'
        });
        selBlend.element.addEventListener('change', () => {
            const act = this.layers.getActiveLayer();
            if (act) this.layers.setLayerBlendMode(act.id, selBlend.getValue());
        });
        rBlend.append(selBlend);

        this.reorderList = new UI.ReorderList({
            items: this.layers.getLayerList(),
            onSelect: (item) => {
                this.layers.setActiveLayer(item.id);
                const act = this.layers.getActiveLayer();
                if (act && selBlend.element) selBlend.element.value = act.blendMode || 'normal';
                this.ajustarCanvasACapaActiva();
            },
            onVisibilityChange: (item, idx, v) => this.layers.setLayerVisibility(item.id, v)
        });
        itemLayers.append(this.reorderList);

        itemLayers.append(new UI.ConfigurableSlider({
            label: 'Layer Opacity', min: 0, max: 1, step: 0.01, value: 1.0,
            onChange: (v) => this.layers.setLayerOpacity(this.layers.activeLayerId, v)
        }));

       
        const itemClip = accordion.addItem({ title: 'Clipboard & Selection', open: true });
        const rClip = itemClip.addRow(4);
        rClip.append(new UI.Button({ 
            text: 'Copy (Ctrl+C)', variant: 'primary', 
            onClick: async () => { await this.clipboard.copy(this.layers.getActiveLayer(), this.selection); }
        }));
        rClip.append(new UI.Button({ 
            text: 'Cut (Ctrl+X)', 
            onClick: async () => { await this.clipboard.cut(this.layers.getActiveLayer(), this.selection); }
        }));
        rClip.append(new UI.Button({ 
            text: 'Paste Snippet (Ctrl+V)', variant: 'primary', 
            onClick: () => { if (this.clipboard.buffer) this.pegarComoNuevaCapa(this.clipboard.buffer, 'Copied Snippet'); }
        }));
        rClip.append(new UI.Button({ text: 'Deselect (Esc)', onClick: () => this.selection.clear() }));

       
        const itemProj = accordion.addItem({ title: 'Save / Export', open: true });
        const rExp = itemProj.addRow(4);
        rExp.append(new UI.Button({ text: 'Guardar PNG', variant: 'primary', onClick: () => ProjectExporter.exportImage(this.layers, 'png') }));
        rExp.append(new UI.Button({ text: 'Guardar JPG', onClick: () => ProjectExporter.exportImage(this.layers, 'jpg') }));

        panelRight.append(accordion);
        this.rightContainer.addPanel(panelRight);
    }
     bindEvents() {
    let isSpacePressed = false;

    window.addEventListener('contextmenu', (e) => {
        if (e.target.closest('#canvas-stage')) {
            e.preventDefault();
            if (this.tools.currentTool === 'cad') return;

            const coords = this.zoom.screenToWorld(e.clientX, e.clientY);
            this.contextCoords = coords;

            const cloneOpt = document.getElementById('ctx-clone-origin');
            if (cloneOpt) {
                cloneOpt.style.display = (this.tools.currentTool === 'clone') ? 'flex' : 'none';
            }

            const menu = this.ctxMenu;
            menu.style.display = 'block';
            
            const posX = Math.min(e.clientX, window.innerWidth - 230);
            const posY = Math.min(e.clientY, window.innerHeight - 260);

            menu.style.left = posX + 'px';
            menu.style.top = posY + 'px';
        }
    });

    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            const file = e.dataTransfer.files[0];
            if (file.type.startsWith('image/')) {
                const img = new Image();
                img.onload = () => this.pegarComoNuevaCapa(img, file.name.replace(/\.[^/.]+$/, ""));
                img.src = URL.createObjectURL(file);
            }
        }
    });

    window.addEventListener('paste', async (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
        let pastedImage = false;

        if (items) {
            for (let item of items) {
                if (item.type.indexOf('image') !== -1) {
                    const blob = item.getAsFile();
                    if (blob) {
                        pastedImage = true;
                        e.preventDefault();
                        const img = new Image();
                        img.onload = () => this.pegarComoNuevaCapa(img, 'Trozo Pegado');
                        img.src = URL.createObjectURL(blob);
                        return;
                    }
                }
            }
        }
        if (!pastedImage && this.clipboard.buffer) {
            e.preventDefault();
            this.pegarComoNuevaCapa(this.clipboard.buffer, 'Trozo Pegado');
        }
    });

    window.addEventListener('keydown', async (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        if (e.code === 'Space' && !isSpacePressed) {
            isSpacePressed = true;
            this.stage.style.cursor = 'grab';
        }
        if (e.code === 'Enter' && this.tools.currentTool === 'cad') {
            e.preventDefault();
            const act = this.layers.getActiveLayer();
            if (act) {
                this.tools.onStrokeStart(act);
                this.cad.bakeToLayer(act);
                this.cad.clearAll();
                this.tools.onStrokeFinished(act);
            }
            return;
        }
        if (e.ctrlKey && (e.code === 'KeyC' || e.key === 'c' || e.key === 'C')) {
            e.preventDefault();
            await this.clipboard.copy(this.layers.getActiveLayer(), this.selection);
        }
        if (e.ctrlKey && (e.code === 'KeyX' || e.key === 'x' || e.key === 'X')) {
            e.preventDefault();
            const act = this.layers.getActiveLayer();
            if (act) await this.clipboard.cut(act, this.selection);
        }
        if (e.ctrlKey && e.code === 'KeyZ') {
            if (e.shiftKey) this.history.redo();
            else this.history.undo();
            e.preventDefault();
        }
        if (e.key === 'Escape') {
            e.preventDefault();
            this.tools.cancelSelection();
            if (this.cad) this.cad.clearAll();
            this.ctxMenu.style.display = 'none';
        }
        if (e.key === 'q' || e.key === 'Q') {
            e.preventDefault();
            this.ajustarCanvasACapaActiva();
        }
        if (e.key === 'w' || e.key === 'W') {
            e.preventDefault();
            this.adaptarCapaActivaAlCanvas();
        }
        if (e.key === 'g' || e.key === 'G') this.setActiveTool('fill');
        if (e.key === 'b' || e.key === 'B') this.setActiveTool('brush');
        if (e.key === 'e' || e.key === 'E') this.setActiveTool('eraser');
        if (e.key === 'c' && !e.ctrlKey) this.setActiveTool('clone');
        if (e.key === 'm' || e.key === 'M') this.setActiveTool('move');
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
            isSpacePressed = false;
            this.stage.style.cursor = 'crosshair';
            this.zoom.endPan();
        }
    });

    this.stage.addEventListener('pointerdown', (e) => {
        this.ctxMenu.style.display = 'none';
        if (isSpacePressed || e.button === 1) {
            this.zoom.startPan(e.clientX, e.clientY);
            return;
        }
        const coords = this.zoom.screenToWorld(e.clientX, e.clientY);
        this.tools.pointerDown(coords.x, coords.y, e);
    });

    window.addEventListener('pointermove', (e) => {
        if (this.zoom.isPanning) {
            this.zoom.pan(e.clientX, e.clientY);
            return;
        }
        const coords = this.zoom.screenToWorld(e.clientX, e.clientY);
        this.tools.pointerMove(coords.x, coords.y);
    });

    window.addEventListener('pointerup', (e) => {
        if (this.zoom.isPanning) {
            this.zoom.endPan();
            return;
        }
        const coords = this.zoom.screenToWorld(e.clientX, e.clientY);
        this.tools.pointerUp(coords.x, coords.y);
    });
}


}

window.addEventListener('DOMContentLoaded', () => {
    window.AppInstance = new ApplicationAdapter();
});
</script>
