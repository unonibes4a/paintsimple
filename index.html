    syncInteractiveCanvases(w, h, resizeLayers = false) {
        this.previewCanvas.width = w; this.previewCanvas.height = h;
        this.previewCanvas.style.width = w + 'px'; this.previewCanvas.style.height = h + 'px';

        this.cadCanvas.width = w; this.cadCanvas.height = h;
        this.cadCanvas.style.width = w + 'px'; this.cadCanvas.style.height = h + 'px';

        this.selectionCanvas.width = w; this.selectionCanvas.height = h;
        this.selectionCanvas.style.width = w + 'px'; this.selectionCanvas.style.height = h + 'px';

        if (this.cad) this.cad.setSize(w, h);
        if (this.selection) this.selection.setSize(w, h);

        if (resizeLayers && this.layers) {
            this.layers.layers.forEach(l => l.setSize(w, h, true));
        }
    }
    initEngines() {
        this.zoom = new CanvasZoomManager({
            container: this.stage,
            target: this.target,
            onTransformChange: (scale, panX, panY) => {
                const hud = document.getElementById('hud');
                if (hud) {
                    const cadType = (this.cad && this.cad.currentType) ? this.cad.currentType : 'Off';
                    hud.textContent = `Zoom: ${(scale * 100).toFixed(0)}% | CAD: ${cadType} | Q: Adaptar`;
                }
            }
        });

        this.history = new HistoryManager({ onStateChange: () => {} });

        this.layers = new LayerStackEngine({
            defaultWidth: this.defaultWidth,
            defaultHeight: this.defaultHeight,
            renderContainer: this.layersContainer,
            onStackChanged: (list, activeId) => {
                if (this.reorderList) {
                    this.reorderList.setItems(list.map(l => ({
                        id: l.id, name: l.name, visible: l.visible, opacity: l.opacity
                    })), list.findIndex(l => l.id === activeId));
                }
            }
        });

        this.brush = new BrushSettingsEngine({
            onSettingsChange: (k, v) => {
                if (k === 'mainColor' && this.colorPicker && !this.isInternalColorSync) {
                    this.isInternalColorSync = true;
                    this.colorPicker.setHex(v);
                    this.isInternalColorSync = false;
                }
                this.updateBrushPreview();
                if (this.cad && this.cad.useBrushStamp) this.cad.render();
            }
        });

        this.selection = new SelectionManager({ selectionCanvas: this.selectionCanvas });
        this.clipboard = new ClipboardManager();

        this.cad = new CadVectorEngine({
            canvas: this.cadCanvas,
            brushEngine: this.brush,
            getCoords: (e) => this.zoom.screenToWorld(e.clientX, e.clientY),
            onStateChange: (engine) => {
                const hud = document.getElementById('hud');
                if (hud) {
                    const ctype = (engine && engine.currentType) ? engine.currentType : 'bezier';
                    const slen = (engine && engine.shapes) ? engine.shapes.length : 0;
                    hud.textContent = `CAD: ${ctype} | Figuras: ${slen}`;
                }
            }
        });

        this.tools = new ToolManager({
            previewCanvas: this.previewCanvas,
            layerStackEngine: this.layers,
            brushSettingsEngine: this.brush,
            selectionManager: this.selection,
            cadEngine: this.cad,
            onColorSampled: (hex) => {
                this.isInternalColorSync = true;
                this.brush.set('mainColor', hex, true);
                if (this.colorPicker) this.colorPicker.setHex(hex);
                this.isInternalColorSync = false;
                this.updateBrushPreview();
            },
            onStrokeStart: (layer) => { this.preStrokeState = layer.getSnapshot(); },
            onStrokeFinished: (layer) => {
                if (!this.preStrokeState) return;
                const before = this.preStrokeState;
                const after = layer.getSnapshot();
                const targetLayer = layer;
                this.history.push({
                    undo: () => targetLayer.restoreSnapshot(before),
                    redo: () => targetLayer.restoreSnapshot(after)
                });
                this.preStrokeState = null;
            }
        });

        this.layers.createLayer('Base Background', this.defaultWidth, this.defaultHeight);
        this.layers.createLayer('Paint Layer 1', this.defaultWidth, this.defaultHeight);
        requestAnimationFrame(() => this.ajustarCanvasACapaActiva());
    }
    updateBrushPreview() {
        if (!this.brushPreviewCanvas) return;
        const pctx = this.brushPreviewCanvas.getContext('2d');
        const w = this.brushPreviewCanvas.width;
        const h = this.brushPreviewCanvas.height;
        pctx.clearRect(0, 0, w, h);

        const tip = this.brush.getTipCanvas();
        const dims = this.brush.getStampDimensions();
        const maxDim = Math.max(dims.w, dims.h);
        const fitScale = maxDim > (w - 6) ? (w - 6) / maxDim : 1;
        const dw = dims.w * fitScale;
        const dh = dims.h * fitScale;

        pctx.save();
        pctx.translate(w / 2, h / 2);
        if (this.brush.angle !== 0 && !this.brush.randomRotation) {
            pctx.rotate((this.brush.angle * Math.PI) / 180);
        }
        pctx.drawImage(tip, -dw / 2, -dh / 2, dw, dh);
        pctx.restore();
    }
    centerView(w = null, h = null) {
        const act = this.layers.getActiveLayer();
        const width = w || (act ? act.width : this.defaultWidth);
        const height = h || (act ? act.height : this.defaultHeight);
        const leftMargin = 70;
        const rightMargin = 330;
        const availW = Math.max(100, window.innerWidth - leftMargin - rightMargin);
        const availH = Math.max(100, window.innerHeight - 50);

        const fit = Math.min(availW / width, availH / height, 1.0) * 0.90;
        this.zoom.scale = Math.max(0.05, fit);
        const centerX = leftMargin + availW / 2;
        const centerY = window.innerHeight / 2;
        this.zoom.panX = centerX - (width * this.zoom.scale) / 2;
        this.zoom.panY = centerY - (height * this.zoom.scale) / 2;
        this.zoom.apply();
    }
    ajustarCanvasACapaActiva() {
        const act = this.layers.getActiveLayer();
        if (!act) return;

        const targetW = act.width;
        const targetH = act.height;

        this.defaultWidth = targetW;
        this.defaultHeight = targetH;
        this.layers.defaultWidth = targetW;
        this.layers.defaultHeight = targetH;

        this.syncInteractiveCanvases(targetW, targetH, false);
        this.centerView(targetW, targetH);

        const hud = document.getElementById('hud');
        if (hud) hud.textContent = `✓ Canvas adaptado a: ${act.name} (${targetW}x${targetH} px)`;
    }
    adaptarCapaActivaAlCanvas() {
        const act = this.layers.getActiveLayer();
        if (!act) return;
        const targetW = this.initialCanvasWidth;
        const targetH = this.initialCanvasHeight;
        if (act.width === targetW && act.height === targetH) return;

        const before = act.getSnapshot();
        act.setSize(targetW, targetH, true);
        const after = act.getSnapshot();

        this.history.push({
            undo: () => {
                act.restoreSnapshot(before);
                this.syncInteractiveCanvases(before.width, before.height, false);
                this.centerView(before.width, before.height);
            },
            redo: () => {
                act.restoreSnapshot(after);
                this.syncInteractiveCanvases(after.width, after.height, false);
                this.centerView(after.width, after.height);
            }
        });
        this.syncInteractiveCanvases(targetW, targetH, false);
        this.centerView(targetW, targetH);
    }
    pegarComoNuevaCapa(canvasRecorte, nombre = 'Capa Pegada') {
        if (!canvasRecorte || canvasRecorte.width <= 0 || canvasRecorte.height <= 0) return;
        
        const w = canvasRecorte.naturalWidth || canvasRecorte.width;
        const h = canvasRecorte.naturalHeight || canvasRecorte.height;

        const nuevaCapa = this.layers.createLayer(`${nombre} (${w}x${h})`, w, h);
        nuevaCapa.ctx.drawImage(canvasRecorte, 0, 0, w, h);

        const capaId = nuevaCapa.id;
        const indiceOriginal = this.layers.layers.findIndex(l => l.id === capaId);

        this.layers.setActiveLayer(nuevaCapa.id);

        this.history.push({
            undo: () => this.layers.deleteLayer(capaId),
            redo: () => {
                this.layers.layers.splice(indiceOriginal, 0, nuevaCapa);
                this.layers.setActiveLayer(nuevaCapa.id);
                this.layers.syncDOM();
                this.ajustarCanvasACapaActiva();
            }
        });

        this.ajustarCanvasACapaActiva();
    }
    buildLeftVerticalToolbar() {
        const bar = document.getElementById('left-toolbar-strip');
        bar.innerHTML = '';

    bindEvents() {
        let isSpacePressed = false;

        this.stage.addEventListener('contextmenu', (e) => {
            if (this.tools.currentTool === 'clone' || this.tools.currentTool === 'poly') {
                e.preventDefault();
            }
        });

        window.addEventListener('paste', async (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
            let pastedImage = false;

            if (items) {
                for (let item of items) {
                    if (item.type.indexOf('image') !== -1) {
                        const blob = item.getAsFile();
                        if (blob) {
                            pastedImage = true;
                            e.preventDefault();
                            const img = new Image();
                            img.onload = () => this.pegarComoNuevaCapa(img, 'Imagen Pegada');
                            img.src = URL.createObjectURL(blob);
                            return;
                        }
                    }
                }
            }
            if (!pastedImage && this.clipboard.buffer) {
                e.preventDefault();
                this.pegarComoNuevaCapa(this.clipboard.buffer, 'Selección Pegada');
            }
        });

        window.addEventListener('keydown', async (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.code === 'Space' && !isSpacePressed) {
                isSpacePressed = true;
                this.stage.style.cursor = 'grab';
                if (this.cad) this.cad.isPanningActive = true;
            }
            if (e.ctrlKey && (e.code === 'KeyC' || e.key === 'c' || e.key === 'C')) {
                e.preventDefault();
                await this.clipboard.copy(this.layers.getActiveLayer(), this.selection);
            }
            if (e.ctrlKey && (e.code === 'KeyX' || e.key === 'x' || e.key === 'X')) {
                e.preventDefault();
                await this.clipboard.cut(this.layers.getActiveLayer(), this.selection);
            }
            if (e.ctrlKey && e.code === 'KeyZ') {
                if (e.shiftKey) this.history.redo();
                else this.history.undo();
                e.preventDefault();
            } else if (e.ctrlKey && e.code === 'KeyY') {
                this.history.redo();
                e.preventDefault();
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                this.tools.cancelSelection();
                if (this.cad) {
                    this.cad.finishCurrent();
                    this.cad.selected = null;
                    this.cad.selectedPointIndex = -1;
                    this.cad.render();
                }
                const selectionTools = ['rectSelect', 'lasso', 'poly'];
                if (selectionTools.includes(this.tools.currentTool)) {
                    this.setActiveTool('brush');
                }
            }

            if (e.key === 'q' || e.key === 'Q') {
                e.preventDefault();
                this.ajustarCanvasACapaActiva();
            }
            if (e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                this.adaptarCapaActivaAlCanvas();
            }
            if (e.key === 'g' || e.key === 'G') this.setActiveTool('fill');
            if (e.key === 'b' || e.key === 'B') this.setActiveTool('brush');
            if (e.key === 'e' || e.key === 'E') this.setActiveTool('eraser');
            if (e.key === 'c' && !e.ctrlKey) this.setActiveTool('clone');
            if (e.key === 's' || e.key === 'S') this.setActiveTool('stamp');
            if (e.key === 'm' || e.key === 'M') this.setActiveTool('move');
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                isSpacePressed = false;
                this.stage.style.cursor = 'crosshair';
                this.zoom.endPan();
                if (this.cad) this.cad.isPanningActive = false;
            }
        });

        this.stage.addEventListener('pointerdown', (e) => {
            if (isSpacePressed || e.button === 1) {
                if (this.cad) this.cad.isPanningActive = true;
                this.zoom.startPan(e.clientX, e.clientY);
                return;
            }
            const coords = this.zoom.screenToWorld(e.clientX, e.clientY);
            this.tools.pointerDown(coords.x, coords.y, e);
        });

        window.addEventListener('pointermove', (e) => {
            if (this.zoom.isPanning) {
                this.zoom.pan(e.clientX, e.clientY);
                return;
            }
            const coords = this.zoom.screenToWorld(e.clientX, e.clientY);
            this.tools.pointerMove(coords.x, coords.y);
        });

        window.addEventListener('pointerup', (e) => {
            if (this.zoom.isPanning) {
                this.zoom.endPan();
                if (this.cad) this.cad.isPanningActive = isSpacePressed;
                return;
            }
            const coords = this.zoom.screenToWorld(e.clientX, e.clientY);
            this.tools.pointerUp(coords.x, coords.y);
        });
    }
}

window.addEventListener('DOMContentLoaded', () => {
    window.AppInstance = new ApplicationAdapter();
});
</script>
