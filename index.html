class BaseShapeGenerator {
    constructor(callbacks = {}) {
        this.onRenderStart = callbacks.onRenderStart || null;
        this.onRenderComplete = callbacks.onRenderComplete || null;
        this.onError = callbacks.onError || null;
    }

    notifyStart(ctx, params) {
        if (typeof this.onRenderStart === 'function') {
            this.onRenderStart(this.getId(), ctx, params);
        }
    }

    notifyComplete(ctx, params) {
        if (typeof this.onRenderComplete === 'function') {
            this.onRenderComplete(this.getId(), ctx, params);
        }
    }

    notifyError(err) {
        if (typeof this.onError === 'function') {
            this.onError(this.getId(), err);
        }
    }

    getId() {
        return this.constructor.name;
    }

    getLabel() {
        return this.constructor.name;
    }

    draw(ctx, params) {
        throw new Error("draw method must be implemented");
    }
}

class LeavesSwirlGenerator extends BaseShapeGenerator {
    getLabel() {
        return '🍂 Hojas Volando en el Aire (Vórtice)';
    }

    draw(ctx, params) {
        try {
            this.notifyStart(ctx, params);
            const { w, h, cx, cy, rad, maxR, density, thickness } = params;

            ctx.translate(cx, cy);
            ctx.rotate(rad);
            const count = Math.max(8, Math.floor(density * 3.5));

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let a = 0; a < Math.PI * 4; a += 0.1) {
                const r = (a / (Math.PI * 4)) * maxR * 0.95;
                const px = r * Math.cos(a);
                const py = r * Math.sin(a);
                if (a === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();

            for (let i = 0; i < count; i++) {
                const t = i / count;
                const spiralAngle = t * Math.PI * 4.2;
                const spiralR = t * (maxR * 0.92);
                const jitterX = Math.sin(i * 3.1) * 22;
                const jitterY = Math.cos(i * 4.7) * 22;
                const lx = spiralR * Math.cos(spiralAngle) + jitterX;
                const ly = spiralR * Math.sin(spiralAngle) + jitterY;

                const leafSize = Math.max(6, (thickness * 1.5) * (0.6 + t * 0.8));
                const leafRot = spiralAngle + Math.PI / 2 + Math.sin(i) * 0.6;

                ctx.save();
                ctx.translate(lx, ly);
                ctx.rotate(leafRot);

                ctx.beginPath();
                ctx.moveTo(0, -leafSize);
                ctx.bezierCurveTo(leafSize * 0.75, -leafSize * 0.4, leafSize * 0.65, leafSize * 0.5, 0, leafSize);
                ctx.bezierCurveTo(-leafSize * 0.65, leafSize * 0.5, -leafSize * 0.75, -leafSize * 0.4, 0, -leafSize);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                ctx.strokeStyle = '#000000';
                ctx.lineWidth = Math.max(1, leafSize * 0.08);
                ctx.beginPath();
                ctx.moveTo(0, -leafSize * 0.7);
                ctx.lineTo(0, leafSize * 1.15);
                ctx.stroke();

                ctx.restore();
            }

            this.notifyComplete(ctx, params);
        } catch (err) {
            this.notifyError(err);
        }
    }
}

class WindGustsGenerator extends BaseShapeGenerator {
    getLabel() {
        return '💨 Viento / Ráfagas de Aire';
    }

    draw(ctx, params) {
        try {
            this.notifyStart(ctx, params);
            const { cx, cy, rad, maxR, density, thickness } = params;

            ctx.translate(cx, cy);
            ctx.rotate(rad);
            ctx.strokeStyle = '#ffffff';
            ctx.lineCap = 'round';

            const gusts = Math.max(4, Math.floor(density * 1.6));
            for (let i = 0; i < gusts; i++) {
                const rowOffset = (i / (gusts - 1) - 0.5) * (maxR * 1.6);
                const speed = 0.8 + (i % 3) * 0.3;
                const y = rowOffset;
                ctx.lineWidth = Math.max(1.5, (thickness / 3) * speed);

                ctx.beginPath();
                const startX = -maxR * 0.9;
                const endX = maxR * 0.65;
                ctx.moveTo(startX, y);

                const midX = (startX + endX) * 0.3;
                const waveHeight = Math.sin(i * 1.8) * 16;
                ctx.quadraticCurveTo(midX, y + waveHeight, endX, y);

                const curlR = 10 + (i % 2) * 6;
                ctx.arc(endX + curlR, y - curlR, curlR, Math.PI / 2, Math.PI * 2);
                ctx.stroke();
            }

            this.notifyComplete(ctx, params);
        } catch (err) {
            this.notifyError(err);
        }
    }
}

class SandDustGenerator extends BaseShapeGenerator {
    getLabel() {
        return '🏜️ Arena / Polvo Fino';
    }

    draw(ctx, params) {
        try {
            this.notifyStart(ctx, params);
            const { cx, cy, rad, maxR, density, thickness } = params;

            ctx.translate(cx, cy);
            ctx.rotate(rad);

            const waves = Math.max(3, Math.floor(density / 2));
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = thickness * 1.2;
            for (let i = -waves; i <= waves; i++) {
                const wy = (i / waves) * maxR * 0.9;
                ctx.beginPath();
                for (let wx = -maxR; wx <= maxR; wx += 8) {
                    const wave = Math.sin((wx / maxR) * Math.PI * 3 + i) * 6;
                    if (wx === -maxR) ctx.moveTo(wx, wy + wave);
                    else ctx.lineTo(wx, wy + wave);
                }
                ctx.stroke();
            }

            const grains = Math.floor(density * 220);
            for (let i = 0; i < grains; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.sqrt(Math.random()) * maxR;
                const gx = Math.cos(angle) * dist;
                const gy = Math.sin(angle) * dist;

                const grainSize = Math.random() * (thickness * 0.25) + 0.6;
                const alpha = Math.random() * 0.8 + 0.2;

                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(gx, gy, grainSize, 0, Math.PI * 2);
                ctx.fill();
            }

            this.notifyComplete(ctx, params);
        } catch (err) {
            this.notifyError(err);
        }
    }
}

class WoodPlanksGenerator extends BaseShapeGenerator {
    getLabel() {
        return '🪵 Baldosas de Madera / Vetas';
    }

    draw(ctx, params) {
        try {
            this.notifyStart(ctx, params);
            const { w, h, cx, cy, rad, density, thickness } = params;

            ctx.translate(cx, cy);
            ctx.rotate(rad);
            ctx.translate(-cx, -cy);

            const planks = Math.max(2, Math.floor(density / 1.5));
            const plankH = h / planks;
            const groove = Math.max(2, thickness / 2);

            for (let p = 0; p < planks; p++) {
                const topY = p * plankH;

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, topY + groove / 2, w, plankH - groove);

                ctx.strokeStyle = '#000000';
                const grainCount = Math.max(3, Math.floor(plankH / 8));
                for (let g = 0; g < grainCount; g++) {
                    ctx.lineWidth = Math.random() * 1.8 + 0.8;
                    const gy = topY + (g / grainCount) * plankH;
                    ctx.beginPath();
                    for (let x = 0; x <= w; x += 10) {
                        const knotFactor = Math.sin(x * 0.02 + p) * 5;
                        const wave = Math.sin((x / w) * Math.PI * 3 + p) * 4 + knotFactor;
                        if (x === 0) ctx.moveTo(x, gy + wave);
                        else ctx.lineTo(x, gy + wave);
                    }
                    ctx.stroke();
                }

                if (p % 2 === 0) {
                    const knotX = (w * 0.3) + ((p * 57) % (w * 0.4));
                    const knotY = topY + plankH * 0.5;
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.ellipse(knotX, knotY, 14, 6, Math.PI / 12, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            this.notifyComplete(ctx, params);
        } catch (err) {
            this.notifyError(err);
        }
    }
}

class FireFlamesGenerator extends BaseShapeGenerator {
    getLabel() {
        return '🔥 Fuego / Lenguas de Llama';
    }

    draw(ctx, params) {
        try {
            this.notifyStart(ctx, params);
            const { cx, cy, rad, maxR, density, thickness } = params;

            ctx.translate(cx, cy + maxR * 0.5);
            ctx.rotate(rad);

            const tongues = Math.max(3, Math.floor(density / 2));
            const baseWidth = maxR * 1.5;
            const flameHeight = maxR * 1.6;

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(-baseWidth / 2, 0);

            const step = baseWidth / tongues;
            for (let i = 0; i < tongues; i++) {
                const startTongueX = -baseWidth / 2 + i * step;
                const midTongueX = startTongueX + step * 0.5;
                const endTongueX = startTongueX + step;
                const hVar = flameHeight * (0.6 + Math.sin(i * 1.7) * 0.4);

                ctx.quadraticCurveTo(startTongueX + 8, -hVar * 0.5, midTongueX, -hVar);
                ctx.quadraticCurveTo(endTongueX - 8, -hVar * 0.4, endTongueX, 0);
            }
            ctx.closePath();
            ctx.fill();

            const embers = Math.floor(density * 5);
            for (let i = 0; i < embers; i++) {
                const ex = (Math.random() - 0.5) * (baseWidth * 0.7);
                const ey = -flameHeight - (Math.random() * 40);
                const er = Math.random() * (thickness / 3) + 1.2;
                ctx.beginPath();
                ctx.arc(ex, ey, er, 0, Math.PI * 2);
                ctx.fill();
            }

            this.notifyComplete(ctx, params);
        } catch (err) {
            this.notifyError(err);
        }
    }
}

class CircleSoftGenerator extends BaseShapeGenerator {
    getLabel() {
        return '1. Círculo Difuminado (Soft Radial)';
    }

    draw(ctx, params) {
        try {
            this.notifyStart(ctx, params);
            const { cx, cy, maxR, softness } = params;
            const soft = Math.max(0.01, softness);
            const grad = ctx.createRadialGradient(cx, cy, maxR * (1 - soft), cx, cy, maxR);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
            ctx.fill();
            this.notifyComplete(ctx, params);
        } catch (err) {
            this.notifyError(err);
        }
    }
}

class CircleRingsGenerator extends BaseShapeGenerator {
    getLabel() {
        return '3. Anillos Concéntricos (Rings)';
    }

    draw(ctx, params) {
        try {
            this.notifyStart(ctx, params);
            const { cx, cy, maxR, density, thickness } = params;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1, thickness);
            const rings = Math.max(1, Math.floor(density));
            const step = maxR / rings;
            for (let r = step; r <= maxR; r += step) {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();
            }
            this.notifyComplete(ctx, params);
        } catch (err) {
            this.notifyError(err);
        }
    }
}

class RadialBurstGenerator extends BaseShapeGenerator {
    getLabel() {
        return '6. Rayos / Sol (Sunburst)';
    }

    draw(ctx, params) {
        try {
            this.notifyStart(ctx, params);
            const { cx, cy, rad, maxR, density, thickness } = params;
            const rays = Math.max(4, Math.floor(density * 2));
            ctx.translate(cx, cy);
            ctx.rotate(rad);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1, thickness / 2);
            for (let i = 0; i < rays; i++) {
                const a = (i * 2 * Math.PI) / rays;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(a) * maxR, Math.sin(a) * maxR);
                ctx.stroke();
            }
            this.notifyComplete(ctx, params);
        } catch (err) {
            this.notifyError(err);
        }
    }
}

class SpiralGenerator extends BaseShapeGenerator {
    getLabel() {
        return '7. Espiral de Arquímedes';
    }

    draw(ctx, params) {
        try {
            this.notifyStart(ctx, params);
            const { cx, cy, rad, maxR, density, thickness } = params;
            ctx.translate(cx, cy);
            ctx.rotate(rad);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1, thickness);
            ctx.beginPath();
            const totalTurns = density * Math.PI * 2;
            for (let a = 0; a < totalTurns; a += 0.1) {
                const r = (a / totalTurns) * maxR;
                const px = r * Math.cos(a);
                const py = r * Math.sin(a);
                if (a === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
            this.notifyComplete(ctx, params);
        } catch (err) {
            this.notifyError(err);
        }
    }
}

class LinesParallelGenerator extends BaseShapeGenerator {
    getLabel() {
        return '8. Líneas Paralelas (Stripes)';
    }

    draw(ctx, params) {
        try {
            this.notifyStart(ctx, params);
            const { w, h, cx, cy, rad, density, thickness } = params;
            ctx.translate(cx, cy);
            ctx.rotate(rad);
            ctx.translate(-cx, -cy);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1, thickness);
            const step = Math.max(4, Math.floor(w / density));
            const diag = Math.hypot(w, h);
            for (let x = -diag; x < w + diag; x += step) {
                ctx.beginPath();
                ctx.moveTo(x, -diag);
                ctx.lineTo(x, h + diag);
                ctx.stroke();
            }
            this.notifyComplete(ctx, params);
        } catch (err) {
            this.notifyError(err);
        }
    }
}

class LinesWavyGenerator extends BaseShapeGenerator {

    draw(ctx, params) {
        try {
            this.notifyStart(ctx, params);

            ctx.translate(cx, cy);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1, thickness);
            const stepY = Math.max(8, Math.floor(h / density));
            for (let y = 0; y < h + stepY; y += stepY) {
                ctx.beginPath();
                for (let x = 0; x <= w; x += 4) {
                    const wave = Math.sin((x / w) * Math.PI * 4) * (stepY * 0.35);
                    if (x === 0) ctx.moveTo(x, y + wave);
                    else ctx.lineTo(x, y + wave);
                }
                ctx.stroke();
            }
            this.notifyComplete(ctx, params);
        } catch (err) {
            this.notifyError(err);
        }
    }
}

class CrosshatchGenerator extends BaseShapeGenerator {
    getLabel() {
        return '10. Tramado Cruzado (Crosshatch)';
    }

    draw(ctx, params) {
        try {
            this.notifyStart(ctx, params);
            const { w, h, cx, cy, rad, density, thickness } = params;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1, thickness / 2);
            const step = Math.max(6, Math.floor(w / density));
            const diag = Math.hypot(w, h);
            [Math.PI / 4 + rad, -Math.PI / 4 + rad].forEach(ang => {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(ang);
                ctx.translate(-cx, -cy);
                for (let x = -diag; x < w + diag; x += step) {
                    ctx.beginPath();
                    ctx.moveTo(x, -diag);
                    ctx.lineTo(x, h + diag);
                    ctx.stroke();
                }
                ctx.restore();
            });
            this.notifyComplete(ctx, params);
        } catch (err) {
            this.notifyError(err);
        }
    }
}

class HexGridGenerator extends BaseShapeGenerator {
    getLabel() {

    }

    draw(ctx, params) {
        try {
            this.notifyStart(ctx, params);
            const { w, h, density, thickness } = params;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1, thickness);
            const r = Math.max(8, Math.floor(w / (density * 1.5)));
            const hexW = Math.sqrt(3) * r;
            const hexH = 1.5 * r;
            for (let y = -r; y < h + r * 2; y += hexH) {
                const isOdd = Math.floor(y / hexH) % 2 === 0;
                const offset = isOdd ? hexW / 2 : 0;
                for (let x = -hexW; x < w + hexW * 2; x += hexW) {
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const a = (i * Math.PI) / 3;
                        const px = x + offset + r * Math.cos(a);
                        const py = y + r * Math.sin(a);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.stroke();
                }
            }
            this.notifyComplete(ctx, params);
        } catch (err) {
            this.notifyError(err);
        }
    }
}

class ShapeRegistry {
    constructor(callbacks = {}) {
        this.generators = new Map();
        this.onGeneratorRegistered = callbacks.onGeneratorRegistered || null;
        this.onGeneratorSelected = callbacks.onGeneratorSelected || null;
    }

    register(key, generatorInstance) {
        this.generators.set(key, generatorInstance);
        if (typeof this.onGeneratorRegistered === 'function') {
            this.onGeneratorRegistered(key, generatorInstance);
        }
    }

    get(key) {
        const gen = this.generators.get(key);
        if (gen && typeof this.onGeneratorSelected === 'function') {
            this.onGeneratorSelected(key, gen);
        }
        return gen;
    }

    getAllKeys() {
        return Array.from(this.generators.keys());
    }

    getSelectOptions() {
        return Array.from(this.generators.entries()).map(([key, gen]) => ({
            value: key,
            label: gen.getLabel()
        }));
    }
}

class BrushTipCreator {
    constructor(options = {}) {

        this.onChange = options.onChange || null;
        this.onModeChange = options.onModeChange || null;
        this.onRender = options.onRender || null;

        this.mode = 'procedural';
        this.sourceImage = null;

        this.density = 8;
        this.thickness = 6;
        this.angle = 0;
        this.sides = 5;
        this.softness = 0.5;

        this.invert = false;
        this.radialPower = 1.0;
        this.contrast = 0;
        this.brightness = 0;

        this.proceduralCanvas = document.createElement('canvas');
        this.proceduralCanvas.width = this.size;
        this.proceduralCanvas.height = this.size;
        this.pctx = this.proceduralCanvas.getContext('2d');

        this.outputCanvas = document.createElement('canvas');
        this.outputCanvas.width = this.size;
        this.outputCanvas.height = this.size;
        this.ctx = this.outputCanvas.getContext('2d', { willReadFrequently: true });

        this.pattern = 'leaves_swirl';
        this.initUI();
        this.generateProcedural();

    setMode(mode) {
        this.mode = mode;
        if (typeof this.onModeChange === 'function') {
            this.onModeChange(this.mode);
        }
    }

    _makeRow() {
        const d = document.createElement('div');
        d.style.cssText = 'display:flex; gap:6px; margin: 4px 0; width:100%;';
        this.panel.element.querySelector('.ui-panel-body').appendChild(d);
        return d;
    }

    updateParamVisibility() {
        if (this.mode === 'image') {
            this.procGroup.style.display = 'none';
        } else {
            this.procGroup.style.display = 'flex';
            this.slSides.element.style.display = (this.pattern === 'polygon_n') ? 'block' : 'none';
        }
    }

    generateProcedural() {
        const ctx = this.pctx;
        const w = this.size;
        const h = this.size;
        const cx = w / 2;
        const cy = h / 2;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, w, h);

        const rad = (this.angle * Math.PI) / 180;
        const maxR = w * 0.44;

        ctx.save();
        const generator = this.registry.get(this.pattern);
        if (generator) {
            generator.draw(ctx, {
                w,
                h,
                cx,
                cy,
                rad,
                maxR,
                density: this.density,
                thickness: this.thickness,
                sides: this.sides,
                softness: this.softness
            });
        }
        ctx.restore();
    }

    render() {
        const w = this.size;
        const h = this.size;
        const ctx = this.ctx;

        ctx.clearRect(0, 0, w, h);

        if (this.mode === 'image' && this.sourceImage) {
            ctx.drawImage(this.sourceImage, 0, 0, w, h);
        } else {
            ctx.drawImage(this.proceduralCanvas, 0, 0, w, h);
        }

        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        const cx = w / 2;
        const cy = h / 2;
        const factor = (259 * (this.contrast + 255)) / (255 * (259 - this.contrast));

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const idx = (y * w + x) * 4;

                let gray = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
                gray = factor * (gray - 128) + 128 + this.brightness;

                if (this.invert) {
                    gray = 255 - gray;
                }
                gray = Math.max(0, Math.min(255, Math.round(gray)));

                const dist = Math.hypot(x - cx, y - cy);
                const normDist = Math.min(1.0, dist / (w / 2));

                let radialMask = 1.0;
                if (this.radialPower > 0) {
                    radialMask = Math.max(0, 1.0 - Math.pow(normDist, 1 / this.radialPower));
                }

                const finalAlpha = Math.round(gray * radialMask);

                data[idx] = 255;
                data[idx + 1] = 255;
                data[idx + 2] = 255;
                data[idx + 3] = finalAlpha;
            }
        }

        ctx.putImageData(imgData, 0, 0);

        if (typeof this.onRender === 'function') {
            this.onRender(this.outputCanvas);
        }

        if (typeof this.onChange === 'function') {
            this.onChange(this.outputCanvas, this.outputCanvas.toDataURL('image/png'));
        }
    }

    downloadPNG() {
        const a = document.createElement('a');
        a.download = `brush_${this.pattern}_${Date.now()}.png`;
        a.href = this.outputCanvas.toDataURL('image/png');
        a.click();
    }
}

 <script>
 class ProjectStorageDB {
    constructor(dbName = 'PaintSimpleDB', version = 1) {
        this.dbName = dbName;
        this.version = version;
        this.db = null;
    }

    async init() {
        if (this.db) return this.db;
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(this.dbName, this.version);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('projects')) {
                    const store = db.createObjectStore('projects', { keyPath: 'id' });
                    store.createIndex('updatedAt', 'updatedAt', { unique: false });
                }
            };
            req.onsuccess = (e) => {
                this.db = e.target.result;
                resolve(this.db);
            };
            req.onerror = (e) => reject(e.target.error);
        });
    }

    async getAll() {
        await this.init();
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction('projects', 'readonly');
            const store = tx.objectStore('projects');
            const req = store.getAll();
            req.onsuccess = () => {
                const res = req.result || [];
                res.sort((a, b) => b.updatedAt - a.updatedAt);
                resolve(res);
            };
            req.onerror = (e) => reject(e.target.error);
        });
    }

    async getById(id) {
        await this.init();
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction('projects', 'readonly');
            const store = tx.objectStore('projects');
            const req = store.get(id);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = (e) => reject(e.target.error);
        });
    }

    async save(projectData) {
        await this.init();
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction('projects', 'readwrite');
            const store = tx.objectStore('projects');
            const req = store.put(projectData);
            req.onsuccess = () => resolve(projectData);
            req.onerror = (e) => reject(e.target.error);
        });
    }

    async delete(id) {
        await this.init();
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction('projects', 'readwrite');
            const store = tx.objectStore('projects');
            const req = store.delete(id);
            req.onsuccess = () => resolve(true);
            req.onerror = (e) => reject(e.target.error);
        });
    }
}

class ProjectStorageUI {
    constructor(app, options = {}) {
        this.app = app;
        this.db = new ProjectStorageDB();
        this.currentProjectId = null;

        this.panel = new UI.SmartPanel({
            id: options.id || 'panel_project_storage',
            title: options.title || 'Project Manager (IndexedDB)',
            x: options.x ?? 80,
            y: options.y ?? 100,
            width: 320,
            floating: options.floating ?? true
        });

        this.buildUI();
        this.refreshList();
    }

    buildUI() {
        const rName = this.panel.addRow ? this.panel.addRow(4) : this._makeRow();
        this.inpName = document.createElement('input');
        this.inpName.type = 'text';
        this.inpName.placeholder = 'Project Name';
        this.inpName.value = 'My Drawing';
        this.inpName.style.cssText = 'flex:1; height:28px; background:#18202f; border:1px solid #475569; border-radius:4px; color:#fff; padding:0 8px; font-size:11px; outline:none;';
        rName.append ? rName.append(this.inpName) : rName.appendChild(this.inpName);

        const rActions = this.panel.addRow ? this.panel.addRow(4) : this._makeRow();
        const btnSaveNew = new UI.Button({
            text: 'Save New',
            variant: 'primary',
            onClick: () => this.saveProject(true)
        });
        const btnOverwrite = new UI.Button({
            text: 'Overwrite',
            onClick: () => this.saveProject(false)
        });
        rActions.append ? rActions.append(btnSaveNew) : rActions.appendChild(btnSaveNew.element);
        rActions.append ? rActions.append(btnOverwrite) : rActions.appendChild(btnOverwrite.element);

        this.listContainer = document.createElement('div');
        this.listContainer.style.cssText = 'display:flex; flex-direction:column; gap:4px; max-height:240px; overflow-y:auto; background:#0f141f; padding:6px; border-radius:4px; border:1px solid #1e293b; margin-top:6px;';
        this.panel.append(this.listContainer);

        const rFoot = this.panel.addRow ? this.panel.addRow(4) : this._makeRow();
        const btnRefresh = new UI.Button({
            text: 'Refresh List',
            onClick: () => this.refreshList()
        });
        rFoot.append ? rFoot.append(btnRefresh) : rFoot.appendChild(btnRefresh.element);
    }

    _makeRow() {
        const d = document.createElement('div');
        d.className = 'fb-row';
        d.style.cssText = 'display:flex; gap:6px; margin:4px 0; width:100%;';
        this.panel.append(d);
        return d;
    }

    async saveProject(isNew = true) {
        const name = this.inpName.value.trim() || 'Untitled';
        const layerStack = this.app.layers;
        if (!layerStack || layerStack.layers.length === 0) return;

        let id = this.currentProjectId;
        if (isNew || !id) {
            id = 'proj_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            this.currentProjectId = id;
        }

        const layersData = [];
        for (const l of layerStack.layers) {
            const blob = await new Promise(res => l.canvas.toBlob(res, 'image/png'));
            layersData.push({
                id: l.id,
                name: l.name,
                width: l.width,
                height: l.height,
                originalWidth: l.originalWidth,
                originalHeight: l.originalHeight,
                visible: l.visible,
                opacity: l.opacity,
                blendMode: l.blendMode,
                blob
            });
        }

        let maxWidth = 1, maxHeight = 1;
        layerStack.layers.forEach(l => {
            if (l.width > maxWidth) maxWidth = l.width;
            if (l.height > maxHeight) maxHeight = l.height;
        });

        const thumbCanvas = document.createElement('canvas');
        const scale = Math.min(1, 120 / Math.max(maxWidth, maxHeight));
        thumbCanvas.width = Math.max(1, Math.round(maxWidth * scale));
        thumbCanvas.height = Math.max(1, Math.round(maxHeight * scale));
        const tctx = thumbCanvas.getContext('2d');

        layerStack.layers.forEach(l => {
            if (l.visible) {
                tctx.save();
                tctx.globalAlpha = l.opacity;
                tctx.globalCompositeOperation = (l.blendMode === 'normal') ? 'source-over' : (l.blendMode || 'source-over');
                tctx.drawImage(l.canvas, 0, 0, thumbCanvas.width, thumbCanvas.height);
                tctx.restore();
            }
        });

        const thumbBlob = await new Promise(res => thumbCanvas.toBlob(res, 'image/jpeg', 0.7));

        const projectPayload = {
            id,
            name,
            updatedAt: Date.now(),
            defaultWidth: layerStack.defaultWidth,
            defaultHeight: layerStack.defaultHeight,
            activeLayerId: layerStack.activeLayerId,
            thumbBlob,
            layers: layersData
        };

        await this.db.save(projectPayload);
        await this.refreshList();

        const hud = document.getElementById('hud');
        if (hud) hud.textContent = `✓ Project saved: ${name}`;
    }

    async loadProject(id) {
        const proj = await this.db.getById(id);
        if (!proj) return;

        this.currentProjectId = proj.id;
        this.inpName.value = proj.name;

        const layerStack = this.app.layers;
        layerStack.layers = [];
        layerStack.activeLayerId = null;

        layerStack.defaultWidth = proj.defaultWidth;
        layerStack.defaultHeight = proj.defaultHeight;
        this.app.defaultWidth = proj.defaultWidth;
        this.app.defaultHeight = proj.defaultHeight;

        for (const ld of proj.layers) {
            const l = new Layer(ld.id, ld.name, ld.width, ld.height);
            l.originalWidth = ld.originalWidth || ld.width;
            l.originalHeight = ld.originalHeight || ld.height;
            l.visible = ld.visible !== false;
            l.opacity = ld.opacity ?? 1.0;
            l.blendMode = ld.blendMode || 'normal';

            const url = URL.createObjectURL(ld.blob);
            const img = new Image();
            await new Promise((res, rej) => {
                img.onload = () => {
                    l.ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    res();
                };
                img.onerror = rej;
                img.src = url;
            });

            layerStack.layers.push(l);
        }

        layerStack.activeLayerId = proj.activeLayerId || layerStack.layers[0]?.id;
        layerStack.syncDOM();
        this.app.ajustarCanvasACapaActiva();
        await this.refreshList();

        const hud = document.getElementById('hud');
        if (hud) hud.textContent = `✓ Project loaded: ${proj.name}`;
    }

    async deleteProject(id, name) {
        if (!confirm(`Delete project "${name}"?`)) return;
        await this.db.delete(id);
        if (this.currentProjectId === id) this.currentProjectId = null;
        await this.refreshList();
    }

    async refreshList() {
        this.listContainer.innerHTML = '';
        const list = await this.db.getAll();

        if (list.length === 0) {
            const empty = document.createElement('div');
            empty.textContent = 'No saved projects';
            empty.style.cssText = 'color:#64748b; font-size:11px; text-align:center; padding:12px;';
            this.listContainer.appendChild(empty);
            return;
        }

        list.forEach(p => {
            const row = document.createElement('div');
            row.style.cssText = `display:flex; align-items:center; gap:8px; padding:6px; border-radius:4px; background:${this.currentProjectId === p.id ? '#0369a1' : '#1a2333'}; border:1px solid ${this.currentProjectId === p.id ? '#38bdf8' : 'rgba(255,255,255,0.08)'};`;

            const img = document.createElement('img');
            img.style.cssText = 'width:36px; height:36px; object-fit:cover; border-radius:3px; background:#000; flex-shrink:0;';
            if (p.thumbBlob) {
                img.src = URL.createObjectURL(p.thumbBlob);
            }

            const info = document.createElement('div');
            info.style.cssText = 'display:flex; flex-direction:column; flex:1; min-width:0;';

            const title = document.createElement('span');
            title.textContent = p.name;
            title.style.cssText = 'font-weight:bold; font-size:11px; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';

            const meta = document.createElement('span');
            meta.textContent = `${new Date(p.updatedAt).toLocaleTimeString()} - ${p.layers.length} layers`;
            meta.style.cssText = 'font-size:9px; color:#94a3b8;';

            info.appendChild(title);
            info.appendChild(meta);

            const btnLoad = document.createElement('button');
            btnLoad.textContent = 'Load';
            btnLoad.className = 'fb-btn fb-btn-primary';
            btnLoad.style.cssText = 'flex:0 0 auto; height:24px; padding:0 6px; font-size:10px;';
            btnLoad.onclick = () => this.loadProject(p.id);

            const btnDel = document.createElement('button');
            btnDel.textContent = '✕';
            btnDel.className = 'fb-btn fb-btn-danger';
            btnDel.style.cssText = 'flex:0 0 auto; height:24px; width:24px; padding:0; font-size:10px;';
            btnDel.onclick = () => this.deleteProject(p.id, p.name);

            row.appendChild(img);
            row.appendChild(info);
            row.appendChild(btnLoad);
            row.appendChild(btnDel);

            this.listContainer.appendChild(row);
        });
    }
}

        });

        const slOpacity = new UI.ConfigurableSlider({
            label: 'Alpha / Global Opacity',
            min: 0.01,
            max: 1.0,
            step: 0.01,
            value: this.brush.opacity,
            onChange: (v) => this.brush.set('opacity', v)
        });
        this.panel.append(slOpacity);

        const slHardness = new UI.ConfigurableSlider({
            label: 'Dureza / Caída Radial',
            min: 0.0,
            max: 0.99,
            step: 0.01,
            value: this.brush.hardness,
            onChange: (v) => this.brush.set('hardness', v)
        });
        this.panel.append(slHardness);

        const slSpacing = new UI.ConfigurableSlider({
            label: '(Spacing / Step %)',
            min: 1,
            max: 200,
            step: 1,
            value: this.brush.spacing,
            onChange: (v) => this.brush.set('spacing', v)
        });
        this.panel.append(slSpacing);
        const slMult = new UI.ConfigurableSlider({
        label: 'Multiply Factor (Float 0.0 - 1.0)',
        min: 0.0,
        max: 4.0,
        step: 0.01,
        value: this.brush.multiplyFactor ?? 1.0,
        onChange: (v) => this.brush.set('multiplyFactor', v)
        });
        this.panel.append(slMult);

        const slAngle = new UI.ConfigurableSlider({
            label: 'Ángulo Fijo (°)',
            min: 0,
            max: 360,
            step: 1,
            value: this.brush.angle,
            onChange: (v) => this.brush.set('angle', v)
        });
        this.panel.append(slAngle);

        const chkRandomRot = new UI.Toggle({
            label: 'Random Rotation',
            value: this.brush.randomRotation,
            onChange: (v) => this.brush.set('randomRotation', v)
        });
        this.panel.append(chkRandomRot);

        const slForce = new UI.ConfigurableSlider({
            label: 'Force / Flow (%)',
            min: 1,
            max: 100,
            step: 1,
            value: this.brush.force,
            onChange: (v) => this.brush.set('force', v)
        });
        this.panel.append(slForce);
    }

    applyImageMode() {
        if (!this.originalRawImage) return;

        if (!this.isGrayscale) {
            this.brush.stampImage = this.originalRawImage;
            return;
        }

        const w = this.originalRawImage.naturalWidth || this.originalRawImage.width;
        const h = this.originalRawImage.naturalHeight || this.originalRawImage.height;

        const offCanvas = document.createElement('canvas');
        offCanvas.width = w;
        offCanvas.height = h;
        const offCtx = offCanvas.getContext('2d');
        offCtx.drawImage(this.originalRawImage, 0, 0, w, h);

        const imgData = offCtx.getImageData(0, 0, w, h);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            const gray = Math.round(data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
            data[i] = gray;
            data[i + 1] = gray;
            data[i + 2] = gray;
        }

        offCtx.putImageData(imgData, 0, 0);

        const processedImg = new Image();
        processedImg.onload = () => {
            this.brush.stampImage = processedImg;
        };
        processedImg.src = offCanvas.toDataURL('image/png');
    }

    _makeRow() {
        const d = document.createElement('div');
        d.className = 'fb-row';
        d.style.cssText = 'display:flex; gap:6px; margin:4px 0; width:100%;';
        this.panel.append(d);
        return d;
    }
}

            label: 'Contraste',

                this.brushSettings.stampImage = null;

                if (hud) hud.textContent = 'Punta reajustada a círculo nativo';
            }
        });
        const btnApplyTip = new UI.Button({
            text: 'Aplicar a Pincel',
            variant: 'primary',
            onClick: () => {
                const img = new Image();
                img.onload = () => {
                    this.brushSettings.stampImage = img;
                    if (this.onApply) this.onApply(this.outputCanvas);
                    const hud = document.getElementById('hud');
                    if (hud) hud.textContent = 'Nueva punta asignada al pincel';

                img.src = this.outputCanvas.toDataURL('image/png');

        rActions.append ? rActions.append(btnResetTip) : rActions.appendChild(btnResetTip.element);
        rActions.append ? rActions.append(btnApplyTip) : rActions.appendChild(btnApplyTip.element);

    _makeRow() {
        const d = document.createElement('div');
        d.className = 'fb-row';
        d.style.cssText = 'display:flex; gap:6px; margin:4px 0; width:100%;';
        this.panel.append(d);
        return d;
    }

    updateParamVisibility() {
        if (this.mode === 'image') {
            this.procGroup.style.display = 'none';
        } else {
            this.procGroup.style.display = 'flex';
            this.slSides.element.style.display = (this.pattern === 'polygon_n') ? 'block' : 'none';
        }
    }

    generateProcedural() {
        const ctx = this.pctx;
        const w = this.size;
        const h = this.size;
        const cx = w / 2;
        const cy = h / 2;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, w, h);

        const rad = (this.angle * Math.PI) / 180;
        const maxR = w * 0.44;

        ctx.save();
        const generator = this.registry.get(this.pattern);
        if (generator) {
            generator.draw(ctx, {
                w,
                h,
                cx,
                cy,
                rad,
                maxR,
                density: this.density,
                thickness: this.thickness,
                sides: this.sides,
                softness: this.softness
            });
        }
        ctx.restore();
    }

    render() {
        const w = this.size;
        const h = this.size;
        const ctx = this.ctx;

        ctx.clearRect(0, 0, w, h);

        if (this.mode === 'image' && this.sourceImage) {
            ctx.drawImage(this.sourceImage, 0, 0, w, h);
        } else {
            ctx.drawImage(this.proceduralCanvas, 0, 0, w, h);
        }

        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        const cx = w / 2;
        const cy = h / 2;
        const factor = (259 * (this.contrast + 255)) / (255 * (259 - this.contrast));

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const idx = (y * w + x) * 4;

                let gray = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
                gray = factor * (gray - 128) + 128 + this.brightness;

                if (this.invert) {
                    gray = 255 - gray;
                }
                gray = Math.max(0, Math.min(255, Math.round(gray)));

                const dist = Math.hypot(x - cx, y - cy);
                const normDist = Math.min(1.0, dist / (w / 2));

                let radialMask = 1.0;
                if (this.radialPower > 0) {
                    radialMask = Math.max(0, 1.0 - Math.pow(normDist, 1 / this.radialPower));
                }

                const finalAlpha = Math.round(gray * radialMask);

                data[idx] = 255;
                data[idx + 1] = 255;
                data[idx + 2] = 255;
                data[idx + 3] = finalAlpha;
            }
        }

        ctx.putImageData(imgData, 0, 0);

        if (this.previewCanvas) {
            const pvCtx = this.previewCanvas.getContext('2d');
            pvCtx.clearRect(0, 0, this.previewCanvas.width, this.previewCanvas.height);
            pvCtx.drawImage(this.outputCanvas, 0, 0, this.previewCanvas.width, this.previewCanvas.height);
        }
    }
}

/*  */
 
   class BGRMPipeline {
      static FLOYD_STEINBERG_DITHER = "FLOYD_STEINBERG";
      static NO_DITHER = "NO_DITHER";
      static NATIVE_DITHER = "NATIVE_DITHER";
      static THRESHOLD_WITH_DITHER = "THRESHOLD_WITH_DITHER";
      static ONNX_MODEL_PROFILES = {
        U2NET: "U2NET",
        ISNET_GENERAL: "ISNET_GENERAL"
      };

      constructor({
        onnxModel = "https://cdn.jsdelivr.net/npm/free-background-remover@1.0.6/u2netp.onnx",
        onnxModelProfile = BGRMPipeline.ONNX_MODEL_PROFILES.U2NET,
        dither = BGRMPipeline.NATIVE_DITHER,
        force = 0.14,
        onComplete = null,
        onError = null
      } = {}) {
        this.onnxModel = onnxModel;
        this.onnxModelProfile = onnxModelProfile;
        this.dither = dither;
        this.force = force;
        this.onComplete = onComplete;
        this.onError = onError;
        this.session = null;
        this.targetSize = 320;
        this.cachedDrawable = null;
        this.cachedOutput = null;
        this.cachedBox = null;
      }

      setForce(val) {
        this.force = Math.max(0, Math.min(1, val));
        if (this.cachedDrawable && this.cachedOutput && this.cachedBox) {
          this.compositeResult(this.cachedDrawable, this.cachedOutput, this.cachedBox);
        }
      }

      async init() {
        if (this.session) return;
        ort.env.wasm.numThreads = 1;
        this.session = await ort.InferenceSession.create(this.onnxModel, {
          executionProviders: ['wasm']
        });
      }

      async resolveDrawable(input) {
        if (typeof input === "string") {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.src = input;
          await new Promise((resolve, reject) => {
            img.onload = () => resolve();
            img.onerror = (e) => reject(e);
          });
          return img;
        }

        if (input instanceof Blob) {
          const url = URL.createObjectURL(input);
          const img = new Image();
          img.src = url;
          await new Promise((resolve, reject) => {
            img.onload = () => resolve();
            img.onerror = (e) => reject(e);
          });
          URL.revokeObjectURL(url);
          return img;
        }

        if (input instanceof ImageData) {
          const canvas = document.createElement("canvas");
          canvas.width = input.width;
          canvas.height = input.height;
          const ctx = canvas.getContext("2d");
          ctx.putImageData(input, 0, 0);
          return canvas;
        }

        if (input instanceof HTMLImageElement) {
          if (!input.complete) {
            await new Promise((resolve, reject) => {
              input.onload = () => resolve();
              input.onerror = (e) => reject(e);
            });
          }
          return input;
        }

        if (input instanceof HTMLCanvasElement) {
          return input;
        }

        throw new Error("Formato no compatible");
      }

      computeLetterbox(srcW, srcH) {
        const scale = this.targetSize / Math.max(srcW, srcH);
        const targetW = Math.round(srcW * scale);
        const targetH = Math.round(srcH * scale);
        const padX = Math.floor((this.targetSize - targetW) / 2);
        const padY = Math.floor((this.targetSize - targetH) / 2);
        return { scale, targetW, targetH, padX, padY };
      }

      preprocess(drawable, box) {
        const offCanvas = document.createElement("canvas");
        offCanvas.width = this.targetSize;
        offCanvas.height = this.targetSize;
        const ctx = offCanvas.getContext("2d");

        ctx.fillStyle = "#808080";
        ctx.fillRect(0, 0, this.targetSize, this.targetSize);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(drawable, box.padX, box.padY, box.targetW, box.targetH);

        const imgData = ctx.getImageData(0, 0, this.targetSize, this.targetSize).data;
        const floatData = new Float32Array(3 * this.targetSize * this.targetSize);
        const mean = [0.485, 0.456, 0.406];
        const std = [0.229, 0.224, 0.225];

        for (let i = 0; i < this.targetSize * this.targetSize; i++) {
          const r = imgData[i * 4] / 255;
          const g = imgData[i * 4 + 1] / 255;
          const b = imgData[i * 4 + 2] / 255;

          floatData[i] = (r - mean[0]) / std[0];
          floatData[this.targetSize * this.targetSize + i] = (g - mean[1]) / std[1];
          floatData[2 * this.targetSize * this.targetSize + i] = (b - mean[2]) / std[2];
        }

        return new ort.Tensor("float32", floatData, [1, 3, this.targetSize, this.targetSize]);
      }

      sigmoid(x) {
        return 1 / (1 + Math.exp(-x));
      }

      compositeResult(drawable, outputData, box) {
        const width = drawable.naturalWidth || drawable.videoWidth || drawable.width;
        const height = drawable.naturalHeight || drawable.videoHeight || drawable.height;

        const origCanvas = document.createElement("canvas");
        origCanvas.width = width;
        origCanvas.height = height;
        const origCtx = origCanvas.getContext("2d");
        origCtx.drawImage(drawable, 0, 0, width, height);

        let min = Infinity;
        let max = -Infinity;
        for (let i = 0; i < outputData.length; i++) {
          if (outputData[i] < min) min = outputData[i];
          if (outputData[i] > max) max = outputData[i];
        }

        const range = max - min || 1;
        const cutoff = 0.15 + (this.force * 0.7);
        const feather = 0.1;
        const low = Math.max(0, cutoff - feather);
        const high = Math.min(1, cutoff + feather);

        const maskSquare = document.createElement("canvas");
        maskSquare.width = this.targetSize;
        maskSquare.height = this.targetSize;
        const maskSquareCtx = maskSquare.getContext("2d");
        const maskImg = maskSquareCtx.createImageData(this.targetSize, this.targetSize);

        for (let i = 0; i < outputData.length; i++) {
          const norm = (outputData[i] - min) / range;
          const t = Math.max(0, Math.min(1, (norm - low) / (high - low)));
          const alpha = t * t * (3 - 2 * t);

          maskImg.data[i * 4] = 0;
          maskImg.data[i * 4 + 1] = 0;
          maskImg.data[i * 4 + 2] = 0;
          maskImg.data[i * 4 + 3] = Math.round(alpha * 255);
        }

        maskSquareCtx.putImageData(maskImg, 0, 0);

        const croppedMaskCanvas = document.createElement("canvas");
        croppedMaskCanvas.width = box.targetW;
        croppedMaskCanvas.height = box.targetH;
        const croppedCtx = croppedMaskCanvas.getContext("2d");
        croppedCtx.drawImage(
          maskSquare,
          box.padX, box.padY, box.targetW, box.targetH,

class CurveEngine {
    constructor(sourceCanvas = null) {
        this.sourceCanvas = sourceCanvas;
        this.outputCanvas = document.createElement('canvas');
        this.ctx = this.outputCanvas.getContext('2d', { willReadFrequently: true });
        this.onRender = null;
 
        this.curves = {
            r: [{ x: 0, y: 0 }, { x: 255, y: 255 }],
            g: [{ x: 0, y: 0 }, { x: 255, y: 255 }],
            b: [{ x: 0, y: 0 }, { x: 255, y: 255 }],
            a: [{ x: 0, y: 0 }, { x: 255, y: 255 }]
        };

        this.luts = {
            r: new Uint8Array(256),
            g: new Uint8Array(256),
            b: new Uint8Array(256),
            a: new Uint8Array(256)
        };

        this.updateAllLUTs();
    }

    setSource(canvasOrImage) {
        if (!canvasOrImage) return;
        this.sourceCanvas = canvasOrImage;
        const w = canvasOrImage.naturalWidth || canvasOrImage.videoWidth || canvasOrImage.width;
        const h = canvasOrImage.naturalHeight || canvasOrImage.videoHeight || canvasOrImage.height;
        this.outputCanvas.width = w;
        this.outputCanvas.height = h;
        this.ctx.drawImage(canvasOrImage, 0, 0);
        this.render();
    }

    // Interpolación cúbica monótona (evita oscilaciones extrañas)
    _buildLUT(points) {
        const lut = new Uint8Array(256);
        const sorted = [...points].sort((a, b) => a.x - b.x);
        const n = sorted.length;

        if (n === 0) {
            for (let i = 0; i < 256; i++) lut[i] = i;
            return lut;
        }

        const dx = [], dy = [], m = [];
        for (let i = 0; i < n - 1; i++) {
            const dX = sorted[i + 1].x - sorted[i].x;
            const dY = sorted[i + 1].y - sorted[i].y;
            dx.push(dX);
            dy.push(dY);
            m.push(dX === 0 ? 0 : dY / dX);
        }

        // Tangentes interiores
        const tangents = [m[0]];
        for (let i = 0; i < n - 2; i++) {
            tangents.push((m[i] + m[i + 1]) / 2);
        }
        tangents.push(m[m.length - 1]);

        // Evaluación de 0 a 255
        let seg = 0;
        for (let x = 0; x < 256; x++) {
            if (x < sorted[0].x) {
                lut[x] = Math.max(0, Math.min(255, Math.round(sorted[0].y)));
                continue;
            }
            if (x >= sorted[n - 1].x) {
                lut[x] = Math.max(0, Math.min(255, Math.round(sorted[n - 1].y)));
                continue;
            }

            while (seg < n - 1 && x > sorted[seg + 1].x) {
                seg++;
            }

            const x0 = sorted[seg].x;
            const x1 = sorted[seg + 1].x;
            const y0 = sorted[seg].y;
            const y1 = sorted[seg + 1].y;
            const h_seg = x1 - x0;

            if (h_seg === 0) {
                lut[x] = Math.round(y0);
            } else {
                const t = (x - x0) / h_seg;
                const t2 = t * t;
                const t3 = t2 * t;

                const h00 = 2 * t3 - 3 * t2 + 1;
                const h10 = t3 - 2 * t2 + t;
                const h01 = -2 * t3 + 3 * t2;
                const h11 = t3 - t2;

                const y = h00 * y0 + h10 * h_seg * tangents[seg] + h01 * y1 + h11 * h_seg * tangents[seg + 1];
                lut[x] = Math.max(0, Math.min(255, Math.round(y)));
            }
        }
        return lut;
    }

    updateChannelLUT(ch) {
        this.luts[ch] = this._buildLUT(this.curves[ch]);
    }

    updateAllLUTs() {
        ['r', 'g', 'b', 'a'].forEach(ch => this.updateChannelLUT(ch));
    }

    resetChannel(ch) {
        this.curves[ch] = [{ x: 0, y: 0 }, { x: 255, y: 255 }];
        this.updateChannelLUT(ch);
        this.render();
    }

    reset() {
        ['r', 'g', 'b', 'a'].forEach(ch => {
            this.curves[ch] = [{ x: 0, y: 0 }, { x: 255, y: 255 }];
        });
        this.updateAllLUTs();
        if (this.sourceCanvas) {
            this.ctx.clearRect(0, 0, this.outputCanvas.width, this.outputCanvas.height);
            this.ctx.drawImage(this.sourceCanvas, 0, 0);
        }
        if (this.onRender) this.onRender(this.outputCanvas);
    }

    render() {
        if (!this.sourceCanvas) return;
        const w = this.sourceCanvas.width;
        const h = this.sourceCanvas.height;

        this.outputCanvas.width = w;
        this.outputCanvas.height = h;

        const temp = document.createElement('canvas');
        temp.width = w;
        temp.height = h;
        const tctx = temp.getContext('2d');
        tctx.drawImage(this.sourceCanvas, 0, 0);

        const imgData = tctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        const lutR = this.luts.r;
        const lutG = this.luts.g;
        const lutB = this.luts.b;
        const lutA = this.luts.a;

        for (let i = 0; i < data.length; i += 4) {
            data[i]     = lutR[data[i]];
            data[i + 1] = lutG[data[i + 1]];
            data[i + 2] = lutB[data[i + 2]];
            data[i + 3] = lutA[data[i + 3]];
        }

        this.ctx.putImageData(imgData, 0, 0);
        if (this.onRender) this.onRender(this.outputCanvas);
    }

    getCanvas() {
        return this.outputCanvas;
    }
}

            y: Math.round(yNorm * 255),
            nx: xNorm,
            ny: yNorm

            ctx.strokeStyle = this.colors[ch];
            ctx.lineWidth = isChecked ? 2 : 1;
            ctx.globalAlpha = isChecked ? 1.0 : 0.2;

            ctx.beginPath();
            for (let x = 0; x < 256; x++) {
                const pt = this.valueToCanvas(x, lut[x]);
                if (x === 0) ctx.moveTo(pt.cx, pt.cy);
                else ctx.lineTo(pt.cx, pt.cy);
            }
            ctx.stroke();

            if (isChecked) {
                const pts = this.engine.curves[ch];
                pts.forEach(p => {
                    const pt = this.valueToCanvas(p.x, p.y);
                    const isSelected = (this.selectedPointX !== null && Math.abs(p.x - this.selectedPointX) <= 4);

                    ctx.fillStyle = isSelected ? '#ffffff' : this.colors[ch];
                    ctx.strokeStyle = '#181818';
                    ctx.lineWidth = 1.5;

                    ctx.beginPath();
                    ctx.arc(pt.cx, pt.cy, isSelected ? 5 : 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                });
            }
            ctx.restore();
        });
    }
}



class PixelArtEngine {
    constructor(sourceCanvas = null) {
        this.sourceCanvas = sourceCanvas;
        this.outputCanvas = document.createElement('canvas');
        this.ctx = this.outputCanvas.getContext('2d', { willReadFrequently: true });
        this.blockSize = 7;
        this.strength = 8;
        this.style = 'solid';
        this.onRender = null;
    }

    setSource(canvasOrImage) {
        if (!canvasOrImage) return;
        this.sourceCanvas = canvasOrImage;
        const w = canvasOrImage.naturalWidth || canvasOrImage.videoWidth || canvasOrImage.width;
        const h = canvasOrImage.naturalHeight || canvasOrImage.videoHeight || canvasOrImage.height;
        this.outputCanvas.width = w;
        this.outputCanvas.height = h;
        this.ctx.drawImage(canvasOrImage, 0, 0);
        this.render();
    }

    setParams(params = {}) {
        if (params.blockSize !== undefined) this.blockSize = Math.max(2, Math.min(64, parseInt(params.blockSize, 10)));
        if (params.strength !== undefined) this.strength = Math.max(2, Math.min(32, parseInt(params.strength, 10)));
        if (params.style !== undefined) this.style = params.style;
        this.render();
    }

    reset() {
        if (!this.sourceCanvas) return;
        const w = this.sourceCanvas.width;
        const h = this.sourceCanvas.height;
        this.outputCanvas.width = w;
        this.outputCanvas.height = h;
        this.ctx.clearRect(0, 0, w, h);
        this.ctx.drawImage(this.sourceCanvas, 0, 0);
        if (this.onRender) this.onRender(this.outputCanvas);
    }

    _posterize(r, g, b, strength) {
        let levels = Math.floor(2 + (strength - 2) * (254 / 30));
        levels = Math.min(256, Math.max(2, levels));
        const step = 255 / (levels - 1);
        return {
            r: Math.min(255, Math.max(0, Math.round(r / step) * step)),
            g: Math.min(255, Math.max(0, Math.round(g / step) * step)),
            b: Math.min(255, Math.max(0, Math.round(b / step) * step))
        };
    }

    _getSolid(src, w, h, bx, by, bs, str) {
        const cx = Math.min(bx * bs + Math.floor(bs / 2), w - 1);
        const cy = Math.min(by * bs + Math.floor(bs / 2), h - 1);
        const idx = (cy * w + cx) * 4;
        const a = src[idx + 3];
        if (a < 10) return { r: 0, g: 0, b: 0, a: 0 };
        const c = this._posterize(src[idx], src[idx + 1], src[idx + 2], str);
        c.a = a;
        return c;
    }

    _getAverage(src, w, h, bx, by, bs, str) {
        const sx = bx * bs;
        const sy = by * bs;
        const ex = Math.min(sx + bs, w);
        const ey = Math.min(sy + bs, h);
        let r = 0, g = 0, b = 0, a = 0, count = 0, valid = 0;

        for (let y = sy; y < ey; y++) {
            for (let x = sx; x < ex; x++) {
                const idx = (y * w + x) * 4;
                const alpha = src[idx + 3];
                if (alpha > 10) {
                    r += src[idx];
                    g += src[idx + 1];
                    b += src[idx + 2];
                    valid++;
                }
                a += alpha;
                count++;
            }
        }

        if (count === 0 || valid === 0) return { r: 0, g: 0, b: 0, a: 0 };
        const c = this._posterize(r / valid, g / valid, b / valid, str);
        c.a = Math.round(a / count);
        return c;
    }

    _detectEdge(src, w, h, x, y) {
        if (x <= 0 || y <= 0 || x >= w - 1 || y >= h - 1) return true;
        const idx = (y * w + x) * 4;
        const r = src[idx], g = src[idx + 1], b = src[idx + 2];
        let maxDiff = 0;

        for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
                if (dx === 0 && dy === 0) continue;
                const nIdx = ((y + dy) * w + (x + dx)) * 4;
                const diff = Math.abs(r - src[nIdx]) + Math.abs(g - src[nIdx + 1]) + Math.abs(b - src[nIdx + 2]);
                if (diff > maxDiff) maxDiff = diff;
            }
        }
        return maxDiff > 60;
    }

    _getEdge(src, w, h, bx, by, bs, str) {
        const base = this._getAverage(src, w, h, bx, by, bs, str);
        if (base.a === 0) return base;

        const sx = bx * bs;
        const sy = by * bs;
        const ex = Math.min(sx + bs, w);
        const ey = Math.min(sy + bs, h);
        let hasEdge = false;
        const step = Math.max(1, Math.floor(bs / 3));

        for (let y = sy; y < ey && !hasEdge; y += step) {
            for (let x = sx; x < ex && !hasEdge; x += step) {
                if (this._detectEdge(src, w, h, x, y)) {
                    hasEdge = true;
                }
            }
        }

        if (hasEdge) {
            const edgeC = this._posterize(
                Math.max(0, base.r - 80),
                Math.max(0, base.g - 80),
                Math.max(0, base.b - 80),
                str
            );
            edgeC.a = base.a;
            return edgeC;
        }
        return base;
    }

    render() {
        if (!this.sourceCanvas) return;
        const w = this.sourceCanvas.width;
        const h = this.sourceCanvas.height;

        this.outputCanvas.width = w;
        this.outputCanvas.height = h;

        const temp = document.createElement('canvas');
        temp.width = w;
        temp.height = h;
        const tctx = temp.getContext('2d');
        tctx.drawImage(this.sourceCanvas, 0, 0);

        const srcData = tctx.getImageData(0, 0, w, h).data;
        const outImg = this.ctx.createImageData(w, h);
        const outData = outImg.data;

        const bs = this.blockSize;
        const str = this.strength;
        const bxCount = Math.ceil(w / bs);
        const byCount = Math.ceil(h / bs);

        let getColorFn;
        if (this.style === 'average') getColorFn = this._getAverage.bind(this);
        else if (this.style === 'edge') getColorFn = this._getEdge.bind(this);
        else getColorFn = this._getSolid.bind(this);

        for (let by = 0; by < byCount; by++) {
            for (let bx = 0; bx < bxCount; bx++) {
                const c = getColorFn(srcData, w, h, bx, by, bs, str);
                const sx = bx * bs;
                const sy = by * bs;
                const ex = Math.min(sx + bs, w);
                const ey = Math.min(sy + bs, h);

                for (let y = sy; y < ey; y++) {
                    for (let x = sx; x < ex; x++) {
                        const idx = (y * w + x) * 4;
                        outData[idx] = c.r;
                        outData[idx + 1] = c.g;
                        outData[idx + 2] = c.b;
                        outData[idx + 3] = c.a;
                    }
                }
            }
        }

        this.ctx.putImageData(outImg, 0, 0);
        if (this.onRender) this.onRender(this.outputCanvas);
    }

    getCanvas() {
        return this.outputCanvas;
    }
}

   class GLFXEngine {
    constructor(sourceCanvas = null) {
        this.sourceCanvas = sourceCanvas;
        this.fxCanvas = null;
        this.texture = null;
        this.outputCanvas = document.createElement('canvas');
        this.ctx = this.outputCanvas.getContext('2d', { willReadFrequently: true });
        this.activeFilter = null;
        this.params = {};
        this.onRender = null;
        this.initGL();
    }

    initGL() {
        if (typeof fx === 'undefined') {
            const script = document.createElement('script');
            script.src = 'https://evanw.github.io/glfx.js/glfx.js';
            script.onload = () => this.initGL();
            document.head.appendChild(script);
            return;
        }
        try {
            this.fxCanvas = fx.canvas();
        } catch (e) {
            console.error(e);
        }
    }

    setSource(canvasOrImage) {
        if (!canvasOrImage) return;
        this.sourceCanvas = canvasOrImage;
        const w = canvasOrImage.videoWidth || canvasOrImage.naturalWidth || canvasOrImage.width;
        const h = canvasOrImage.videoHeight || canvasOrImage.naturalHeight || canvasOrImage.height;
        this.outputCanvas.width = w;
        this.outputCanvas.height = h;
        this.ctx.drawImage(canvasOrImage, 0, 0);

        if (this.fxCanvas) {
            if (this.texture) {
                try { this.texture.destroy(); } catch (e) {}
            }
            this.texture = this.fxCanvas.texture(this.outputCanvas);
        }
        this.render();
    }

    setFilter(name, params = {}) {
        this.activeFilter = name;
        this.params = { ...this.params, ...params };
        this.render();
    }

    reset() {
        this.activeFilter = null;
        this.params = {};
        if (this.sourceCanvas) {
            this.ctx.clearRect(0, 0, this.outputCanvas.width, this.outputCanvas.height);
            this.ctx.drawImage(this.sourceCanvas, 0, 0);
            if (this.onRender) this.onRender(this.outputCanvas);
        }
    }

    render() {
        if (!this.sourceCanvas || !this.fxCanvas) return;
        if (!this.texture) {
            this.texture = this.fxCanvas.texture(this.sourceCanvas);
        } else {
            this.texture.loadContentsOf(this.sourceCanvas);
        }

        const w = this.outputCanvas.width;
        const h = this.outputCanvas.height;
        const p = this.params;

        if (this.activeFilter === 'normalmap') {
            this.renderNormalMap();
            return;
        }

        if (this.activeFilter === 'carbon') {
            this.renderCarbon();
            return;
        }

        this.fxCanvas.draw(this.texture);

        switch (this.activeFilter) {
            case 'brightnessContrast':
                this.fxCanvas.brightnessContrast(p.brightness ?? 0, p.contrast ?? 0);
                break;
            case 'hueSaturation':
                this.fxCanvas.hueSaturation(p.hue ?? 0, p.saturation ?? 0);
                break;
            case 'vibrance':
                this.fxCanvas.vibrance(p.amount ?? 0);
                break;
            case 'denoise':
                this.fxCanvas.denoise(p.exponent ?? 20);
                break;
            case 'unsharpMask':
                this.fxCanvas.unsharpMask(p.radius ?? 20, p.strength ?? 2);
                break;
            case 'noise':
                this.fxCanvas.noise(p.amount ?? 0.5);
                break;
            case 'sepia':
                this.fxCanvas.sepia(p.amount ?? 1);
                break;
            case 'vignette':
                this.fxCanvas.vignette(p.size ?? 0.5, p.amount ?? 0.5);
                break;
            case 'zoomBlur':
                this.fxCanvas.zoomBlur(w * (p.x ?? 0.5), h * (p.y ?? 0.5), p.amount ?? 0.3);
                break;
            case 'triangleBlur':
                this.fxCanvas.triangleBlur(p.radius ?? 15);
                break;
            case 'tiltShift': {
                const posX = w * (p.x ?? 0.5);
                const posY = h * (p.y ?? 0.5);
                const rad = ((p.angle ?? 0) * Math.PI) / 180;
                const dist = Math.max(w, h);
                const dx = Math.cos(rad) * dist;
                const dy = Math.sin(rad) * dist;
                const x1 = posX - dx;
                const y1 = posY - dy;
                const x2 = posX + dx;
                const y2 = posY + dy;
                const bR = p.blurRadius ?? 25;
                const gR = p.gradientRadius ?? 200;
                this.fxCanvas.tiltShift(x1, y1, x2, y2, bR, gR);
                break;
            }
            case 'lensBlur': {
                const r = p.radius ?? 15;
                const b = p.brightness ?? 0.5;
                const a = ((p.angle ?? 0) * Math.PI) / 180;
                this.fxCanvas.lensBlur(r, b, a);
                break;
            }
            case 'swirl':
                this.fxCanvas.swirl(w * (p.x ?? 0.5), h * (p.y ?? 0.5), p.radius ?? (Math.min(w, h) / 2), p.angle ?? 3);
                break;
            case 'bulgePinch':
                this.fxCanvas.bulgePinch(w * (p.x ?? 0.5), h * (p.y ?? 0.5), p.radius ?? (Math.min(w, h) / 2), p.strength ?? 0.5);
                break;
            case 'perspective': {
                const b = [0, 0, w, 0, 0, h, w, h];
                const dx = (p.dx ?? 0.2) * w;
                const a = [dx, 0, w - dx, 0, 0, h, w, h];
                this.fxCanvas.perspective(b, a);
                break;
            }
            case 'ink':
                this.fxCanvas.ink(p.strength ?? 0.25);
                break;
            case 'edgeWork':
                this.fxCanvas.edgeWork(p.radius ?? 2);
                break;
            case 'hexagonalPixelate':
                this.fxCanvas.hexagonalPixelate(w * (p.x ?? 0.5), h * (p.y ?? 0.5), p.scale ?? 10);
                break;
            case 'dotScreen':
                this.fxCanvas.dotScreen(w * (p.x ?? 0.5), h * (p.y ?? 0.5), p.angle ?? 1.1, p.size ?? 3);
                break;
            case 'colorHalftone':
                this.fxCanvas.colorHalftone(w * (p.x ?? 0.5), h * (p.y ?? 0.5), p.angle ?? 0.25, p.size ?? 4);
                break;
        }

        this.fxCanvas.update();
        this.ctx.clearRect(0, 0, w, h);
        this.ctx.drawImage(this.fxCanvas, 0, 0);
        if (this.onRender) this.onRender(this.outputCanvas);
    }

    renderCarbon() {
        const w = this.outputCanvas.width;
        const h = this.outputCanvas.height;
        const p = this.params;
        this.fxCanvas.draw(this.texture);
        this.fxCanvas.hueSaturation(0, -1);
        this.fxCanvas.edgeWork(p.radius ?? 2);
        this.fxCanvas.ink(p.strength ?? 0.5);
        this.fxCanvas.brightnessContrast(p.brightness ?? 0.1, p.contrast ?? 0.3);
        this.fxCanvas.update();
        this.ctx.clearRect(0, 0, w, h);
        this.ctx.drawImage(this.fxCanvas, 0, 0);
        if (this.onRender) this.onRender(this.outputCanvas);
    }

    renderNormalMap() {
        const w = this.outputCanvas.width;
        const h = this.outputCanvas.height;
        const p = this.params;
        this.ctx.drawImage(this.sourceCanvas, 0, 0);
        const imgData = this.ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        const out = this.ctx.createImageData(w, h);
        const odata = out.data;

        const strength = p.strength ?? 2.5;
        const invR = p.invertR ? -1.0 : 1.0;
        const invG = p.invertG ? -1.0 : 1.0;

        const getLum = (x, y) => {
            const px = Math.max(0, Math.min(w - 1, x));
            const py = Math.max(0, Math.min(h - 1, y));
            const i = (py * w + px) * 4;
            return (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114) / 255.0;
        };

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const i = (y * w + x) * 4;
                const tl = getLum(x - 1, y - 1);
                const t  = getLum(x, y - 1);
                const tr = getLum(x + 1, y - 1);
                const l  = getLum(x - 1, y);
                const r  = getLum(x + 1, y);
                const bl = getLum(x - 1, y + 1);
                const b  = getLum(x, y + 1);
                const br = getLum(x + 1, y + 1);

                const dX = ((tr + 2.0 * r + br) - (tl + 2.0 * l + bl)) * strength * invR;
                const dY = ((bl + 2.0 * b + br) - (tl + 2.0 * t + tr)) * strength * invG;
                const dZ = 1.0;

                const len = Math.sqrt(dX * dX + dY * dY + dZ * dZ);
                const nx = dX / len;
                const ny = dY / len;
                const nz = dZ / len;

                odata[i]     = Math.floor((nx * 0.5 + 0.5) * 255);
                odata[i + 1] = Math.floor((ny * 0.5 + 0.5) * 255);
                odata[i + 2] = Math.floor((nz * 0.5 + 0.5) * 255);
                odata[i + 3] = data[i + 3];
            }
        }
        this.ctx.putImageData(out, 0, 0);
        if (this.onRender) this.onRender(this.outputCanvas);
    }

    getCanvas() {
        return this.outputCanvas;
    }
}
