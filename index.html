class BackgroundRemover {
    /**
     * @param {Object} options
     * @param {HTMLCanvasElement} [options.canvas] - Canvas inicial (opcional).
     * @param {HTMLElement|Object} [options.button] - Botón HTML o UI.Button para disparar el proceso.
     * @param {boolean} [options.keepTransparency=true] - Mantener transparencias previas.
     * @param {Function} [options.onFinish] - Callback al terminar: ({ canvas, image, imageData }) => {}
     * @param {Function} [options.onProgress] - Callback: (porcentaje, key) => {}
     * @param {Function} [options.onStart] - Callback al iniciar.
     * @param {Function} [options.onError] - Callback en caso de error.
     */
    constructor(options = {}) {
        this.canvas = options.canvas || null;
        this.button = options.button ? (options.button.element || options.button) : null;
        this.keepTransparency = options.keepTransparency !== false;

        this.onFinish = options.onFinish || null;
        this.onProgress = options.onProgress || null;
        this.onStart = options.onStart || null;
        this.onError = options.onError || null;

        this._removeBgFn = null;
        this._isProcessing = false;

        if (this.button) {
            this._boundClick = () => this.process();
            this.button.addEventListener('click', this._boundClick);
        }
    }

    
    setCanvas(canvas) {
        if (!(canvas instanceof HTMLCanvasElement)) {
            console.warn('setCanvas: El elemento no es un HTMLCanvasElement válido');
        }
        this.canvas = canvas;
        return this;
    }

    
    async setImg(source) {
        let img;
        if (typeof source === 'string') {
            img = await this._loadImage(source);
        } else if (source instanceof Blob || source instanceof File) {
            const url = URL.createObjectURL(source);
            img = await this._loadImage(url);
            URL.revokeObjectURL(url);
        } else if (source instanceof HTMLImageElement) {
            if (!source.complete) {
                await new Promise(r => source.onload = r);
            }
            img = source;
        } else {
            throw new Error('setImg: Formato de imagen no compatible');
        }

        if (!this.canvas) {
            this.canvas = document.createElement('canvas');
        }

        const w = img.naturalWidth || img.width;
        const h = img.naturalHeight || img.height;
        this.canvas.width = w;
        this.canvas.height = h;

        const ctx = this.canvas.getContext('2d', { willReadFrequently: true });
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0);

        return this;
    }

    async _loadLibrary() {
        if (!this._removeBgFn) {
            const mod = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.6.0/+esm');
            this._removeBgFn = mod.removeBackground;
        }
        return this._removeBgFn;
    }

    _loadImage(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = src;
        });
    }

    
    async process() {
        if (!this.canvas) {
            console.error('BackgroundRemover: Asigna un canvas con setCanvas() o setImg() antes de procesar.');
            return;
        }
        if (this._isProcessing) return;

        this._isProcessing = true;
        if (this.onStart) this.onStart();

        try {
            const removeBg = await this._loadLibrary();
            const targetCanvas = this.canvas;
            const ctx = targetCanvas.getContext('2d', { willReadFrequently: true });
            const w = targetCanvas.width;
            const h = targetCanvas.height;

            // 1. Guardar ImageData original para preservar transparencias previas
            let origImageData = null;
            if (this.keepTransparency) {
                origImageData = ctx.getImageData(0, 0, w, h);
            }

            // 2. Exportar canvas a blob
            const blob = await new Promise(res => targetCanvas.toBlob(res, 'image/png'));

            // 3. Procesar con IA
            const resultBlob = await removeBg(blob, {
                progress: (key, current, total) => {
                    if (this.onProgress && total > 0) {
                        const pct = Math.round((current / total) * 100);
                        this.onProgress(pct, key);
                    }
                }
            });

            // 4. Crear imagen resultante
            const blobUrl = URL.createObjectURL(resultBlob);
            const imgResult = await this._loadImage(blobUrl);

            // 5. Preservar transparencias previas si existían
            if (this.keepTransparency && origImageData) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = w;
                tempCanvas.height = h;
                const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
                tempCtx.drawImage(imgResult, 0, 0, w, h);

                const newImageData = tempCtx.getImageData(0, 0, w, h);
                const dOrig = origImageData.data;
                const dNew = newImageData.data;

                // Si un píxel ya era transparente en el original, se conserva transparente
                for (let i = 3; i < dNew.length; i += 4) {
                    dNew[i] = Math.min(dOrig[i], dNew[i]);
                }

                ctx.clearRect(0, 0, w, h);
                ctx.putImageData(newImageData, 0, 0);
            } else {
                ctx.clearRect(0, 0, w, h);
                ctx.drawImage(imgResult, 0, 0, w, h);
            }

            // 6. Preparar los 3 datos de salida (Canvas, Image, ImageData)
            const finalImageData = ctx.getImageData(0, 0, w, h);
            const finalImg = new Image();
            finalImg.src = targetCanvas.toDataURL('image/png');
            await new Promise(r => finalImg.onload = r);

            // 7. Notificar finalización mediante el callback
            if (this.onFinish) {
                this.onFinish({
                    canvas: targetCanvas,
                    image: finalImg,
                    imageData: finalImageData
                });
            }

            URL.revokeObjectURL(blobUrl);
        } catch (err) {
            console.error('Error removing background:', err);
            if (this.onError) this.onError(err);
        } finally {
            this._isProcessing = false;
        }
    }

    destroy() {
        if (this.button && this._boundClick) {
            this.button.removeEventListener('click', this._boundClick);
        }
    }
}
 </script>

<script  >
  /**
 * VanillaColorPicker
 * Versión completa, testeada y sin errores de sintaxis.
 */
class VanillaColorPicker {
    constructor(options = {}) {
        this.id = options.id || 'vcp_' + Math.random().toString(36).substring(2, 9);
        this.title = options.title || 'Selector HSV / RGB';
        this.onChange = options.onChange || (() => {});

        // Grosor de la barra vertical (por defecto 34px) y altura
        this.hueWidth = options.hueWidth || 34;
        this.canvasHeight = options.canvasHeight || 180;

        // Estado inicial RGB Normalizado (0.00 a 1.00)
        const init = options.initialColor || { r: 1.0, g: 0.0, b: 0.0, a: 1.0 };
        this.r = init.r > 1 ? init.r / 255 : (init.r ?? 1.0);
        this.g = init.g > 1 ? init.g / 255 : (init.g ?? 1.0);
        this.b = init.b > 1 ? init.b / 255 : (init.b ?? 0.0);
        this.a = init.a ?? 1.0;

        const hsv = this.rgbToHsv(this.r, this.g, this.b);
        this.h = hsv.h;
        this.s = hsv.s;
        this.v = hsv.v;

        this.hex = this.rgbToHex(this.r, this.g, this.b);

        this.injectStyles();
        this.buildDOM();
        this.initCanvasEvents();

        this.panel = { element: this.container, title: this.title };
        this.element = this.container;

        this.drawHueCanvas();
        this.drawSVCanvas();
        this.updateStats();
    }

    mount(target) {
        const dest = target?.element || target;
        if (dest && dest.appendChild) {
            dest.appendChild(this.container);
        }
        return this;
    }

    injectStyles() {
        if (document.getElementById('vanilla-color-picker-core-css')) return;

        const style = document.createElement('style');
        style.id = 'vanilla-color-picker-core-css';
        style.textContent = `
            .vcp-root {
                background: #19191c;
                border: 1px solid #2d2d33;
                border-radius: 6px;
                padding: 10px;
                color: #8c8c8c;
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                font-size: 11px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                gap: 8px;
                user-select: none;
                width: 100%;
                max-width: 320px;
            }
            .vcp-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .vcp-title {
                font-weight: 700;
                color: #7a7a85;
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .vcp-canvas-area {
                display: flex;
                gap: 8px;
                margin-top: 2px;
            }
            .vcp-sv-canvas {
                flex: 1 1 0;
                min-width: 0;
                border-radius: 4px;
                cursor: crosshair;
                border: 1px solid #333;
                display: block;
            }
            .vcp-hue-canvas {
                border-radius: 4px;
                cursor: pointer;
                border: 1px solid #333;
                display: block;
                flex-shrink: 0;
            }
            .vcp-preview-wrapper {
                width: 44px;
                height: 22px;
                border-radius: 4px;
                border: 1px solid #3e3e46;
                position: relative;
                overflow: hidden;
                cursor: pointer;
                background-image: 
                    linear-gradient(45deg, #252529 25%, transparent 25%), 
                    linear-gradient(-45deg, #252529 25%, transparent 25%), 
                    linear-gradient(45deg, transparent 75%, #252529 75%), 
                    linear-gradient(-45deg, transparent 75%, #252529 75%);
                background-size: 8px 8px;
                background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
            }
            .vcp-preview-color {
                width: 100%;
                height: 100%;
            }
            .vcp-row {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .vcp-input {
                background: #292929 !important;
                color: #676767 !important;
                border: 1px solid #383838;
                border-radius: 4px;
                padding: 4px 6px;
                font-family: inherit;
                font-size: 11px;
                outline: none;
                box-sizing: border-box;
                transition: border-color 0.2s, color 0.2s;
            }
            .vcp-input:focus {
                border-color: #555555;
                color: #b5b5b5 !important;
            }
            .vcp-grid-rgba {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .vcp-grid-cell {
                display: flex;
                align-items: center;
                gap: 4px;
            }
            .vcp-grid-cell .vcp-label {
                width: 12px;
                color: #676767;
                font-size: 10px;
                font-weight: bold;
            }
            .vcp-grid-cell input[type="number"] {
                width: 100%;
                -moz-appearance: textfield;
            }
            .vcp-grid-cell input[type="number"]::-webkit-outer-spin-button,
            .vcp-grid-cell input[type="number"]::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            .vcp-stats-box {
                background: #1e1e22;
                border: 1px dashed #34343d;
                border-radius: 4px;
                padding: 6px 8px;
                display: flex;
                justify-content: space-between;
                font-size: 10px;
                color: #676767;
            }
            .vcp-stats-val { color: #a0a0aa; font-weight: bold; }
            .vcp-stats-ratio { color: #38bdf8; font-weight: bold; }
        `;
        document.head.appendChild(style);
    }

    buildDOM() {
        this.container = document.createElement('div');
        this.container.id = this.id;
        this.container.className = 'vcp-root';

        // 1. Título y Previsualizador
        const header = document.createElement('div');
        header.className = 'vcp-header';

        const title = document.createElement('span');
        title.className = 'vcp-title';
        title.textContent = this.title;
        header.appendChild(title);

        this.previewWrapper = document.createElement('div');
        this.previewWrapper.className = 'vcp-preview-wrapper';
        this.previewColor = document.createElement('div');
        this.previewColor.className = 'vcp-preview-color';
        this.previewColor.style.background = this.getRGBAString();
        this.previewWrapper.appendChild(this.previewColor);
        header.appendChild(this.previewWrapper);
        this.container.appendChild(header);

        // 2. Área de los Canvas
        const canvasArea = document.createElement('div');
        canvasArea.className = 'vcp-canvas-area';
        canvasArea.style.height = this.canvasHeight + 'px';

        // Canvas SV (Izquierdo)
        this.svCanvas = document.createElement('canvas');
        this.svCanvas.className = 'vcp-sv-canvas';
        this.svCanvas.width = 240;
        this.svCanvas.height = this.canvasHeight;
        this.svCanvas.style.flex = '1 1 0';
        this.svCanvas.style.minWidth = '0';
        this.svCtx = this.svCanvas.getContext('2d');

        // Canvas Hue (Barra Vertical Derecha con ancho fijo)
        this.hueCanvas = document.createElement('canvas');
        this.hueCanvas.className = 'vcp-hue-canvas';
        this.hueCanvas.width = this.hueWidth;
        this.hueCanvas.height = this.canvasHeight;
        this.hueCanvas.style.width = this.hueWidth + 'px';
        this.hueCanvas.style.minWidth = this.hueWidth + 'px';
        this.hueCanvas.style.maxWidth = this.hueWidth + 'px';
        this.hueCanvas.style.flex = '0 0 ' + this.hueWidth + 'px';
        this.hueCtx = this.hueCanvas.getContext('2d');

        canvasArea.appendChild(this.svCanvas);
        canvasArea.appendChild(this.hueCanvas);
        this.container.appendChild(canvasArea);

        // 3. Fila HEX y OBJETO RGBA
        const hexRow = document.createElement('div');
        hexRow.className = 'vcp-row';

        this.inputHex = document.createElement('input');
        this.inputHex.type = 'text';
        this.inputHex.className = 'vcp-input';
        this.inputHex.style.width = '75px';
        this.inputHex.maxLength = 7;
        this.inputHex.value = this.hex.toUpperCase();

        this.inputRgbaObj = document.createElement('input');
        this.inputRgbaObj.type = 'text';
        this.inputRgbaObj.className = 'vcp-input';
        this.inputRgbaObj.style.flex = '1';
        this.inputRgbaObj.style.minWidth = '0';
        this.inputRgbaObj.value = this.getRGBAObjectString();

        hexRow.appendChild(this.inputHex);
        hexRow.appendChild(this.inputRgbaObj);
        this.container.appendChild(hexRow);

        // 4. Inputs Numéricos R, G, B, A
        const rgbaGrid = document.createElement('div');
        rgbaGrid.className = 'vcp-grid-rgba';

        this.inputs = {};
        ['r', 'g', 'b', 'a'].forEach(ch => {
            const cell = document.createElement('div');
            cell.className = 'vcp-grid-cell';

            const lbl = document.createElement('span');
            lbl.className = 'vcp-label';
            lbl.textContent = ch.toUpperCase();

            const num = document.createElement('input');
            num.type = 'number';
            num.className = 'vcp-input';
            num.min = '0';
            num.max = '1';
            num.step = '0.01';
            num.value = this[ch].toFixed(2);

            cell.appendChild(lbl);
            cell.appendChild(num);
            rgbaGrid.appendChild(cell);
            this.inputs[ch] = num;

            num.addEventListener('input', () => {
                let val = parseFloat(num.value);
                if (isNaN(val)) val = 0;
                this[ch] = Math.max(0, Math.min(1, val));

                if (ch !== 'a') {
                    const hsv = this.rgbToHsv(this.r, this.g, this.b);
                    this.h = hsv.h;
                    this.s = hsv.s;
                    this.v = hsv.v;
                    this.hex = this.rgbToHex(this.r, this.g, this.b);
                    this.inputHex.value = this.hex.toUpperCase();
                }
                this.updateUI();
                this.emit();
            });
        });

        this.container.appendChild(rgbaGrid);

        // 5. Estadísticas
        this.statsBox = document.createElement('div');
        this.statsBox.className = 'vcp-stats-box';
        this.lblMin = document.createElement('div');
        this.lblMax = document.createElement('div');
        this.lblRatio = document.createElement('div');
        this.statsBox.appendChild(this.lblMin);
        this.statsBox.appendChild(this.lblMax);
        this.statsBox.appendChild(this.lblRatio);
        this.container.appendChild(this.statsBox);

        // Eventos de Inputs
        this.inputHex.addEventListener('change', (e) => {
            let val = e.target.value.trim();
            if (!val.startsWith('#')) val = '#' + val;
            if (/^#[0-9A-F]{6}$/i.test(val)) {
                this.setHex(val);
            } else {
                this.inputHex.value = this.hex.toUpperCase();
            }
        });

        this.inputRgbaObj.addEventListener('change', (e) => {
            const str = e.target.value;
            const rMatch = str.match(/r\s*:\s*([\d.]+)/i);
            const gMatch = str.match(/g\s*:\s*([\d.]+)/i);
            const bMatch = str.match(/b\s*:\s*([\d.]+)/i);
            const aMatch = str.match(/a\s*:\s*([\d.]+)/i);

            if (rMatch && gMatch && bMatch) {
                this.setRGBA({
                    r: parseFloat(rMatch[1]),
                    g: parseFloat(gMatch[1]),
                    b: parseFloat(bMatch[1]),
                    a: aMatch ? parseFloat(aMatch[1]) : this.a
                });
            } else {
                this.inputRgbaObj.value = this.getRGBAObjectString();
            }
        });
    }

    drawSVCanvas() {
        const w = this.svCanvas.width;
        const h = this.svCanvas.height;
        const ctx = this.svCtx;

        const pureColor = this.hsvToRgb(this.h, 1, 1);
        const hexHue = this.rgbToHex(pureColor.r, pureColor.g, pureColor.b);

        ctx.fillStyle = hexHue;
        ctx.fillRect(0, 0, w, h);

        const gradWhite = ctx.createLinearGradient(0, 0, w, 0);
        gradWhite.addColorStop(0, '#ffffff');
        gradWhite.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gradWhite;
        ctx.fillRect(0, 0, w, h);

        const gradBlack = ctx.createLinearGradient(0, 0, 0, h);
        gradBlack.addColorStop(0, 'rgba(0,0,0,0)');
        gradBlack.addColorStop(1, '#000000');
        ctx.fillStyle = gradBlack;
        ctx.fillRect(0, 0, w, h);

        const cx = this.s * w;
        const cy = (1 - this.v) * h;

        ctx.beginPath();
        ctx.arc(cx, cy, 5, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    drawHueCanvas() {
        const w = this.hueCanvas.width;
        const h = this.hueCanvas.height;
        const ctx = this.hueCtx;

        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0.00, '#ff0000');
        grad.addColorStop(0.17, '#ff00ff');
        grad.addColorStop(0.33, '#0000ff');
        grad.addColorStop(0.50, '#00ffff');
        grad.addColorStop(0.67, '#00ff00');
        grad.addColorStop(0.83, '#ffff00');
        grad.addColorStop(1.00, '#ff0000');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        const barY = ((360 - this.h) / 360) * h;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, barY - 2, w, 4);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1;
        ctx.strokeRect(0, barY - 2, w, 4);
    }

    initCanvasEvents() {
        let isDraggingSV = false;
        const handleSV = (e) => {
            const rect = this.svCanvas.getBoundingClientRect();
            const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
            const y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));

            this.s = x / rect.width;
            this.v = 1 - (y / rect.height);

            const rgb = this.hsvToRgb(this.h, this.s, this.v);
            this.r = rgb.r;
            this.g = rgb.g;
            this.b = rgb.b;
            this.hex = this.rgbToHex(this.r, this.g, this.b);

            this.updateUI();
            this.emit();
        };

        this.svCanvas.addEventListener('pointerdown', (e) => {
            isDraggingSV = true;
            this.svCanvas.setPointerCapture(e.pointerId);
            handleSV(e);
        });
        this.svCanvas.addEventListener('pointermove', (e) => {
            if (isDraggingSV) handleSV(e);
        });
        this.svCanvas.addEventListener('pointerup', () => { isDraggingSV = false; });

        let isDraggingHue = false;
        const handleHue = (e) => {
            const rect = this.hueCanvas.getBoundingClientRect();
            const y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));

            this.h = (1 - (y / rect.height)) * 360;
            if (this.h >= 360) this.h = 0;

            const rgb = this.hsvToRgb(this.h, this.s, this.v);
            this.r = rgb.r;
            this.g = rgb.g;
            this.b = rgb.b;
            this.hex = this.rgbToHex(this.r, this.g, this.b);

            this.updateUI();
            this.emit();
        };

        this.hueCanvas.addEventListener('pointerdown', (e) => {
            isDraggingHue = true;
            this.hueCanvas.setPointerCapture(e.pointerId);
            handleHue(e);
        });
        this.hueCanvas.addEventListener('pointermove', (e) => {
            if (isDraggingHue) handleHue(e);
        });
        this.hueCanvas.addEventListener('pointerup', () => { isDraggingHue = false; });
    }

    getRGBAObjectString() {
        const fmt = (n) => parseFloat(n.toFixed(3));
        return `rgba={r:${fmt(this.r)},g:${fmt(this.g)},b:${fmt(this.b)},a:${fmt(this.a)}}`;
    }

    getRGBAString() {
        return `rgba(${Math.round(this.r * 255)}, ${Math.round(this.g * 255)}, ${Math.round(this.b * 255)}, ${this.a})`;
    }

    updateStats() {
        let min = Math.min(this.r, this.g, this.b);
        let max = Math.max(this.r, this.g, this.b);
        let ratio = max > 0 ? (min / max) : 0;

        this.lblMin.innerHTML = `Mín: <span class="vcp-stats-val">${min.toFixed(2)}</span>`;
        this.lblMax.innerHTML = `Máx: <span class="vcp-stats-val">${max.toFixed(2)}</span>`;
        this.lblRatio.innerHTML = `Mín/Máx: <span class="vcp-stats-ratio">${ratio.toFixed(3)}</span>`;
    }

    updateUI() {
        this.previewColor.style.background = this.getRGBAString();
        this.inputs.r.value = this.r.toFixed(2);
        this.inputs.g.value = this.g.toFixed(2);
        this.inputs.b.value = this.b.toFixed(2);
        this.inputs.a.value = this.a.toFixed(2);
        this.inputHex.value = this.hex.toUpperCase();
        this.inputRgbaObj.value = this.getRGBAObjectString();

        this.drawSVCanvas();
        this.drawHueCanvas();
        this.updateStats();
    }

    setHex(hexStr) {
        if (!hexStr) return;
        let hex = hexStr.trim();
        if (!hex.startsWith('#')) hex = '#' + hex;

        const rgb = this.hexToRgb(hex);
        this.r = rgb.r / 255;
        this.g = rgb.g / 255;
        this.b = rgb.b / 255;
        this.hex = hex.toLowerCase();

        const hsv = this.rgbToHsv(this.r, this.g, this.b);
        this.h = hsv.h;
        this.s = hsv.s;
        this.v = hsv.v;

        this.updateUI();
        this.emit();
    }

    setRGBA(rgba) {
        if (!rgba) return;
        this.r = rgba.r !== undefined ? (rgba.r > 1 ? rgba.r / 255 : rgba.r) : this.r;
        this.g = rgba.g !== undefined ? (rgba.g > 1 ? rgba.g / 255 : rgba.g) : this.g;
        this.b = rgba.b !== undefined ? (rgba.b > 1 ? rgba.b / 255 : rgba.b) : this.b;
        this.a = rgba.a !== undefined ? rgba.a : this.a;

        this.hex = this.rgbToHex(this.r, this.g, this.b);
        const hsv = this.rgbToHsv(this.r, this.g, this.b);
        this.h = hsv.h;
        this.s = hsv.s;
        this.v = hsv.v;

        this.updateUI();
        this.emit();
    }

    emit() {
        const rgbaNormalized = {
            r: parseFloat(this.r.toFixed(3)),
            g: parseFloat(this.g.toFixed(3)),
            b: parseFloat(this.b.toFixed(3)),
            a: parseFloat(this.a.toFixed(3))
        };
        const rgba255 = {
            r: Math.round(this.r * 255),
            g: Math.round(this.g * 255),
            b: Math.round(this.b * 255),
            a: this.a
        };
        this.onChange(rgbaNormalized, rgba255, this.hex, this.a);
    }

    hsvToRgb(h, s, v) {
        let f = (n, k = (n + h / 60) % 6) => v - v * s * Math.max(Math.min(k, 4 - k, 1), 0);
        return { r: f(5), g: f(3), b: f(1) };
    }

    rgbToHsv(r, g, b) {
        let max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
        let h = 0, s = max === 0 ? 0 : d / max, v = max;
        if (max !== min) {
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h *= 60;
        }
        return { h, s, v };
    }

    rgbToHex(r, g, b) {
        const toHex = (n) => Math.max(0, Math.min(255, Math.round(n * 255))).toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
    }

    hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : { r: 255, g: 255, b: 255 };
    }
}

<script>
 

 const MathCad = {
    distanciaPuntoSegmento(p, a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const len2 = dx * dx + dy * dy;
        if (len2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
        let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
    },
    deCasteljau(puntos, t) {
        let temp = puntos.map(p => ({ x: p.x, y: p.y }));
        for (let r = 1; r < puntos.length; r++) {
            for (let i = 0; i < puntos.length - r; i++) {
                temp[i] = {
                    x: (1 - t) * temp[i].x + t * temp[i + 1].x,
                    y: (1 - t) * temp[i].y + t * temp[i + 1].y
                };
            }
        }
        return temp[0];
    },
    generarBezier(pts, samples = 80) {
        if (pts.length < 2) return pts.slice();
        const res = [];
        for (let i = 0; i <= samples; i++) {
            res.push(this.deCasteljau(pts, i / samples));
        }
        return res;
    },
    generarCirculo(c, p, samples = 80) {
        const r = Math.hypot(p.x - c.x, p.y - c.y);
        const res = [];
        for (let i = 0; i <= samples; i++) {
            const theta = (i / samples) * Math.PI * 2;
            res.push({ x: c.x + r * Math.cos(theta), y: c.y + r * Math.sin(theta) });
        }
        return res;
    },
    generarRectangulo(p1, p2) {
        return [
            { x: p1.x, y: p1.y },
            { x: p2.x, y: p1.y },
            { x: p2.x, y: p2.y },
            { x: p1.x, y: p2.y },
            { x: p1.x, y: p1.y }
        ];
    }
};
class FloodFillTool {
    static hexToRgba(colorStr) {
        if (!colorStr) return { r: 0, g: 0, b: 0, a: 255 };
        let c = String(colorStr).trim();
        if (c.startsWith('rgba') || c.startsWith('rgb')) {
            const nums = c.match(/[\d.]+/g);
            if (nums && nums.length >= 3) {
                return {
                    r: Math.min(255, Math.max(0, parseInt(nums[0], 10))),
                    g: Math.min(255, Math.max(0, parseInt(nums[1], 10))),
                    b: Math.min(255, Math.max(0, parseInt(nums[2], 10))),
                    a: nums[3] !== undefined ? Math.min(255, Math.max(0, Math.round(parseFloat(nums[3]) * 255))) : 255
                };
            }
        }
        c = c.replace('#', '');
        if (c.length === 3) c = c.split('').map(x => x + x).join('') + 'ff';
        else if (c.length === 6) c += 'ff';
        return {
            r: parseInt(c.slice(0, 2), 16) || 0,
            g: parseInt(c.slice(2, 4), 16) || 0,
            b: parseInt(c.slice(4, 6), 16) || 0,
            a: parseInt(c.slice(6, 8), 16) ?? 255
        };
    }

    static fill(layer, startX, startY, fillColorStr, opacity = 1.0, tolerance = 15, selectionManager = null) {
        if (!layer) return false;
        const w = layer.width;
        const h = layer.height;
        const x0 = Math.floor(startX);
        const y0 = Math.floor(startY);

        if (x0 < 0 || x0 >= w || y0 < 0 || y0 >= h) return false;

        const imgData = layer.ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        const startIndex = (y0 * w + x0) * 4;
        
        const tr = d[startIndex];
        const tg = d[startIndex + 1];
        const tb = d[startIndex + 2];
        const ta = d[startIndex + 3];

        const fc = this.hexToRgba(fillColorStr);
        const fr = fc.r;
        const fg = fc.g;
        const fb = fc.b;
        const fa = Math.min(255, Math.max(0, Math.round(fc.a * Math.min(1.0, Math.max(0.01, opacity)))));

        if (tr === fr && tg === fg && tb === fb && ta === fa) return false;

        let selData = null;
        if (selectionManager && selectionManager.hasSelection) {
            selData = selectionManager.maskCtx.getImageData(0, 0, w, h).data;
        }

        const maxDiff = (tolerance / 100) * 255;
        const matchesTarget = (idx) => {
            return Math.abs(d[idx]     - tr) <= maxDiff &&
                   Math.abs(d[idx + 1] - tg) <= maxDiff &&
                   Math.abs(d[idx + 2] - tb) <= maxDiff &&
                   Math.abs(d[idx + 3] - ta) <= maxDiff;
        };

        const isAllowed = (px, py) => {
            if (!selData) return true;
            return selData[(py * w + px) * 4 + 3] > 0;
        };

        if (!isAllowed(x0, y0)) return false;

        const visited = new Uint8Array(w * h);
        const queue = [x0, y0];

        while (queue.length > 0) {
            const py = queue.pop();
            const px = queue.pop();
            const pIdx = py * w + px;

            if (visited[pIdx]) continue;
            visited[pIdx] = 1;

            const dIdx = pIdx * 4;
            if (!matchesTarget(dIdx)) continue;

            d[dIdx]     = fr;
            d[dIdx + 1] = fg;
            d[dIdx + 2] = fb;
            d[dIdx + 3] = fa;

            if (px > 0 && !visited[pIdx - 1] && isAllowed(px - 1, py)) queue.push(px - 1, py);
            if (px < w - 1 && !visited[pIdx + 1] && isAllowed(px + 1, py)) queue.push(px + 1, py);
            if (py > 0 && !visited[pIdx - w] && isAllowed(px, py - 1)) queue.push(px, py - 1);
            if (py < h - 1 && !visited[pIdx + w] && isAllowed(px, py + 1)) queue.push(px, py + 1);
        }

        layer.ctx.putImageData(imgData, 0, 0);
        return true;
    }
}

class PureCadCurve {
    constructor({ type = 'bezier', degree = 3, style = {} } = {}) {
        this.type = type;
        this.degree = degree;
        this.pts = [];
        this.style = { stroke: '#38bdf8', lineWidth: 2, fill: null, ...style };
        this.forcedReady = false;
    }
    computePoints(extraPoint = null) {
        const pList = extraPoint ? [...this.pts, extraPoint] : [...this.pts];
        if (pList.length < 2) return [];
        return MathCad.generarBezier(pList, 64);
    }
}

class CadVectorEngine {
    constructor({ canvas, brushEngine = null } = {}) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.brushEngine = brushEngine;
        this.shapes = [];
        this.current = null;
        this.currentType = 'bezier';
        this.currentDegree = 3;
        this.defaultStyle = { stroke: '#38bdf8', lineWidth: 2, fill: null };
        this.selected = null;
        this.selectedPointIndex = -1;
        this.dragging = null;
        this.hoverPoint = null;
        this.active = false;
        this.useBrushStamp = false;
    }
    setSize(w, h) {
        this.canvas.width = w; this.canvas.height = h;
        this.canvas.style.width = w + 'px'; this.canvas.style.height = h + 'px';
        this.render();
    }
    handlePointerDown(x, y, e) {
        if (!this.active) return;
        if (e.button === 2) {
            this.finishCurrent();
            this.selected = null;
            this.selectedPointIndex = -1;
            this.render();
            return;
        }
        if (e.button !== 0) return;

        const p = { x, y };
        if (!this.current) {
            this.current = new PureCadCurve({ type: this.currentType, degree: this.currentDegree, style: { ...this.defaultStyle } });
        }
        this.current.pts.push(p);
        this.render();
    }
    handlePointerMove(x, y) {
        if (!this.active) return;
        if (this.current) {
            this.hoverPoint = { x, y };
            this.render();
        }
    }
    handlePointerUp() {}
    finishCurrent() {
        if (this.current) {
            if (this.current.pts.length >= 2) {
                this.current.forcedReady = true;
                this.shapes.push(this.current);
            }
            this.current = null;
        }
        this.hoverPoint = null;
        this.render();
    }
    clearAll() {
        this.shapes = [];
        this.current = null;
        this.selected = null;
        this.render();
    }
    render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        for (let sh of this.shapes) this.drawShapeDirect(this.ctx, sh);
        if (this.current) this.drawShapeDirect(this.ctx, this.current, { preview: true, extraPoint: this.hoverPoint });
    }
    drawShapeDirect(ctx, shape, opts = {}) {
        const rawPts = shape.computePoints(opts.extraPoint || null);
        if (rawPts.length < 2) return;
        ctx.save();
        ctx.lineWidth = shape.style.lineWidth;
        ctx.strokeStyle = opts.preview ? '#38bdf8' : shape.style.stroke;
        ctx.setLineDash(opts.preview ? [4, 4] : []);
        ctx.beginPath();
        ctx.moveTo(rawPts[0].x, rawPts[0].y);
        for (let i = 1; i < rawPts.length; i++) ctx.lineTo(rawPts[i].x, rawPts[i].y);
        ctx.stroke();
        ctx.restore();
    }
    bakeToLayer(layer) {
        if (!layer) return;
        for (const sh of this.shapes) {
            const poly = sh.computePoints();
            layer.ctx.save();
            layer.ctx.lineWidth = sh.style.lineWidth;
            layer.ctx.strokeStyle = sh.style.stroke;
            layer.ctx.beginPath();
            layer.ctx.moveTo(poly[0].x, poly[0].y);
            for (let i = 1; i < poly.length; i++) layer.ctx.lineTo(poly[i].x, poly[i].y);
            layer.ctx.stroke();
            layer.ctx.restore();
        }
    }
}

 class BrushTipRenderer {
    constructor() {
        this.cacheCanvas = document.createElement('canvas');
        this.cacheCtx = this.cacheCanvas.getContext('2d', { willReadFrequently: true });
        this.lastConfigKey = "";
    }
    renderTip({ size = 50, hardness = 0.5, color = '#ffffff', texture = null, blendMode = 'multiply' } = {}) {
        const res = 256;
        const configKey = `${size}_${hardness}_${color}_${blendMode}_${texture ? (texture.src || 'custom') : 'none'}`;
        if (this.lastConfigKey === configKey && this.cacheCanvas.width === res) return this.cacheCanvas;
        this.lastConfigKey = configKey;

        this.cacheCanvas.width = res;
        this.cacheCanvas.height = res;
        const ctx = this.cacheCtx;
        ctx.clearRect(0, 0, res, res);

        if (texture) {
            ctx.drawImage(texture, 0, 0, res, res);
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, res, res);
        }

        const imgData = ctx.getImageData(0, 0, res, res);
        const d = imgData.data;
        const cx = res / 2;
        const cy = res / 2;
        const maxR = res / 2;
        const rgb = FloodFillTool.hexToRgba(color);
        const cr = rgb.r / 255;
        const cg = rgb.g / 255;
        const cb = rgb.b / 255;
        const hard = Math.max(0, Math.min(0.999, hardness));

        for (let y = 0; y < res; y++) {
            for (let x = 0; x < res; x++) {
                const idx = (y * res + x) * 4;
                const dist = Math.hypot(x - cx, y - cy) / maxR;
                let grad = 0;
                if (dist <= hard) grad = 1;
                else if (dist < 1) grad = 1 - (dist - hard) / (1 - hard);

                if (texture) {
                    if (blendMode === 'multiply') {
                        d[idx]     = Math.round(d[idx] * cr);
                        d[idx + 1] = Math.round(d[idx + 1] * cg);
                        d[idx + 2] = Math.round(d[idx + 2] * cb);
                    } else if (blendMode === 'screen') {
                        d[idx]     = Math.round((1 - (1 - d[idx] / 255) * (1 - cr)) * 255);
                        d[idx + 1] = Math.round((1 - (1 - d[idx + 1] / 255) * (1 - cg)) * 255);
                        d[idx + 2] = Math.round((1 - (1 - d[idx + 2] / 255) * (1 - cb)) * 255);
                    }
                } else {
                    d[idx]     = Math.round(rgb.r);
                    d[idx + 1] = Math.round(rgb.g);
                    d[idx + 2] = Math.round(rgb.b);
                }

                d[idx + 3] = Math.round(d[idx + 3] * grad);
            }
        }
        ctx.putImageData(imgData, 0, 0);
        return this.cacheCanvas;
    }
}
class CanvasZoomManager {
    constructor({ container, target, onTransformChange = () => {} } = {}) {
        this.container = container;
        this.target = target;
        this.onTransformChange = onTransformChange;
        this.scale = 1.0;
        this.panX = 0;
        this.panY = 0;
        this.isPanning = false;
        this.lastX = 0;
        this.lastY = 0;
        this.init();
    }
    init() {
        this.container.addEventListener('wheel', (e) => this.handleWheel(e), { passive: false });
    }
    handleWheel(e) {
        e.preventDefault();
        const rect = this.container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const prevScale = this.scale;
        const factor = e.deltaY < 0 ? 1.15 : 0.85;
        this.scale = Math.min(Math.max(0.05, this.scale * factor), 15.0);
        this.panX = mouseX - (mouseX - this.panX) * (this.scale / prevScale);
        this.panY = mouseY - (mouseY - this.panY) * (this.scale / prevScale);
        this.apply();
    }
    startPan(clientX, clientY) {
        this.isPanning = true;
        this.lastX = clientX;
        this.lastY = clientY;
    }
    pan(clientX, clientY) {
        if (!this.isPanning) return;
        this.panX += clientX - this.lastX;
        this.panY += clientY - this.lastY;
        this.lastX = clientX;
        this.lastY = clientY;
        this.apply();
    }
    endPan() { this.isPanning = false; }
    zoomDelta(delta) {
        const factor = delta > 0 ? 1.2 : 0.8;
        const cx = this.container.clientWidth / 2;
        const cy = this.container.clientHeight / 2;
        const prevScale = this.scale;
        this.scale = Math.min(Math.max(0.05, this.scale * factor), 15.0);
        this.panX = cx - (cx - this.panX) * (this.scale / prevScale);
        this.panY = cy - (cy - this.panY) * (this.scale / prevScale);
        this.apply();
    }
    screenToWorld(clientX, clientY) {
        const rect = this.container.getBoundingClientRect();
        return {
            x: (clientX - rect.left - this.panX) / this.scale,
            y: (clientY - rect.top - this.panY) / this.scale
        };
    }
    apply() {
        this.target.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.scale})`;
        this.onTransformChange(this.scale, this.panX, this.panY);
    }
}

class HistoryManager {
    constructor({ onStateChange = () => {} } = {}) {
        this.undoStack = [];
        this.redoStack = [];
        this.maxStates = 30;
        this.onStateChange = onStateChange;
    }
    push(action) {
        this.undoStack.push(action);
        if (this.undoStack.length > this.maxStates) this.undoStack.shift();
        this.redoStack = [];
        this.notify();
    }
    undo() {
        if (!this.canUndo()) return;
        const action = this.undoStack.pop();
        action.undo();
        this.redoStack.push(action);
        this.notify();
    }
    redo() {
        if (!this.canRedo()) return;
        const action = this.redoStack.pop();
        action.redo();
        this.undoStack.push(action);
        this.notify();
    }
    canUndo() { return this.undoStack.length > 0; }
    canRedo() { return this.redoStack.length > 0; }
    notify() { this.onStateChange(this.canUndo(), this.canRedo(), this.undoStack.length, this.redoStack.length); }
}

class Layer {
    constructor(id, name, width, height) {
        this.id = id;
        this.name = name;
        this.width = width;
        this.height = height;
        this.originalWidth = width;
        this.originalHeight = height;
        
        this.visible = true; 
        this.opacity = 1.0;
        this.blendMode = 'normal';
        
        this.canvas = document.createElement('canvas');
        this.canvas.width = width;
        this.canvas.height = height;
        this.canvas.style.width = width + 'px';
        this.canvas.style.height = height + 'px';
        this.canvas.className = 'engine-canvas-layer';
        this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
    }
    setSize(w, h, preserveData = true) {
        let temp = null;
        if (preserveData) {
            temp = document.createElement('canvas');
            temp.width = this.width;
            temp.height = this.height;
            temp.getContext('2d').drawImage(this.canvas, 0, 0);
        }
        this.width = w;
        this.height = h;
        this.canvas.width = w;
        this.canvas.height = h;
        this.canvas.style.width = w + 'px';
        this.canvas.style.height = h + 'px';
        if (temp) {
            this.ctx.drawImage(temp, 0, 0, temp.width, temp.height, 0, 0, w, h);
        }
    }
    getSnapshot() { return this.ctx.getImageData(0, 0, this.width, this.height); }
    restoreSnapshot(data) {
        if (this.width !== data.width || this.height !== data.height) {
            this.setSize(data.width, data.height, false);
        }
        this.ctx.putImageData(data, 0, 0);
    }
}

class LayerStackEngine {
    constructor({ defaultWidth = 1024, defaultHeight = 768, renderContainer, onStackChanged = () => {} } = {}) {
        this.defaultWidth = defaultWidth;
        this.defaultHeight = defaultHeight;
        this.container = renderContainer;
        this.onStackChanged = onStackChanged;
        this.layers = [];
        this.activeLayerId = null;
        this.counter = 0;
    }
    mergeDown(id) {
        const idx = this.layers.findIndex(l => l.id === id);
        if (idx <= 0) return null;

        const topLayer = this.layers[idx];
        const bottomLayer = this.layers[idx - 1];

        bottomLayer.ctx.save();
        bottomLayer.ctx.globalAlpha = topLayer.opacity;
        bottomLayer.ctx.globalCompositeOperation = (topLayer.blendMode === 'normal') 
            ? 'source-over' 
            : (topLayer.blendMode || 'source-over');
        
        bottomLayer.ctx.drawImage(topLayer.canvas, 0, 0);
        bottomLayer.ctx.restore();

        this.layers.splice(idx, 1);
        this.activeLayerId = bottomLayer.id;
        this.syncDOM();
        this.onStackChanged(this.getLayerList(), this.activeLayerId);

        return { topLayer, bottomLayer, index: idx };
    }
    createLayer(name = null, width = null, height = null) {
        this.counter++;
        const id = 'layer_' + this.counter + '_' + Math.random().toString(36).substring(2, 7);
        const layerName = name || `Capa ${this.counter}`;
        
        const active = this.getActiveLayer();
        const w = width || (active ? active.width : this.defaultWidth);
        const h = height || (active ? active.height : this.defaultHeight);
        
        const layer = new Layer(id, layerName, w, h);
        this.layers.push(layer);
        this.activeLayerId = id;
        this.syncDOM();
        this.onStackChanged(this.getLayerList(), this.activeLayerId);
        return layer;
    }
    duplicateLayer(id) {
        const src = this.getLayerById(id);
        if (!src) return null;
        this.counter++;
        const newLayer = new Layer('layer_' + this.counter + '_' + Math.random().toString(36).substring(2, 7), `${src.name} (Copia)`, src.width, src.height);
        newLayer.ctx.drawImage(src.canvas, 0, 0);
        newLayer.opacity = src.opacity;
        newLayer.visible = src.visible;
        newLayer.blendMode = src.blendMode;
        const idx = this.layers.findIndex(l => l.id === id);
        this.layers.splice(idx + 1, 0, newLayer);
        this.activeLayerId = newLayer.id;
        this.syncDOM();
        this.onStackChanged(this.getLayerList(), this.activeLayerId);
        return newLayer;
    }
    deleteLayer(id) {
        if (this.layers.length <= 1) return null;
        const idx = this.layers.findIndex(l => l.id === id);
        if (idx === -1) return null;
        const deleted = this.layers.splice(idx, 1)[0];
        if (this.activeLayerId === id) {
            this.activeLayerId = this.layers[Math.max(0, idx - 1)].id;
        }
        this.syncDOM();
        this.onStackChanged(this.getLayerList(), this.activeLayerId);
        return { layer: deleted, index: idx };
    }
    moveUp(id) {
        const idx = this.layers.findIndex(l => l.id === id);
        if (idx < this.layers.length - 1) {
            const temp = this.layers[idx];
            this.layers[idx] = this.layers[idx + 1];
            this.layers[idx + 1] = temp;
            this.syncDOM();
            this.onStackChanged(this.getLayerList(), this.activeLayerId);
            return true;
        }
        return false;
    }
    moveDown(id) {
        const idx = this.layers.findIndex(l => l.id === id);
        if (idx > 0) {
            const temp = this.layers[idx];
            this.layers[idx] = this.layers[idx - 1];
            this.layers[idx - 1] = temp;
            this.syncDOM();
            this.onStackChanged(this.getLayerList(), this.activeLayerId);
            return true;
        }
        return false;
    }
    flipHoriz(id) {
        const layer = this.getLayerById(id);
        if (!layer) return;
        const temp = document.createElement('canvas');
        temp.width = layer.width; temp.height = layer.height;
        const tctx = temp.getContext('2d');
        tctx.translate(layer.width, 0);
        tctx.scale(-1, 1);
        tctx.drawImage(layer.canvas, 0, 0);
        layer.ctx.clearRect(0, 0, layer.width, layer.height);
        layer.ctx.drawImage(temp, 0, 0);
    }
    flipVert(id) {
        const layer = this.getLayerById(id);
        if (!layer) return;
        const temp = document.createElement('canvas');
        temp.width = layer.width; temp.height = layer.height;
        const tctx = temp.getContext('2d');
        tctx.translate(0, layer.height);
        tctx.scale(1, -1);
        tctx.drawImage(layer.canvas, 0, 0);
        layer.ctx.clearRect(0, 0, layer.width, layer.height);
        layer.ctx.drawImage(temp, 0, 0);
    }
    getLayerById(id) { return this.layers.find(l => l.id === id) || null; }
    getActiveLayer() { return this.getLayerById(this.activeLayerId); }
    setActiveLayer(id) {
        this.activeLayerId = id;
        this.onStackChanged(this.getLayerList(), this.activeLayerId);
    }
    setLayerVisibility(id, v) {
        const layer = this.getLayerById(id);
        if (layer) {
            layer.visible = v;
            layer.canvas.style.display = v ? 'block' : 'none';
            this.onStackChanged(this.getLayerList(), this.activeLayerId);
        }
    }
    setLayerOpacity(id, op) {
        const layer = this.getLayerById(id);
        if (layer) {
            layer.opacity = op;
            layer.canvas.style.opacity = op;
            this.onStackChanged(this.getLayerList(), this.activeLayerId);
        }
    }
    setLayerBlendMode(id, mode) {
        const layer = this.getLayerById(id);
        if (layer) {
            layer.blendMode = mode;
            layer.canvas.style.mixBlendMode = mode;
            this.onStackChanged(this.getLayerList(), this.activeLayerId);
        }
    }
    syncDOM() {
        this.container.innerHTML = '';
        this.layers.forEach((l, idx) => {
            l.canvas.style.display = l.visible ? 'block' : 'none';
            l.canvas.style.opacity = l.opacity;
            l.canvas.style.mixBlendMode = l.blendMode || 'normal';
            l.canvas.style.zIndex = String(idx + 1);
            this.container.appendChild(l.canvas);
        });
    }
    getLayerList() {
        return this.layers.map(l => ({
            id: l.id,
            name: `${l.name} (${l.width}x${l.height})`,
            visible: l.visible,
            opacity: l.opacity,
            blendMode: l.blendMode || 'normal'
        }));
    }
}

class SelectionManager {
    constructor({ selectionCanvas, onSelectionChange = () => {} } = {}) {
        this.canvas = selectionCanvas;
        this.ctx = this.canvas.getContext('2d');
        this.onSelectionChange = onSelectionChange;
        this.polygon = [];
        this.hasSelection = false;
        this.maskCanvas = document.createElement('canvas');
        this.maskCtx = this.maskCanvas.getContext('2d');
        this.antsOffset = 0;
        this.animateAnts();
    }
    animateAnts() {
        if (this.hasSelection) {
            this.antsOffset = (this.antsOffset + 0.35) % 10;
            this.drawMarchingAnts();
        }
        requestAnimationFrame(() => this.animateAnts());
    }
    setSize(w, h) {
        this.canvas.width = w; this.canvas.height = h;
        this.canvas.style.width = w + 'px'; this.canvas.style.height = h + 'px';
        this.maskCanvas.width = w; this.maskCanvas.height = h;
        this.updateMask();
        this.drawMarchingAnts();
    }
    setRect(x, y, w, h) {
        this.polygon = [{ x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h }];
        this.hasSelection = (w > 1 && h > 1);
        this.updateMask();
        this.drawMarchingAnts();
        this.onSelectionChange(this.hasSelection);
    }
    setLasso(points) {
        this.polygon = points.map(p => ({ x: p.x, y: p.y }));
        this.hasSelection = points.length > 2;
        this.updateMask();
        this.drawMarchingAnts();
        this.onSelectionChange(this.hasSelection);
    }
    updateMask() {
        this.maskCtx.clearRect(0, 0, this.maskCanvas.width, this.maskCanvas.height);
        if (!this.hasSelection || this.polygon.length < 3) return;
        this.maskCtx.fillStyle = '#ffffff';
        this.maskCtx.beginPath();
        this.maskCtx.moveTo(this.polygon[0].x, this.polygon[0].y);
        for (let i = 1; i < this.polygon.length; i++) this.maskCtx.lineTo(this.polygon[i].x, this.polygon[i].y);
        this.maskCtx.closePath();
        this.maskCtx.fill();
    }
    clear() {
        this.polygon = [];
        this.hasSelection = false;
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.maskCtx.clearRect(0, 0, this.maskCanvas.width, this.maskCanvas.height);
        this.onSelectionChange(false);
    }
    applyClipping(targetCtx) {
        if (!this.hasSelection || this.polygon.length < 3) return false;
        targetCtx.beginPath();
        targetCtx.moveTo(this.polygon[0].x, this.polygon[0].y);
        for (let i = 1; i < this.polygon.length; i++) targetCtx.lineTo(this.polygon[i].x, this.polygon[i].y);
        targetCtx.closePath();
        targetCtx.clip();
        return true;
    }
    drawMarchingAnts(previewPoints = null) {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        const pts = previewPoints || this.polygon;
        if (!pts || pts.length < 2) return;
        
        this.ctx.save();
        this.ctx.strokeStyle = '#ffffff';
        this.ctx.lineWidth = 1.5;
        this.ctx.setLineDash([5, 5]);
        this.ctx.lineDashOffset = -this.antsOffset;
        
        this.ctx.beginPath();
        this.ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) this.ctx.lineTo(pts[i].x, pts[i].y);
        if (!previewPoints && pts.length > 2) this.ctx.closePath();
        this.ctx.stroke();

        this.ctx.strokeStyle = '#0284c7';
        this.ctx.lineDashOffset = -this.antsOffset + 5;
        this.ctx.stroke();

        this.ctx.restore();
    }
    getBounds(layer = null) {
        if (!this.hasSelection || this.polygon.length === 0) {
            const w = layer ? layer.width : this.canvas.width;
            const h = layer ? layer.height : this.canvas.height;
            return { x: 0, y: 0, width: w, height: h };
        }
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        this.polygon.forEach(p => {
            if (p.x < minX) minX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.x > maxX) maxX = p.x;
            if (p.y > maxY) maxY = p.y;
        });
        const maxW = layer ? layer.width : this.canvas.width;
        const maxH = layer ? layer.height : this.canvas.height;
        return {
            x: Math.max(0, Math.floor(minX)),
            y: Math.max(0, Math.floor(minY)),
            width: Math.min(maxW - minX, Math.ceil(maxX - minX)),
            height: Math.min(maxH - minY, Math.ceil(maxY - minY))
        };
    }
}

class ClipboardManager {
    constructor() {
        this.buffer = null;
        this.bounds = null;
    }
    async copy(layer, selectionManager) {
        if (!layer) return null;
        const b = selectionManager.getBounds(layer);
        if (b.width <= 0 || b.height <= 0) return null;

        const clipCanvas = document.createElement('canvas');
        clipCanvas.width = b.width;
        clipCanvas.height = b.height;
        const cctx = clipCanvas.getContext('2d');

        if (selectionManager.hasSelection) {
            cctx.save();
            cctx.drawImage(selectionManager.maskCanvas, b.x, b.y, b.width, b.height, 0, 0, b.width, b.height);
            cctx.globalCompositeOperation = 'source-in';
            cctx.drawImage(layer.canvas, b.x, b.y, b.width, b.height, 0, 0, b.width, b.height);
            cctx.restore();
        } else {
            cctx.drawImage(layer.canvas, 0, 0);
        }

        this.buffer = clipCanvas;
        this.bounds = { ...b };

        try {
            clipCanvas.toBlob(async (blob) => {
                if (blob && navigator.clipboard && window.ClipboardItem) {
                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                }
            }, 'image/png');
        } catch (e) {}

        const hud = document.getElementById('hud');
        if (hud) hud.textContent = `✓ Trozo copiado: ${b.width}x${b.height} px`;

        return clipCanvas;
    }
    async cut(layer, selectionManager) {
        if (!layer) return null;
        const res = await this.copy(layer, selectionManager);
        const ctx = layer.ctx;
        ctx.save();
        if (selectionManager.hasSelection) {
            ctx.globalCompositeOperation = 'destination-out';
            selectionManager.applyClipping(ctx);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, layer.width, layer.height);
        } else {
            ctx.clearRect(0, 0, layer.width, layer.height);
        }
        ctx.restore();
        return res;
    }
}
class ToolMathCanvas{
     getImageDataFromCanvas(canvas) {
        const ctx = canvas.getContext('2d');
        return ctx.getImageData(0, 0, canvas.width, canvas.height);
    }
    radialPixelesGio(imageData, f) {
        const data = imageData.data;
        const width = imageData.width;
        const height = imageData.height;
        const centerX = width / 2;
        const centerY = height / 2;
        const maxDistance = Math.sqrt(centerX * centerX + centerY * centerY);
        const rgba = { r: 0, g: 0, b: 0 ,a:1};     
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const index = (y * width + x) * 4;
                const distance = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
                let gradientValue = 1 - (distance / maxDistance);
                gradientValue = Math.max(0, Math.min(1, gradientValue));
                rgba.r = data[index] / 255;
                rgba.g = data[index + 1] / 255;
                rgba.b = data[index + 2] / 255;
                if (f) f(rgba, gradientValue);
                data[index] = rgba.r * 255;
                data[index + 1] = rgba.g * 255;
                data[index + 2] = rgba.b * 255;
                data[index + 3] = rgba.a*255;
            }
        }
        return imageData;
    }

    putImageDataOnCanvas(canvas, imageData) {
        canvas.width = imageData.width;
        canvas.height = imageData.height;
        const ctx = canvas.getContext('2d');
        ctx.putImageData(imageData, 0, 0);
    }
    limite = (v,a=0,b=1) => {
    if(v<a){return a; }
    if(v>b){return b; }
    return v;
    } 
    operacionMatematica(rgba, val, operacion) {
        const lim = (v) => v < 0 ? 0 : (v > 1 ? 1 : v);
        if (operacion === 'multiplicar' || operacion === '*') {
            rgba.r = lim(rgba.r * val);
            rgba.g = lim(rgba.g * val);
            rgba.b = lim(rgba.b * val);
            return rgba;
        }
        if (operacion === '+') {
            rgba.r = lim(rgba.r + val);
            rgba.g = lim(rgba.g + val);
            rgba.b = lim(rgba.b + val);
            return rgba;
        }
        if (operacion === 'potencia' || operacion === 'pow') {
            rgba.r = lim(Math.pow(rgba.r, val));
            rgba.g = lim(Math.pow(rgba.g, val));
            rgba.b = lim(Math.pow(rgba.b, val));
            return rgba;
        }
        return rgba;
    }

    saturationGio(tex_color, ec5) {
        const lim = (x) => x > 1.0 ? 1.0 : (x < 0.0 ? 0.0 : x);
        const maxx = Math.max(tex_color.r, tex_color.g, tex_color.b);
        if (tex_color.r !== maxx) tex_color.r += (maxx - tex_color.r) * ec5;
        if (tex_color.g !== maxx) tex_color.g += (maxx - tex_color.g) * ec5;
        if (tex_color.b !== maxx) tex_color.b += (maxx - tex_color.b) * ec5;
        tex_color.r = lim(tex_color.r);
        tex_color.g = lim(tex_color.g);
        tex_color.b = lim(tex_color.b);
        return tex_color;
    }

    mixerHtmlPasaColor(rgbax, rgba2 = { r: 0.5, g: 0.45, b: 0.36 }, porcent, bool = false) {
        const maxx0 = Math.max(rgbax.r, rgbax.g, rgbax.b);
        const clmd = 1.0 - porcent;
        rgbax.r = rgbax.r * clmd + rgba2.r * porcent;
        rgbax.g = rgbax.g * clmd + rgba2.g * porcent;
        rgbax.b = rgbax.b * clmd + rgba2.b * porcent;
        if (bool) {
            const max2 = Math.max(rgbax.r, rgbax.g, rgbax.b);
            this.operacionMatematica(rgbax, maxx0 / (max2 + 0.00001), '*');
        }
        return rgbax;
    }

    colorDivide(color1) {
        var maxx0 = Math.max(color1.r, color1.g, color1.b) + 0.00001;
        var minx = Math.min(color1.r, color1.g, color1.b);
        return minx / (maxx0 + 0.0000001);
    }

      return  Math.max(rgba.r, rgba.g, rgba.b);
    }
    minRgba(rgba){
      return  Math.min(rgba.r, rgba.g, rgba.b);
    }
 
}

    this.currentTool = tool;
    if (this.cad) this.cad.active = (tool === 'cad');
    const hud = document.getElementById('hud');
    if (hud) hud.textContent = `Herramienta Activa: ${tool.toUpperCase()}`;
}
    cancelSelection() {
        this.lassoPoints = [];
        this.polyPoints = [];
        this.isDrawing = false;
        if (this.preview && this.pctx) this.pctx.clearRect(0, 0, this.preview.width, this.preview.height);
        if (this.selection) this.selection.clear();
    }
   pointerDown(x, y, e) {
    if (this.currentTool === 'cad' && this.cad) {
        this.cad.handlePointerDown(x, y, e);
        return;
    }

    if (e.button === 2) return;

    if (this.currentTool === 'poly') {
        const now = performance.now();
        const isDoubleClick = (now - this.lastPolyClickTime < 320) || e.detail === 2;
        this.lastPolyClickTime = now;

        if (this.polyPoints.length >= 3) {
            const d = Math.hypot(x - this.polyPoints[0].x, y - this.polyPoints[0].y);
            if (d < 15 || isDoubleClick) {
                this.finishPolySelection();
                return;
            }
        }
        this.polyPoints.push({ x, y });
        this.selection.drawMarchingAnts(this.polyPoints);
        return;
    }

    if (this.currentTool === 'fill') {
        const layer = this.layers.getActiveLayer();
        if (layer) { 
            this.onStrokeStart(layer); 
            const filled = FloodFillTool.fill(layer, x, y, this.brush.mainColor, this.brush.opacity, 15, this.selection);
            if (filled) this.onStrokeFinished(layer);
        }
        return;
    }

    if (e.altKey && this.currentTool === 'clone') {
        this.fijarOrigenClonacion(x, y);
        return;
    }

    if (e.button !== 0) return;
    const layer = this.layers.getActiveLayer();
    if (!layer) return;

    if (['brush', 'eraser', 'clone', 'stamp', 'move'].includes(this.currentTool)) {
        this.onStrokeStart(layer);
    }

    this.isDrawing = true;
    this.startX = x;
    this.startY = y;
    this.lastX = x;
    this.lastY = y;
    this.distAccum = 0;

    if (this.currentTool === 'move') {
        this.moveSnapshotCanvas = document.createElement('canvas');
        this.moveSnapshotCanvas.width = layer.width;
        this.moveSnapshotCanvas.height = layer.height;
        this.moveSnapshotCanvas.getContext('2d').drawImage(layer.canvas, 0, 0);
        return;
    }

    if (this.currentTool === 'eyedropper') {
        this.sampleColor(x, y);
        this.isDrawing = false;
        return;
    }

    if (this.currentTool === 'lasso') {
        this.lassoPoints = [{ x, y }];
        return;
    }

    if (this.currentTool === 'rectSelect') {
        this.selection.clear();
        return;
    }

    if (['brush', 'eraser', 'clone', 'stamp'].includes(this.currentTool)) {
        layer.ctx.save();
        this.selection.applyClipping(layer.ctx);
        layer.ctx.globalCompositeOperation = (this.currentTool === 'eraser') ? 'destination-out' : 'source-over';
        layer.ctx.globalAlpha = this.brush.opacity * (this.brush.force / 100);
        this.drawInterpolatedStampDirect(layer.ctx, x, y);
        layer.ctx.restore();
    }
}
   
    fijarOrigenClonacion(x, y) {
        const active = this.layers.getActiveLayer();
        if (active) {
            this.cloneSource = { x, y };
            this.cloneBuffer = document.createElement('canvas');
            this.cloneBuffer.width = active.width;
            this.cloneBuffer.height = active.height;
            this.cloneBuffer.getContext('2d').drawImage(active.canvas, 0, 0);
            const hud = document.getElementById('hud');
            if (hud) hud.textContent = `✓ Origen de clonación fijado en (${Math.round(x)}, ${Math.round(y)})`;
        }
    }
    pointerMove(x, y) {
        if (this.currentTool === 'cad') {
            if (this.cad) this.cad.handlePointerMove(x, y);
            return;
        }

        if (this.currentTool === 'poly') {
            if (this.polyPoints.length > 0) {
                this.selection.drawMarchingAnts(this.polyPoints.concat([{ x, y }]));
            }
            return;
        }

        if (!this.isDrawing) return;
        const layer = this.layers.getActiveLayer();
        if (!layer) return;

        if (['brush', 'eraser', 'clone', 'stamp'].includes(this.currentTool)) {
            layer.ctx.save();
            this.selection.applyClipping(layer.ctx);
            layer.ctx.globalCompositeOperation = (this.currentTool === 'eraser') ? 'destination-out' : 'source-over';
            layer.ctx.globalAlpha = this.brush.opacity * (this.brush.force / 100);
            this.drawContinuousStroke(layer.ctx, this.lastX, this.lastY, x, y);
            layer.ctx.restore();
        } else if (this.currentTool === 'move') {
            if (this.moveSnapshotCanvas) {
                layer.ctx.clearRect(0, 0, layer.width, layer.height);
                layer.ctx.drawImage(this.moveSnapshotCanvas, Math.round(x - this.startX), Math.round(y - this.startY));
            }
        } else if (this.currentTool === 'rectSelect') {
            this.selection.setRect(
                Math.min(this.startX, x), Math.min(this.startY, y),
                Math.abs(x - this.startX), Math.abs(y - this.startY)
            );
        } else if (this.currentTool === 'lasso') {
            this.lassoPoints.push({ x, y });
            this.selection.setLasso(this.lassoPoints);
        }
        this.lastX = x;
        this.lastY = y;
    }

    pointerUp(x, y) {
    if (this.currentTool === 'cad' && this.cad) {
        this.cad.handlePointerUp();
        return;
    }
    if (this.currentTool === 'poly') return;

    if (!this.isDrawing) return;
    this.isDrawing = false;
    this.distAccum = 0;
    this.moveSnapshotCanvas = null;

    const layer = this.layers.getActiveLayer();
    if (this.currentTool === 'rectSelect') {
        if (Math.abs(x - this.startX) <= 2 && Math.abs(y - this.startY) <= 2) {
            this.selection.clear();
        }
        return;
    }

    if (this.currentTool === 'lasso') {
        return;
    }

    if (layer) this.onStrokeFinished(layer);
}


    finishPolySelection() {
        if (this.polyPoints.length >= 3) {
            const puntos = this.polyPoints.map(p => ({ x: p.x, y: p.y }));
            this.polyPoints = [];
            this.selection.setLasso(puntos);
        } else {
            this.polyPoints = [];
            this.selection.clear();
        }
    }
    drawContinuousStroke(ctx, x1, y1, x2, y2) {
        const dist = Math.hypot(x2 - x1, y2 - y1);
        const step = Math.max(1, this.brush.size * (Math.max(1, this.brush.spacing) / 100));

        if (dist === 0) {
            if (this.distAccum >= step) {
                this.drawInterpolatedStampDirect(ctx, x2, y2);
                this.distAccum = 0;
            }
            return;
        }

        this.distAccum += dist;
        if (this.distAccum >= step) {
            const n = Math.floor(this.distAccum / step);
            for (let i = 1; i <= n; i++) {
                const t = Math.min(1.0, (step * i) / dist);
                this.drawInterpolatedStampDirect(ctx, x1 + (x2 - x1) * t, y1 + (y2 - y1) * t);
            }
            this.distAccum %= step;
        }
    }
    
    drawInterpolatedStampDirectmal(ctx, x, y) {
    const dims = this.brush.getStampDimensions();

    if (this.currentTool === 'clone') {
        if (!this.cloneSource || !this.cloneBuffer) return;
        const sx = this.cloneSource.x + (x - this.startX);
        const sy = this.cloneSource.y + (y - this.startY);
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, dims.w / 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(this.cloneBuffer, sx - dims.w / 2, sy - dims.h / 2, dims.w, dims.h, x - dims.w / 2, y - dims.h / 2, dims.w, dims.h);
        ctx.restore();
        return;
    }

    const tipCanvas = this.brush.getTipCanvas();
    const rot = this.brush.randomRotation 
        ? Math.random() * Math.PI * 2 
        : (this.brush.angle * Math.PI) / 180;

    const stampW = Math.round(dims.w);
    const stampH = Math.round(dims.h);

    const stampCanvas = document.createElement('canvas');
    stampCanvas.width = stampW;
    stampCanvas.height = stampH;
    const sctx = stampCanvas.getContext('2d');

    sctx.translate(stampW / 2, stampH / 2);
    if (rot !== 0) sctx.rotate(rot);
    sctx.drawImage(tipCanvas, -stampW / 2, -stampH / 2, stampW, stampH);

    const stampImgData = sctx.getImageData(0, 0, stampW, stampH);
    const stampData = stampImgData.data;

    const dstX = Math.round(x - stampW / 2);
    const dstY = Math.round(y - stampH / 2);
    const layerW = ctx.canvas.width;
    const layerH = ctx.canvas.height;

    const clipX0 = Math.max(0, dstX);
    const clipY0 = Math.max(0, dstY);
    const clipX1 = Math.min(layerW, dstX + stampW);
    const clipY1 = Math.min(layerH, dstY + stampH);

    const regionW = clipX1 - clipX0;
    const regionH = clipY1 - clipY0;

    if (regionW <= 0 || regionH <= 0) return;

    const layerImgData = ctx.getImageData(clipX0, clipY0, regionW, regionH);
    const layerData = layerImgData.data;

    const multFactor = (this.brush.multiplyFactor !== undefined) ? this.brush.multiplyFactor : 1.0;
    const globalAlpha = this.brush.opacity * (this.brush.force / 100);

    for (let ry = 0; ry < regionH; ry++) {
        for (let rx = 0; rx < regionW; rx++) {
            const lIdx = (ry * regionW + rx) * 4;
            const sx = (clipX0 - dstX) + rx;
            const sy = (clipY0 - dstY) + ry;
            const sIdx = (sy * stampW + sx) * 4;

            const sAlpha = (stampData[sIdx + 3] / 255) * globalAlpha;
            if (sAlpha <= 0) continue;

            const lR = layerData[lIdx];
            const lG = layerData[lIdx + 1];
            const lB = layerData[lIdx + 2];
            const lA = layerData[lIdx + 3] / 255;

            const bR = stampData[sIdx];
            const bG = stampData[sIdx + 1];
            const bB = stampData[sIdx + 2];

            const pureMultR = (lR * bR) / 255;
            const pureMultG = (lG * bG) / 255;
            const pureMultB = (lB * bB) / 255;

/*             const targetR = lR * (1.0 - multFactor) + pureMultR * multFactor;
            const targetG = lG * (1.0 - multFactor) + pureMultG * multFactor;
            const targetB = lB * (1.0 - multFactor) + pureMultB * multFactor;
 */
            if (lA <= 0.01) {
                layerData[lIdx] = bR;
                layerData[lIdx + 1] = bG;
                layerData[lIdx + 2] = bB;
                layerData[lIdx + 3] = Math.round(sAlpha * 255);
            } else {
                layerData[lIdx] = Math.round(lR * (1.0 - sAlpha) + targetR * sAlpha);
                layerData[lIdx + 1] = Math.round(lG * (1.0 - sAlpha) + targetG * sAlpha);
                layerData[lIdx + 2] = Math.round(lB * (1.0 - sAlpha) + targetB * sAlpha);
                layerData[lIdx + 3] = Math.round(Math.min(1.0, lA + sAlpha * (1.0 - lA)) * 255);
            }
        }
    }

    ctx.putImageData(layerImgData, clipX0, clipY0);
}
drawInterpolatedStampDirectCombiando(ctx, x, y) {
    const dims = this.brush.getStampDimensions();
    
    
    const w = Math.round(dims.w);
    const h = Math.round(dims.h);
    const radio = w / 2;

 
    const x0 = Math.round(x - radio);
    const y0 = Math.round(y - radio);

 
    const tipCanvas = this.brush.getTipCanvas();  
    
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = w;
    tempCanvas.height = h;
    const tctx = tempCanvas.getContext('2d');

    const rot = this.brush.randomRotation 
        ? Math.random() * Math.PI * 2 
        : (this.brush.angle * Math.PI) / 180;

    
    tctx.save();
    tctx.translate(w / 2, h / 2);
    if (rot !== 0) tctx.rotate(rot);
    tctx.drawImage(tipCanvas, -w / 2, -h / 2, w, h);
    tctx.restore();

   
    const stampImgData = tctx.getImageData(0, 0, w, h);
    const stampImgData2 = tctx.getImageData(0, 0, w, h);

 
    const layerImgData = ctx.getImageData(x0, y0, w, h);

 
    var resultadoImgData = this.miCombinacionPersonalizada(layerImgData, stampImgData, w, h,stampImgData2);

 
    tctx.putImageData(resultadoImgData, 0, 0);

    ctx.save();
    
    ctx.clearRect(x0, y0, w, h);
 
    ctx.drawImage(tempCanvas, x0, y0);
    ctx.restore();
}
    drawInterpolatedStampDirect (ctx, x, y) {
    const dims = this.brush.getStampDimensions();

    if (this.currentTool === 'clone') {
        if (!this.cloneSource || !this.cloneBuffer) return;
        const sx = this.cloneSource.x + (x - this.startX);
        const sy = this.cloneSource.y + (y - this.startY);
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, dims.w / 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(this.cloneBuffer, sx - dims.w / 2, sy - dims.h / 2, dims.w, dims.h, x - dims.w / 2, y - dims.h / 2, dims.w, dims.h);
        ctx.restore();
        return;
    }

    const tipCanvas = this.brush.getTipCanvas();
    const rot = this.brush.randomRotation 
        ? Math.random() * Math.PI * 2 
        : (this.brush.angle * Math.PI) / 180;

    ctx.save();
    ctx.translate(x, y);
    if (rot !== 0) ctx.rotate(rot);
    ctx.drawImage(tipCanvas, -dims.w / 2, -dims.h / 2, dims.w, dims.h);
    ctx.restore();
}
    sampleColor(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        let sampled = null;
        
        for (let i = this.layers.layers.length - 1; i >= 0; i--) {
            const l = this.layers.layers[i];
            if (!l.visible || ix < 0 || ix >= l.width || iy < 0 || iy >= l.height) continue;
            const px = l.ctx.getImageData(ix, iy, 1, 1).data;
            if (px[3] > 10) {
                sampled = "#" + ((1 << 24) + (px[0] << 16) + (px[1] << 8) + px[2]).toString(16).slice(1);
                break;
            }
        }
        if (!sampled) sampled = "#000000";
        this.onColorSampled(sampled);
        const hud = document.getElementById('hud');
        if (hud) hud.textContent = `Color muestreado: ${sampled.toUpperCase()}`;
    }
}

class ProjectExporter {
    static exportImage(layerStack, format = 'png') {
        let maxWidth = 1;
        let maxHeight = 1;
        layerStack.layers.forEach(l => {
            if (l.width > maxWidth) maxWidth = l.width;
            if (l.height > maxHeight) maxHeight = l.height;
        });

        const out = document.createElement('canvas');
        out.width = maxWidth;
        out.height = maxHeight;
        const octx = out.getContext('2d');

        if (format === 'jpg' || format === 'jpeg') {
            octx.fillStyle = '#ffffff';
            octx.fillRect(0, 0, maxWidth, maxHeight);
        }

        layerStack.layers.forEach(l => {
            if (l.visible) {
                octx.save();
                octx.globalAlpha = l.opacity;
                octx.globalCompositeOperation = (l.blendMode === 'normal') ? 'source-over' : (l.blendMode || 'source-over');
                octx.drawImage(l.canvas, 0, 0);
                octx.restore();
            }
        });

        const mime = (format === 'jpg' || format === 'jpeg') ? 'image/jpeg' : 'image/png';
        const a = document.createElement('a');
        a.download = `proyecto_${Date.now()}.${format}`;
        a.href = out.toDataURL(mime, 0.95);
        a.click();
    }
}
