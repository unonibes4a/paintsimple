        rTop.append(new UI.Button({ text: 'Double', onClick: () => { this.layers.duplicateLayer(this.layers.activeLayerId); this.ajustarCanvasACapaActiva(); } }));
         rTop.append(new UI.Button({
    text: 'Borrar',
    variant: 'danger',
    onClick: () => {
        // No permitir borrar si solo queda una capa
        if (this.layers.layers.length <= 1) return;

        const capaBorrar = this.layers.getActiveLayer();
        if (!capaBorrar) return;

        // 1. Guardamos la posición, ID y datos de la capa antes de borrarla
        const indiceOriginal = this.layers.layers.findIndex(l => l.id === capaBorrar.id);
        const copiaCanvas = document.createElement('canvas');
        copiaCanvas.width = capaBorrar.width;
        copiaCanvas.height = capaBorrar.height;
        copiaCanvas.getContext('2d').drawImage(capaBorrar.canvas, 0, 0);

        // 2. Registramos la acción en el historial
        this.history.push({
            undo: () => {
                // Al pulsar Ctrl+Z: restaura la capa en su índice original
                this.layers.layers.splice(indiceOriginal, 0, capaBorrar);
                capaBorrar.ctx.clearRect(0, 0, capaBorrar.width, capaBorrar.height);
                capaBorrar.ctx.drawImage(copiaCanvas, 0, 0);
                this.layers.setActiveLayer(capaBorrar.id);
                this.layers.syncDOM();
                this.ajustarCanvasACapaActiva();
            },
            redo: () => {
                // Al pulsar Ctrl+Y: vuelve a eliminarla
                this.layers.deleteLayer(capaBorrar.id);
                this.ajustarCanvasACapaActiva();
            }
        });

        // 3. Eliminamos la capa
        this.layers.deleteLayer(capaBorrar.id);
        this.ajustarCanvasACapaActiva();
    }
}));
        const rMove = itemLayers.addRow(4);
        rMove.append(new UI.Button({ text: '▲', onClick: () => this.layers.moveUp(this.layers.activeLayerId) }));
        rMove.append(new UI.Button({ text: '▼', onClick: () => this.layers.moveDown(this.layers.activeLayerId) }));
        rMove.append(new UI.Button({ text: 'Flip H', onClick: () => this.layers.flipHoriz(this.layers.activeLayerId) }));
        rMove.append(new UI.Button({ text: 'Flip V', onClick: () => this.layers.flipVert(this.layers.activeLayerId) }));

        this.reorderList = new UI.ReorderList({
            items: this.layers.getLayerList(),
            onSelect: (item) => {
                this.layers.setActiveLayer(item.id);
                this.ajustarCanvasACapaActiva();
            },
            onVisibilityChange: (item, idx, v) => this.layers.setLayerVisibility(item.id, v),
            onReorder: (newList) => this.layers.reorder(newList)
        });
        itemLayers.append(this.reorderList);

        itemLayers.append(new UI.ConfigurableSlider({
            label: 'Opacidad de Capa', min: 0, max: 1, step: 0.01, value: 1.0,
            onChange: (v) => this.layers.setLayerOpacity(this.layers.activeLayerId, v)
        }));

        const itemBrush = accordion.addItem({ title: 'Brush & Stroke Settings', open: false });

        this.brushPreviewCanvas = document.createElement('canvas');
        this.brushPreviewCanvas.className = 'preview-box';
        this.brushPreviewCanvas.width = 44;
        this.brushPreviewCanvas.height = 44;

        const fileInp = document.createElement('input');
        fileInp.type = 'file';
        fileInp.accept = 'image/*';
        fileInp.style.display = 'none';
        fileInp.addEventListener('change', (e) => {
            const f = e.target.files[0];
            if (f) {
                const img = new Image();
                img.onload = () => {
                    this.brush.set('stampImage', img);
                    this.cad.useBrushStamp = true;
                    if (this.toggleCadBrush) this.toggleCadBrush.setValue(true);
                    this.updateBrushPreview();
                    if (this.cad) this.cad.render();
                };
                img.src = URL.createObjectURL(f);
            }
        });

        const rLoadStamp = itemBrush.addRow(4);
        rLoadStamp.append(new UI.Button({ text: 'Load Texture/Pattern (Img)', variant: 'primary', onClick: () => fileInp.click() }));
        rLoadStamp.append(this.brushPreviewCanvas);

        itemBrush.append(new UI.ConfigurableSlider({
            label: 'Tamaño (Size)', min: 1, max: 800, value: this.brush.size,
            onChange: (v) => { this.brush.set('size', v); }
        }));
        itemBrush.append(new UI.ConfigurableSlider({
            label: 'Proporción de Aspecto', min: -1.0, max: 1.0, step: 0.01, value: this.brush.aspectRatio,
            onChange: (v) => { this.brush.set('aspectRatio', v); }
        }));
        itemBrush.append(new UI.ConfigurableSlider({
            label: 'Ángulo', min: 0, max: 360, step: 1, value: this.brush.angle,
            onChange: (v) => { this.brush.set('angle', v); }
        }));
        itemBrush.append(new UI.Toggle({
            label: 'Giro Dinámico / Aleatorio', value: this.brush.randomRotation,
            onChange: (v) => { this.brush.set('randomRotation', v); }
        }));
        itemBrush.append(new UI.ConfigurableSlider({
            label: 'Espaciado (%)', min: 1, max: 200, step: 1, value: this.brush.spacing,
            onChange: (v) => { this.brush.set('spacing', v); }
        }));
        itemBrush.append(new UI.ConfigurableSlider({
            label: 'Dureza (Hardness)', min: 0, max: 1, step: 0.01, value: this.brush.hardness,
            onChange: (v) => { this.brush.set('hardness', v); }
        }));
        
        itemBrush.append(new UI.ConfigurableSlider({
            label: 'Opacidad', min: 0.01, max: 1, step: 0.01, value: this.brush.opacity,
            onChange: (v) => { this.brush.set('opacity', v); }
        }));
        itemBrush.append(new UI.ConfigurableSlider({
            label: 'Forzar / Flujo (%)', min: 1, max: 100, step: 1, value: this.brush.force,
            onChange: (v) => { this.brush.set('force', v); }
        }));

        const itemClip = accordion.addItem({ title: 'Portapapeles & Selección', open: false });
        const rClip = itemClip.addRow(4);
        rClip.append(new UI.Button({ 
            text: 'Copiar (Ctrl+C)', variant: 'primary', 
            onClick: async () => { await this.clipboard.copy(this.layers.getActiveLayer(), this.selection); }
        }));
        rClip.append(new UI.Button({ 
            text: 'Pegar (Ctrl+V)', variant: 'primary', 
            onClick: () => { if (this.clipboard.buffer) this.pegarComoNuevaCapa(this.clipboard.buffer, 'Selección Pegada'); }
        }));
        rClip.append(new UI.Button({ text: 'Clear Selection', onClick: () => this.selection.clear() }));

        const itemProj = accordion.addItem({ title: 'Export Image', open: false });
        const rExp = itemProj.addRow(4);
        rExp.append(new UI.Button({ text: 'PNG', variant: 'primary', onClick: () => ProjectExporter.exportImage(this.layers, 'png') }));
        rExp.append(new UI.Button({ text: 'JPG', onClick: () => ProjectExporter.exportImage(this.layers, 'jpg') }));

        panelRight.append(accordion);
        this.rightContainer.addPanel(panelRight);

        requestAnimationFrame(() => this.updateBrushPreview());
    }

    bindEvents() {
        let isSpacePressed = false;

        window.addEventListener('paste', async (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
            let pastedImage = false;

            if (items) {
                for (let item of items) {
                    if (item.type.indexOf('image') !== -1) {
                        const blob = item.getAsFile();
                        if (blob) {
                            pastedImage = true;
                            e.preventDefault();
                            const img = new Image();
                            img.onload = () => this.pegarComoNuevaCapa(img, 'Pasted Image');
                            img.src = URL.createObjectURL(blob);
                            return;
                        }
                    }
                }
            }
            if (!pastedImage && this.clipboard.buffer) {
                e.preventDefault();
                this.pegarComoNuevaCapa(this.clipboard.buffer, 'Paste Selection');
            }
        });

     

        window.addEventListener('keydown', async (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.code === 'Space' && !isSpacePressed) {
                isSpacePressed = true;
                this.stage.style.cursor = 'grab';
            }
            if (e.ctrlKey && (e.code === 'KeyC' || e.key === 'c' || e.key === 'C')) {
                e.preventDefault();
                await this.clipboard.copy(this.layers.getActiveLayer(), this.selection);
            }
            if (e.ctrlKey && (e.code === 'KeyX' || e.key === 'x' || e.key === 'X')) {
                e.preventDefault();
                await this.clipboard.cut(this.layers.getActiveLayer(), this.selection);
            }
            if (e.ctrlKey && e.code === 'KeyZ') {
                if (e.shiftKey) this.history.redo();
                else this.history.undo();
                e.preventDefault();
            } else if (e.ctrlKey && e.code === 'KeyY') {
                this.history.redo();
                e.preventDefault();
            }
            if (e.key === 'Escape') {
        e.preventDefault();
        this.tools.cancelSelection();
        if (this.cad) {
            this.cad.finishCurrent();
            this.cad.selected = null;
            this.cad.selectedPointIndex = -1;
            this.cad.render();
        }
        const selectionTools = ['rectSelect', 'lasso', 'poly'];
        if (selectionTools.includes(this.tools.currentTool)) {
            this.setActiveTool('brush');
        }
    }

            if (e.key === 'q' || e.key === 'Q') {
                e.preventDefault();
                this.ajustarCanvasACapaActiva();
            }
            if (e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                this.adaptarCapaActivaAlCanvas();
            }
            if (e.key === 'g' || e.key === 'G') this.setActiveTool('fill');

            if (e.key === 'b' || e.key === 'B') this.setActiveTool('brush');
            if (e.key === 'e' || e.key === 'E') this.setActiveTool('eraser');
            if (e.key === 'c' && !e.ctrlKey) this.setActiveTool('clone');
            if (e.key === 's' || e.key === 'S') this.setActiveTool('stamp');
            if (e.key === 'm' || e.key === 'M') this.setActiveTool('move');
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                isSpacePressed = false;
                this.stage.style.cursor = 'crosshair';
                this.zoom.endPan();
            }
        });

        this.stage.addEventListener('pointerdown', (e) => {
            if (isSpacePressed || e.button === 1) {
                this.zoom.startPan(e.clientX, e.clientY);
                return;
            }
            const coords = this.zoom.screenToWorld(e.clientX, e.clientY);
            this.tools.pointerDown(coords.x, coords.y, e);
        });

        window.addEventListener('pointermove', (e) => {
            if (this.zoom.isPanning) {
                this.zoom.pan(e.clientX, e.clientY);
                return;
            }
            const coords = this.zoom.screenToWorld(e.clientX, e.clientY);
            this.tools.pointerMove(coords.x, coords.y);
        });

        window.addEventListener('pointerup', (e) => {
            if (this.zoom.isPanning) {
                this.zoom.endPan();
                return;
            }
            const coords = this.zoom.screenToWorld(e.clientX, e.clientY);
            this.tools.pointerUp(coords.x, coords.y);
        });

        this.stage.addEventListener('contextmenu', (e) => e.preventDefault());
    }
}

window.addEventListener('DOMContentLoaded', () => {
    window.AppInstance = new ApplicationAdapter();
  
});
</script>
</body>
