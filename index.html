  enlazarCanvases() {
    const ev2D = e => {
      const r = this.c2D.getBoundingClientRect();
      const x = Math.max(0, Math.min(this.tam2D, e.clientX - r.left));
      const y = Math.max(0, Math.min(this.tam2D, e.clientY - r.top));
      this.s = x / this.tam2D;
      this.v = 1 - (y / this.tam2D);
      this.hsvARgb();
      this.actualizarUI();
    };
    this.c2D.addEventListener('mousedown', e => { this.arrastrando2D = true; ev2D(e); });
    const evHue = e => {
      const r = this.cHue.getBoundingClientRect();
      const y = Math.max(0, Math.min(this.altoHue, e.clientY - r.top));
      this.h = (y / this.altoHue) * 360;
      this.hsvARgb();
      this.actualizarUI();
    };
    this.cHue.addEventListener('mousedown', e => { this.arrastrandoHue = true; evHue(e); });
    window.addEventListener('mousemove', e => {
      if (this.arrastrando2D) ev2D(e);
      if (this.arrastrandoHue) evHue(e);
    });
    window.addEventListener('mouseup', () => { this.arrastrando2D = false; this.arrastrandoHue = false; });
  }
  dibujarHue() {
    const grad = this.ctxHue.createLinearGradient(0, 0, 0, this.altoHue);
    grad.addColorStop(0, '#ff0000');
    grad.addColorStop(0.17, '#ff00ff');
    grad.addColorStop(0.33, '#0000ff');
    grad.addColorStop(0.5, '#00ffff');
    grad.addColorStop(0.67, '#00ff00');
    grad.addColorStop(0.83, '#ffff00');
    grad.addColorStop(1, '#ff0000');
    this.ctxHue.fillStyle = grad;
    this.ctxHue.fillRect(0, 0, this.anchoHue, this.altoHue);
  }
  dibujar2D() {
    const rgbHue = this.hsvParaRgb(this.h, 1, 1);
    this.ctx2D.fillStyle = `rgb(${rgbHue.r},${rgbHue.g},${rgbHue.b})`;
    this.ctx2D.fillRect(0, 0, this.tam2D, this.tam2D);
    const gradW = this.ctx2D.createLinearGradient(0, 0, this.tam2D, 0);
    gradW.addColorStop(0, '#ffffff'); gradW.addColorStop(1, 'rgba(255,255,255,0)');
    this.ctx2D.fillStyle = gradW; this.ctx2D.fillRect(0, 0, this.tam2D, this.tam2D);
    const gradB = this.ctx2D.createLinearGradient(0, 0, 0, this.tam2D);
    gradB.addColorStop(0, 'rgba(0,0,0,0)'); gradB.addColorStop(1, '#000000');
    this.ctx2D.fillStyle = gradB; this.ctx2D.fillRect(0, 0, this.tam2D, this.tam2D);

    const px = this.s * this.tam2D;
    const py = (1 - this.v) * this.tam2D;
    this.ctx2D.strokeStyle = this.v > 0.5 ? '#000000' : '#ffffff';
    this.ctx2D.lineWidth = 1.5;
    this.ctx2D.beginPath();
    this.ctx2D.arc(px, py, 4, 0, Math.PI * 2);
    this.ctx2D.stroke();
  }
  actualizarUI() {
    this.dibujar2D();
    const hex = this.rgbAHex(this.r, this.g, this.b);
    this.onColorChange(hex);
    if (this.boxActual) this.boxActual.style.background = hex;
    if (this.inHex) this.inHex.setValue(hex);
    if (this.inR255) {
      this.inR255.setValue(String(this.r));
      this.inG255.setValue(String(this.g));
      this.inB255.setValue(String(this.b));
    }
    if (this.inRNorm) {
      this.inRNorm.setValue((this.r / 255).toFixed(3));
      this.inGNorm.setValue((this.g / 255).toFixed(3));
      this.inBNorm.setValue((this.b / 255).toFixed(3));
    }
  }
  analizarCapa() {
    const imgData = this.onAnalyzeLayer();
    if (!imgData) {
      this.lblInfoStats.textContent = 'No active layer';
      return;
    }
    const d = imgData.data;
    let maxVal = 0, minVal = 255, sumaSat = 0, totalVisibles = 0;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] === 0) continue;
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      if (mx > maxVal) maxVal = mx;
      if (mn < minVal) minVal = mn;
      sumaSat += mn / (mx + 0.00001);
      totalVisibles++;
    }
    if (totalVisibles === 0) minVal = 0;
    const satProm = totalVisibles ? (sumaSat / totalVisibles).toFixed(4) : '0';
    const satPixel = (Math.min(this.r, this.g, this.b) / (Math.max(this.r, this.g, this.b) + 0.00001)).toFixed(4);
    this.lblInfoStats.innerHTML = `Max gio: ${maxVal} (${(maxVal / 255).toFixed(3)}) | Min: ${minVal} (${(minVal / 255).toFixed(3)})<br>Div Sat Layer: ${satProm} | Current Color Sat: ${satPixel}`;
  }
  hexAColor(h) {
    const n = parseInt(h.replace('#', ''), 16);
    this.r = (n >> 16) & 255;
    this.g = (n >> 8) & 255;
    this.b = n & 255;
    this.rgbAHsv();
  }
  rgbAHex(r, g, b) {
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  rgbAHsv() {
    const r = this.r / 255, g = this.g / 255, b = this.b / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const d = max - min;
    this.v = max;
    this.s = max === 0 ? 0 : d / max;
    if (max === min) {
      this.h = 0;
    } else {
      switch (max) {
        case r: this.h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: this.h = (b - r) / d + 2; break;
        case b: this.h = (r - g) / d + 4; break;
      }
      this.h *= 60;
    }
  }
  hsvARgb() {
    const rgb = this.hsvParaRgb(this.h, this.s, this.v);
    this.r = rgb.r; this.g = rgb.g; this.b = rgb.b;
  }
  hsvParaRgb(h, s, v) {
    let r, g, b;
    const i = Math.floor((h / 60) % 6);
    const f = (h / 60) - i;
    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);
    switch (i) {
      case 0: r = v; g = t; b = p; break;
      case 1: r = q; g = v; b = p; break;
      case 2: r = p; g = v; b = t; break;
      case 3: r = p; g = q; b = v; break;
      case 4: r = t; g = p; b = v; break;
      case 5: r = v; g = p; b = q; break;
    }
    return { r: Math.round(r * 255), g: Math.round(g * 255), b: Math.round(b * 255) };
  }
}

class ModosMezcla {
  mezclar(capaSup, capaInf, modo = 'normal', op = 1) {
    if (!capaSup || !capaInf) return null;
    const w = capaInf.ancho, h = capaInf.alto;
    const xBase = capaInf.x, yBase = capaInf.y;
    const tSup = document.createElement('canvas');
    tSup.width = w; tSup.height = h;
    const cSup = tSup.getContext('2d');
    cSup.drawImage(capaSup.canvas, capaSup.x - xBase, capaSup.y - yBase);
    const tInf = document.createElement('canvas');
    tInf.width = w; tInf.height = h;
    const cInf = tInf.getContext('2d');
    cInf.drawImage(capaInf.canvas, 0, 0);
    const dS = cSup.getImageData(0, 0, w, h).data;
    const dI = cInf.getImageData(0, 0, w, h).data;
    const res = new Uint8ClampedArray(dS.length);
    for (let i = 0; i < dS.length; i += 4) {
      const r1 = dS[i] / 255, g1 = dS[i+1] / 255, b1 = dS[i+2] / 255, a1 = dS[i+3] / 255;
      const r2 = dI[i] / 255, g2 = dI[i+1] / 255, b2 = dI[i+2] / 255, a2 = dI[i+3] / 255;
      const aF = a1 * op + a2 * (1 - a1 * op);
      let r, g, b;
      switch (modo) {
        case 'multiply': r = r1 * r2; g = g1 * g2; b = b1 * b2; break;
        case 'screen': r = 1 - (1 - r1) * (1 - r2); g = 1 - (1 - g1) * (1 - g2); b = 1 - (1 - b1) * (1 - b2); break;
        case 'overlay':
          r = r2 < 0.5 ? 2 * r1 * r2 : 1 - 2 * (1 - r1) * (1 - r2);
          g = g2 < 0.5 ? 2 * g1 * g2 : 1 - 2 * (1 - g1) * (1 - g2);
          b = b2 < 0.5 ? 2 * b1 * b2 : 1 - 2 * (1 - b1) * (1 - b2);
          break;
        case 'difference': r = Math.abs(r1 - r2); g = Math.abs(g1 - g2); b = Math.abs(g1 - g2); break;
        default:
          r = r1 * a1 * op + r2 * a2 * (1 - a1 * op);
          g = g1 * a1 * op + g2 * a2 * (1 - a1 * op);
          b = b1 * a1 * op + b2 * a2 * (1 - a1 * op);
      }
      res[i] = Math.round(Math.max(0, Math.min(255, r * 255)));
      res[i+1] = Math.round(Math.max(0, Math.min(255, g * 255)));
      res[i+2] = Math.round(Math.max(0, Math.min(255, b * 255)));
      res[i+3] = Math.round(Math.max(0, Math.min(255, aF * 255)));
    }
    return { imageData: new ImageData(res, w, h), ancho: w, alto: h, x: xBase, y: yBase };
  }
}

class GestorStorageIDB {
  constructor(dbName = 'PaintJS_Pro_BD', storeName = 'sesiones') {
    this.dbName = dbName;
    this.storeName = storeName;
    this.db = null;
  }
  async abrir() {
    if (this.db) return this.db;
    return new Promise((res, rej) => {
      const pet = indexedDB.open(this.dbName, 1);
      pet.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains(this.storeName)) d.createObjectStore(this.storeName, { keyPath: 'id' });
      };
      pet.onsuccess = e => { this.db = e.target.result; res(this.db); };
      pet.onerror = e => rej(e.target.error);
    });
  }
  async guardar(item) {
    const db = await this.abrir();
    return new Promise((res, rej) => {
      const tx = db.transaction(this.storeName, 'readwrite');
      const st = tx.objectStore(this.storeName);
      const pet = st.put(item);
      pet.onsuccess = () => res(true);
      pet.onerror = e => rej(e.target.error);
    });
  }
  async obtenerTodas() {
    const db = await this.abrir();
    return new Promise((res, rej) => {
      const tx = db.transaction(this.storeName, 'readonly');
      const st = tx.objectStore(this.storeName);
      const pet = st.getAll();
      pet.onsuccess = () => {
        const out = {};
        (pet.result || []).forEach(s => out[s.id] = s);
        res(out);
      };
      pet.onerror = e => rej(e.target.error);
    });
  }
  async eliminar(id) {
    const db = await this.abrir();
    return new Promise((res, rej) => {
      const tx = db.transaction(this.storeName, 'readwrite');
      const st = tx.objectStore(this.storeName);
      const pet = st.delete(id);
      pet.onsuccess = () => res(true);
      pet.onerror = e => rej(e.target.error);
    });
  }
}

class Capa {
  constructor(ancho, alto, nombre) {
    this.id = 'capa_' + Math.random().toString(36).slice(2);
    this.nombre = nombre;
    this.ancho = ancho;
    this.alto = alto;
    this.x = 0;
    this.y = 0;
    this.opacidad = 1;
    this.visible = true;
    this.canvas = document.createElement('canvas');
    this.canvas.width = ancho;
    this.canvas.height = alto;
    this.ctx = this.canvas.getContext('2d');
  }
  redimensionar(nw, nh) {
    const t = document.createElement('canvas');
    t.width = nw; t.height = nh;
    const tc = t.getContext('2d');
    tc.drawImage(this.canvas, 0, 0, this.ancho, this.alto, 0, 0, nw, nh);
    this.canvas = t; this.ctx = tc;
    this.ancho = nw; this.alto = nh;
  }
  clonar() {
    const c = new Capa(this.ancho, this.alto, this.nombre + ' copy');
    c.x = this.x; c.y = this.y; c.opacidad = this.opacidad;
    c.ctx.drawImage(this.canvas, 0, 0);
    return c;
  }
  voltear(h = true) {
    const t = document.createElement('canvas');
    t.width = this.ancho; t.height = this.alto;
    const tc = t.getContext('2d');
    tc.save();
    tc.translate(h ? this.ancho : 0, h ? 0 : this.alto);
    tc.scale(h ? -1 : 1, h ? 1 : -1);
    tc.drawImage(this.canvas, 0, 0);
    tc.restore();
    this.ctx.clearRect(0, 0, this.ancho, this.alto);
    this.ctx.drawImage(t, 0, 0);
  }
  limpiar() { this.ctx.clearRect(0, 0, this.ancho, this.alto); }
  instantanea() { return this.ctx.getImageData(0, 0, this.ancho, this.alto); }
  restaurar(d) { this.ctx.putImageData(d, 0, 0); }
}

class HistorialAcciones {
  constructor(limite = 50) {
    this.limite = limite;
    this.deshacerPila = [];
    this.rehacerPila = [];
  }
  registrarEstado(capa) {
    if (!capa) return;
    this.deshacerPila.push({
      id: capa.id, x: capa.x, y: capa.y,
      ancho: capa.ancho, alto: capa.alto,
      opacidad: capa.opacidad, visible: capa.visible,
      datos: capa.instantanea()
    });
    if (this.deshacerPila.length > this.limite) this.deshacerPila.shift();
    this.rehacerPila = [];
  }
  deshacer(capas) {
    const e = this.deshacerPila.pop();
    if (!e) return false;
    const c = capas.find(x => x.id === e.id);
    if (!c) return false;
    this.rehacerPila.push({
      id: c.id, x: c.x, y: c.y,
      ancho: c.ancho, alto: c.alto,
      opacidad: c.opacidad, visible: c.visible,
      datos: c.instantanea()
    });
    c.x = e.x; c.y = e.y; c.opacidad = e.opacidad; c.visible = e.visible;
    if (e.ancho !== c.ancho || e.alto !== c.alto) {
      c.canvas.width = e.ancho; c.canvas.height = e.alto;
      c.ancho = e.ancho; c.alto = e.alto;
    }
    c.restaurar(e.datos);
    return true;
  }
  rehacer(capas) {
    const e = this.rehacerPila.pop();
    if (!e) return false;
    const c = capas.find(x => x.id === e.id);
    if (!c) return false;
    this.deshacerPila.push({
      id: c.id, x: c.x, y: c.y,
      ancho: c.ancho, alto: c.alto,
      opacidad: c.opacidad, visible: c.visible,
      datos: c.instantanea()
    });
    c.x = e.x; c.y = e.y; c.opacidad = e.opacidad; c.visible = e.visible;
    if (e.ancho !== c.ancho || e.alto !== c.alto) {
      c.canvas.width = e.ancho; c.canvas.height = e.alto;
      c.ancho = e.ancho; c.alto = e.alto;
    }
    c.restaurar(e.datos);
    return true;
  }
}

class GestorSeleccion {
  constructor(opciones = {}) {
    this.onGetCapaActiva = opciones.onGetCapaActiva || (() => null);
    this.onAgregarCapa = opciones.onAgregarCapa || (() => {});
    this.onRenderizar = opciones.onRenderizar || (() => {});
    this.onGuardarHistorial = opciones.onGuardarHistorial || (() => {});
    this.onSetCursor = opciones.onSetCursor || (() => {});
    this.modo = 'ninguno';
    this.puntos = [];
    this.cerrada = false;
    this.dibujando = false;
    this.portapapeles = null;
    this.enlazarTeclas();
  }
  async setImagenComoCapa(fuenteImagen, nombre = 'Layer Image') {
    if (!fuenteImagen) return null;
    let imgElement = null;
    if (fuenteImagen instanceof HTMLImageElement) {
      imgElement = fuenteImagen;
    } else if (fuenteImagen instanceof HTMLCanvasElement) {
      const c = new Capa(fuenteImagen.width, fuenteImagen.height, nombre);
      c.ctx.drawImage(fuenteImagen, 0, 0);
      this._integrarNuevaCapa(c);
      return c;
    } else if (fuenteImagen instanceof Blob || fuenteImagen instanceof File) {
      imgElement = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(fuenteImagen);
      });
    } else if (typeof fuenteImagen === 'string') {
      imgElement = await new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = fuenteImagen;
      });
    }
    if (!imgElement) return null;
    const w = imgElement.naturalWidth || imgElement.width;
    const h = imgElement.naturalHeight || imgElement.height;
    const nuevaCapa = new Capa(w, h, nombre);
    nuevaCapa.ctx.drawImage(imgElement, 0, 0);
    this._integrarNuevaCapa(nuevaCapa);
    return nuevaCapa;
  } 
  setTagImgComoCapa(imgElement, nombre = 'Layer Image') {
    if (!imgElement) return null;
    const w = imgElement.naturalWidth || imgElement.width;
    const h = imgElement.naturalHeight || imgElement.height;
    if (!w || !h) return null;
    const nuevaCapa = new Capa(w, h, nombre);
    nuevaCapa.ctx.drawImage(imgElement, 0, 0);
    this._integrarNuevaCapa(nuevaCapa);
    return nuevaCapa;
  }
  async setUrlComoCapa(url, nombre = 'Layer URL') {
    if (!url || typeof url !== 'string') return null;
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(this.setTagImgComoCapa(img, nombre));
      img.onerror = (err) => {
        console.error('Error loading image from URL', err);
        resolve(null);
      };
      img.src = url;
    });
  }
  setResultFileInputReadComoCapa(resultReader, nombre = 'Layer File') {
    if (!resultReader) return null;
    if (typeof resultReader === 'string') return this.setUrlComoCapa(resultReader, nombre);
    if (resultReader instanceof ArrayBuffer) {
      const blob = new Blob([resultReader]);
      const url = URL.createObjectURL(blob);
      return this.setUrlComoCapa(url, nombre).finally(() => URL.revokeObjectURL(url));
    }
    return null;
  }
  setImageDataComoCapa(imageData, nombre = 'Layer ImageData') {
    if (!imageData || !imageData.data || !imageData.width || !imageData.height) {
      console.error('El objeto proporcionado no es un ImageData válido.');
      return null;
    }
    const nuevaCapa = new Capa(imageData.width, imageData.height, nombre);
    nuevaCapa.ctx.putImageData(imageData, 0, 0);
    this._integrarNuevaCapa(nuevaCapa);
    return nuevaCapa;
  } 
  _integrarNuevaCapa(capa) {
    this.guardarHistorial();
    this.capas.push(capa);
    this.indiceActiva = this.capas.length - 1; 
    if (capa.ancho > this.documento.ancho || capa.alto > this.documento.alto) {
      this.documento.ancho = Math.max(this.documento.ancho, capa.ancho);
      this.documento.alto = Math.max(this.documento.alto, capa.alto);
    }
    this.notificarCapas();
    this.renderizar();
  }
  activarModo(m) {
    this.limpiar();
    this.modo = m;
    this.onSetCursor(m !== 'ninguno' ? 'crosshair' : 'none');
  }
  limpiar() {
    this.puntos = [];
    this.cerrada = false;
    this.dibujando = false;
    this.onSetCursor('none');
    this.onRenderizar();
  }
  onPuntero(tipo, p) {
    if (this.modo === 'ninguno') return;
    if (tipo === 'down') {
      this.puntos = [p];
      this.dibujando = true;
      this.cerrada = false;
    } else if (tipo === 'move' && this.dibujando) {
      if (this.modo === 'rect') this.puntos[1] = p;
      else if (this.modo === 'lasso') this.puntos.push(p);
      this.onRenderizar();
    } else if (tipo === 'up' && this.dibujando) {
      this.dibujando = false;
      if (this.modo === 'rect') { this.puntos[1] = p; this.cerrada = true; }
      this.onRenderizar();
    }
  }
  crearRuta(ctx, offX = 0, offY = 0) {
    if (this.puntos.length < 2) return false;
    ctx.beginPath();
    if (this.modo === 'rect') {
      const p1 = this.puntos[0], p2 = this.puntos[this.puntos.length - 1];
      const x = Math.min(p1.x, p2.x), y = Math.min(p1.y, p2.y);
      const w = Math.abs(p2.x - p1.x), h = Math.abs(p2.y - p1.y);
      ctx.rect(x - offX, y - offY, w, h);
    } else {
      ctx.moveTo(this.puntos[0].x - offX, this.puntos[0].y - offY);
      for (let i = 1; i < this.puntos.length; i++) ctx.lineTo(this.puntos[i].x - offX, this.puntos[i].y - offY);
      if (this.cerrada) ctx.closePath();
    }
    return true;
  }
  dibujarBorde(ctx) {
    if (this.modo === 'ninguno' || this.puntos.length < 2) return;
    ctx.save();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    this.crearRuta(ctx, 0, 0);
    ctx.stroke();
    ctx.strokeStyle = '#000000';
    ctx.lineDashOffset = 4;
    ctx.stroke();
    ctx.restore();
  }
  copiar() {
    const capa = this.onGetCapaActiva();
    if (!this.cerrada || !capa) return false;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    if (this.modo === 'rect') {
      const p1 = this.puntos[0], p2 = this.puntos[this.puntos.length - 1];
      minX = Math.min(p1.x, p2.x); maxX = Math.max(p1.x, p2.x);
      minY = Math.min(p1.y, p2.y); maxY = Math.max(p1.y, p2.y);
    } else {
      for (const p of this.puntos) {
        if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
      }
    }
    const w = Math.round(maxX - minX), h = Math.round(maxY - minY);
    if (w <= 0 || h <= 0) return false;
    const temp = document.createElement('canvas');
    temp.width = w; temp.height = h;
    const tctx = temp.getContext('2d');
    tctx.save();
    this.crearRuta(tctx, minX, minY);
    tctx.clip();
    tctx.drawImage(capa.canvas, capa.x - minX, capa.y - minY);
    tctx.restore();
    this.portapapeles = { canvas: temp, x: Math.round(minX), y: Math.round(minY), ancho: w, alto: h };
    return true;
  }
  eliminar() {
    const capa = this.onGetCapaActiva();
    if (!this.cerrada || !capa) return;
    this.onGuardarHistorial();
    capa.ctx.save();
    capa.ctx.globalCompositeOperation = 'destination-out';
    this.crearRuta(capa.ctx, capa.x, capa.y);
    capa.ctx.fill();
    capa.ctx.restore();
    this.onRenderizar();
  }
  cortar() { if (this.copiar()) this.eliminar(); }
  pegarComoCapa() {
    if (!this.portapapeles) return false;
    const nueva = new Capa(this.portapapeles.ancho, this.portapapeles.alto, 'Cut Crop');
    nueva.x = this.portapapeles.x;
    nueva.y = this.portapapeles.y;
    nueva.ctx.drawImage(this.portapapeles.canvas, 0, 0);
    this.onAgregarCapa(nueva);
    return true;
  }
  enlazarTeclas() {
    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'Enter' && this.modo === 'lasso' && this.puntos.length > 2) {
        e.preventDefault();
        this.cerrada = true;
        this.onRenderizar();
      }
      if (e.key === 'Escape') this.limpiar();
      if ((e.key === 'Delete' || e.key === 'Backspace') && this.cerrada) { e.preventDefault(); this.eliminar(); }
      if (e.ctrlKey && e.key.toLowerCase() === 'c' && this.cerrada) { e.preventDefault(); this.copiar(); }
      if (e.ctrlKey && e.key.toLowerCase() === 'x' && this.cerrada) { e.preventDefault(); this.cortar(); }
      if (e.ctrlKey && e.key.toLowerCase() === 'v') { e.preventDefault(); this.pegarComoCapa(); }
    }, true);
  }
}

class AplicacionPaint {
  constructor(canvasElement, previewElement, contenedorWorkspace) {
    this.lienzo = canvasElement;
    this.ctx = canvasElement.getContext('2d');
    this.previsualizacion = previewElement;
    this.contenedor = contenedorWorkspace;
    this.documento = { ancho: 1024, alto: 1024 };
    this.capas = [];
    this.indiceActiva = -1;
    this.herramienta = 'pincel';
    this.color = '#ffffff';
    this.tamano = 30;
    this.dureza = 0.7;
    this.fuerza = 1;
    this.desgasteBorde = 0.5;
    this.espaciado = 0.25;
    this.zoom = 1;
    this.rellenarForma = false;
    this.pintando = false;
    this.ultimoPunto = null;
    this.formaInicio = null;
    this.distanciaAcumulada = 0;
    this.puntoOrigenClonado = null;
    this.offsetClonado = null;
    this.canvasClonadoSnapshot = null;
    this.imagenSello = null;
    this.rotacion = 0;
    this.mascaraCache = null;
    this.mascaraClave = '';

    this.algoritmos = new AlgoritmosColor();
    this.ruido = new RuidoSimplex();
    this.historial = new HistorialAcciones();
    this.storage = new GestorStorageIDB();
    this.mezclador = new ModosMezcla();

    this.curvas = new CanvasCurvesStandalone({
      onGetImageData: () => this.capaActiva ? this.capaActiva.instantanea() : null,
      onPutImageData: idata => { if (this.capaActiva) this.capaActiva.restaurar(idata); },
      onApplySnapshot: () => this.guardarHistorial(),
      onRender: () => this.renderizar()
    });

    this.gimpPicker = new GimpColorPicker({
      onColorChange: col => {
        this.color = col;
        this.notificarColor();
      },
      onAnalyzeLayer: () => this.capaActiva ? this.capaActiva.instantanea() : null
    });

    this.fxCanvas = null;
    try { this.fxCanvas = fx.canvas(); } catch (e) { this.fxCanvas = null; }

    this.gestorSeleccion = new GestorSeleccion({
      onGetCapaActiva: () => this.capaActiva,
      onAgregarCapa: c => {
        this.capas.push(c);
        this.indiceActiva = this.capas.length - 1;
        this.notificarCapas();
        this.renderizar();
      },
      onRenderizar: () => this.renderizar(),
      onGuardarHistorial: () => this.guardarHistorial(),
      onSetCursor: cur => { this.lienzo.style.cursor = cur; }
    });

    this.nuevaCapa('Background');
    this.renderizar();
    this.enlazarPasteGlobal();
  }

  get capaActiva() { return this.capas[this.indiceActiva]; }
  notificarCapas() { if (this.onCapasActualizadas) this.onCapasActualizadas(); }
  notificarColor() { if (this.onColorActualizado) this.onColorActualizado(this.color); }

  nuevaCapa(nom) {
    const c = new Capa(this.documento.ancho, this.documento.alto, nom || ('Layer ' + (this.capas.length + 1)));
    this.capas.push(c);
    this.indiceActiva = this.capas.length - 1;
    this.notificarCapas();
    this.renderizar();
  }
  duplicarCapa() {
    if (!this.capaActiva) return;
    const c = this.capaActiva.clonar();
    this.capas.splice(this.indiceActiva + 1, 0, c);
    this.indiceActiva += 1;
    this.notificarCapas();
    this.renderizar();
  }
  eliminarCapa() {
    if (this.capas.length <= 1) return;
    this.capas.splice(this.indiceActiva, 1);
    this.indiceActiva = Math.max(0, this.indiceActiva - 1);
    this.notificarCapas();
    this.renderizar();
  }
  subirCapa() {
    if (this.indiceActiva >= this.capas.length - 1) return;
    const t = this.capas[this.indiceActiva];
    this.capas[this.indiceActiva] = this.capas[this.indiceActiva + 1];
    this.capas[this.indiceActiva + 1] = t;
    this.indiceActiva += 1;
    this.notificarCapas();
    this.renderizar();
  }
  bajarCapa() {
    if (this.indiceActiva <= 0) return;
    const t = this.capas[this.indiceActiva];
    this.capas[this.indiceActiva] = this.capas[this.indiceActiva - 1];
    this.capas[this.indiceActiva - 1] = t;
    this.indiceActiva -= 1;
    this.notificarCapas();
    this.renderizar();
  }
  ajustarCanvasACapa() {
    const c = this.capaActiva;
    if (!c) return;
    const ox = c.x, oy = c.y;
    this.capas.forEach(l => { l.x -= ox; l.y -= oy; });
    this.documento.ancho = c.ancho;
    this.documento.alto = c.alto;
    this.renderizar();
  }
  guardarHistorial() { this.historial.registrarEstado(this.capaActiva); }
  deshacer() { if (this.historial.deshacer(this.capas)) { this.renderizar(); this.notificarCapas(); } }
  rehacer() { if (this.historial.rehacer(this.capas)) { this.renderizar(); this.notificarCapas(); } }

  enlazarPasteGlobal() {
    this._pasteHandler = async (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      const cd = e.clipboardData || window.clipboardData;
      if (!cd) return;

      const items = cd.items;
      if (!items || items.length === 0) return;

      for (const item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          e.preventDefault();
          const file = item.getAsFile();
          if (file) {
            const reader = new FileReader();
            reader.onload = ev => this.setResultFileInputReadComoCapa(ev.target.result, 'Pasted Image');
            reader.readAsDataURL(file);
            return;
          }
        }
      }

      for (const item of items) {
        if (item.kind === 'string') {
          if (item.type === 'text/html') {
            item.getAsString(html => {
              const parser = new DOMParser();
              const doc = parser.parseFromString(html, 'text/html');
              const img = doc.querySelector('img');
              if (img && img.src) {
                e.preventDefault();
                this.setUrlComoCapa(img.src, 'Web Image');
              }
            });
            return;
          } else if (item.type === 'text/plain') {
            item.getAsString(txt => {
              const url = txt.trim();
              if (url.startsWith('data:image/') || url.match(/^https?:\/\/.*\.(png|jpg|jpeg|webp|gif|svg)(\?.*)?$/i)) {
                e.preventDefault();
                this.setUrlComoCapa(url, 'URL Image');
              }
            });
            return;
          }
        }
      }
    };

    window.addEventListener('paste', this._pasteHandler);
  }

  obtenerMascara() {
    const k = this.tamano + '_' + this.dureza + '_' + this.desgasteBorde;
    if (this.mascaraClave === k && this.mascaraCache) return this.mascaraCache;
    const c = document.createElement('canvas');
    c.width = c.height = this.tamano;
    const ctx = c.getContext('2d');
    const r = this.tamano / 2;
    const radioInterior = Math.max(0, r * (1 - this.desgasteBorde) * this.dureza);
    const grad = ctx.createRadialGradient(r, r, radioInterior, r, r, r);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(r, r, r, 0, Math.PI * 2);
    ctx.fill();
    this.mascaraCache = c;
    this.mascaraClave = k;
    return c;
  }

  colocarDab(xDoc, yDoc) {
    const c = this.capaActiva;
    if (!c) return;
    const x = xDoc - c.x, y = yDoc - c.y;
    const m = this.obtenerMascara();

    if (this.herramienta === 'borrador') {
      c.ctx.save();
      c.ctx.globalAlpha = this.fuerza;
      c.ctx.globalCompositeOperation = 'destination-out';
      c.ctx.drawImage(m, x - this.tamano / 2, y - this.tamano / 2);
      c.ctx.restore();
    } else if (this.herramienta === 'sello' && this.imagenSello) {
      const rad = (this.rotacion * Math.PI) / 180;
      const tmp = document.createElement('canvas');
      tmp.width = tmp.height = this.tamano;
      const tc = tmp.getContext('2d');

      tc.save();
      tc.translate(this.tamano / 2, this.tamano / 2);
      tc.rotate(rad);
      tc.drawImage(this.imagenSello, -this.tamano / 2, -this.tamano / 2, this.tamano, this.tamano);
      tc.restore();

      if (this.color.toLowerCase() !== '#ffffff') {
        tc.save();
        tc.globalCompositeOperation = 'multiply';
        tc.fillStyle = this.color;
        tc.fillRect(0, 0, this.tamano, this.tamano);
        tc.restore();

        tc.save();
        tc.globalCompositeOperation = 'destination-in';
        tc.translate(this.tamano / 2, this.tamano / 2);
        tc.rotate(rad);
        tc.drawImage(this.imagenSello, -this.tamano / 2, -this.tamano / 2, this.tamano, this.tamano);
        tc.restore();
      }

      tc.globalCompositeOperation = 'destination-in';
      tc.drawImage(m, 0, 0);

      c.ctx.save();
      c.ctx.globalAlpha = this.fuerza;
      c.ctx.drawImage(tmp, x - this.tamano / 2, y - this.tamano / 2);
      c.ctx.restore();
    } else if (this.herramienta === 'clonar' && this.canvasClonadoSnapshot && this.offsetClonado) {
      const xF = x + this.offsetClonado.x, yF = y + this.offsetClonado.y;
      const tmp = document.createElement('canvas');
      tmp.width = tmp.height = this.tamano;
      const tc = tmp.getContext('2d');

      tc.drawImage(this.canvasClonadoSnapshot, xF - this.tamano / 2, yF - this.tamano / 2, this.tamano, this.tamano, 0, 0, this.tamano, this.tamano);

      if (this.color.toLowerCase() !== '#ffffff') {
        tc.save();
        tc.globalCompositeOperation = 'multiply';
        tc.fillStyle = this.color;
        tc.fillRect(0, 0, this.tamano, this.tamano);
        tc.restore();

        tc.save();
        tc.globalCompositeOperation = 'destination-in';
        tc.drawImage(this.canvasClonadoSnapshot, xF - this.tamano / 2, yF - this.tamano / 2, this.tamano, this.tamano, 0, 0, this.tamano, this.tamano);
        tc.restore();
      }

      tc.globalCompositeOperation = 'destination-in';
      tc.drawImage(m, 0, 0);

      c.ctx.save();
      c.ctx.globalAlpha = this.fuerza;
      c.ctx.drawImage(tmp, x - this.tamano / 2, y - this.tamano / 2);
      c.ctx.restore();
    } else if (this.herramienta === 'pincel') {
      const tmp = document.createElement('canvas');
      tmp.width = tmp.height = this.tamano;
      const tc = tmp.getContext('2d');
      tc.fillStyle = this.color;
      tc.fillRect(0, 0, this.tamano, this.tamano);
      tc.globalCompositeOperation = 'destination-in';
      tc.drawImage(m, 0, 0);
      c.ctx.save();
      c.ctx.globalAlpha = this.fuerza;
      c.ctx.drawImage(tmp, x - this.tamano / 2, y - this.tamano / 2);
      c.ctx.restore();
    }
    this.renderizar();
  }

  procesarPunto(xDoc, yDoc) {
    if (!this.ultimoPunto) {
      this.colocarDab(xDoc, yDoc);
      this.ultimoPunto = { x: xDoc, y: yDoc };
      this.distanciaAcumulada = 0;
      return;
    }
    let dx = xDoc - this.ultimoPunto.x, dy = yDoc - this.ultimoPunto.y;
    let dist = Math.hypot(dx, dy);
    const paso = Math.max(1, this.tamano * this.espaciado);
    while (this.distanciaAcumulada + dist >= paso) {
      const falta = paso - this.distanciaAcumulada;
      const r = dist === 0 ? 0 : falta / dist;
      const nx = this.ultimoPunto.x + dx * r, ny = this.ultimoPunto.y + dy * r;
      this.colocarDab(nx, ny);
      this.ultimoPunto = { x: nx, y: ny };
      dx = xDoc - nx; dy = yDoc - ny;
      dist = Math.hypot(dx, dy);
      this.distanciaAcumulada = 0;
    }
    this.distanciaAcumulada += dist;
    this.ultimoPunto = { x: xDoc, y: yDoc };
  }

  dibujarForma(ctx, p1, p2, rellenar) {
    ctx.save();
    ctx.strokeStyle = this.color;
    ctx.fillStyle = this.color;
    ctx.lineWidth = Math.max(1, this.tamano);
    ctx.globalAlpha = this.fuerza;
    ctx.beginPath();
    if (this.herramienta === 'linea') {
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    } else if (this.herramienta === 'rectangulo') {
      const x = Math.min(p1.x, p2.x), y = Math.min(p1.y, p2.y);
      const w = Math.abs(p2.x - p1.x), h = Math.abs(p2.y - p1.y);
      if (rellenar) ctx.fillRect(x, y, w, h); else ctx.strokeRect(x, y, w, h);
    } else if (this.herramienta === 'circulo') {
      const rx = Math.abs(p2.x - p1.x) / 2, ry = Math.abs(p2.y - p1.y) / 2;
      const cx = Math.min(p1.x, p2.x) + rx, cy = Math.min(p1.y, p2.y) + ry;
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      if (rellenar) ctx.fill(); else ctx.stroke();
    } else if (this.herramienta === 'flecha') {
      const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const head = Math.min(dist * 0.4, 25);
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p2.x - head * Math.cos(ang - Math.PI / 6), p2.y - head * Math.sin(ang - Math.PI / 6));
      ctx.moveTo(p2.x, p2.y);
      ctx.lineTo(p2.x - head * Math.cos(ang + Math.PI / 6), p2.y - head * Math.sin(ang + Math.PI / 6));
      ctx.stroke();
    }
    ctx.restore();
  }

  cuentagotas(px, py) {
    const rx = Math.round(px), ry = Math.round(py);
    if (rx < 0 || rx >= this.documento.ancho || ry < 0 || ry >= this.documento.alto) return;
    const p = this.ctx.getImageData(rx, ry, 1, 1).data;
    if (p[3] === 0) return;
    const hex = '#' + ((1 << 24) + (p[0] << 16) + (p[1] << 8) + p[2]).toString(16).slice(1);
    this.color = hex;
    if (this.gimpPicker) {
      this.gimpPicker.hexAColor(hex);
      if (this.gimpPicker.panel) this.gimpPicker.actualizarUI();
    }
    this.notificarColor();
  }

  onPuntero(tipo, ev) {
    const r = this.lienzo.getBoundingClientRect();
    const p = { x: (ev.clientX - r.left) / this.zoom, y: (ev.clientY - r.top) / this.zoom };
    if (this.herramienta === 'sel_rect' || this.herramienta === 'sel_lasso') {
      this.gestorSeleccion.onPuntero(tipo, p);
      return;
    }
    if (tipo === 'move') {
      const d = this.tamano * this.zoom;
      this.previsualizacion.style.width = d + 'px';
      this.previsualizacion.style.height = d + 'px';
      this.previsualizacion.style.left = (p.x * this.zoom) + 'px';
      this.previsualizacion.style.top = (p.y * this.zoom) + 'px';
      this.previsualizacion.style.display = (this.herramienta === 'mover' || this.herramienta === 'cuentagotas') ? 'none' : 'block';
    }
    if (this.herramienta === 'cuentagotas') {
      if (tipo === 'down') this.cuentagotas(p.x, p.y);
      return;
    }
    if (['linea', 'rectangulo', 'circulo', 'flecha'].includes(this.herramienta)) {
      if (tipo === 'down') {
        this.guardarHistorial();
        this.pintando = true;
        this.formaInicio = p;
      } else if (tipo === 'move' && this.pintando) {
        this.renderizar();
        this.dibujarForma(this.ctx, this.formaInicio, p, this.rellenarForma);
      } else if (tipo === 'up' && this.pintando) {
        this.pintando = false;
        const c = this.capaActiva;
        if (c) {
          const p1 = { x: this.formaInicio.x - c.x, y: this.formaInicio.y - c.y };
          const p2 = { x: p.x - c.x, y: p.y - c.y };
          this.dibujarForma(c.ctx, p1, p2, this.rellenarForma);
        }
        this.renderizar();
      }
      return;
    }
    if (this.herramienta === 'mover') {
      if (tipo === 'down') {
        this.moviendo = true;
        this.moverInicio = { x: p.x, y: p.y, cX: this.capaActiva.x, cY: this.capaActiva.y };
        this.guardarHistorial();
      } else if (tipo === 'move' && this.moviendo) {
        this.capaActiva.x = this.moverInicio.cX + (p.x - this.moverInicio.x);
        this.capaActiva.y = this.moverInicio.cY + (p.y - this.moverInicio.y);
        this.renderizar();
      } else if (tipo === 'up') {
        this.moviendo = false;
      }
      return;
    }
    if (this.herramienta === 'clonar' && ev.altKey && tipo === 'down') {
      const c = this.capaActiva;
      if (!c) return;
      this.puntoOrigenClonado = { x: p.x - c.x, y: p.y - c.y };
      const snap = document.createElement('canvas');
      snap.width = c.ancho; snap.height = c.alto;
      snap.getContext('2d').drawImage(c.canvas, 0, 0);
      this.canvasClonadoSnapshot = snap;
      this.offsetClonado = null;
      return;
    }
    if (tipo === 'down') {
      if (ev.button !== 0) return;
      this.guardarHistorial();
      this.pintando = true;
      this.ultimoPunto = null;
      this.distanciaAcumulada = 0;
      if (this.herramienta === 'clonar' && this.puntoOrigenClonado) {
        const inL = { x: p.x - this.capaActiva.x, y: p.y - this.capaActiva.y };
        this.offsetClonado = { x: this.puntoOrigenClonado.x - inL.x, y: this.puntoOrigenClonado.y - inL.y };
      }
      this.procesarPunto(p.x, p.y);
    } else if (tipo === 'move' && this.pintando) {
      this.procesarPunto(p.x, p.y);
    } else if (tipo === 'up') {
      this.pintando = false;
      this.ultimoPunto = null;
    }
  }

  renderizar() {
    this.lienzo.width = this.documento.ancho;
    this.lienzo.height = this.documento.alto;
    this.ctx.clearRect(0, 0, this.documento.ancho, this.documento.alto);
    for (const c of this.capas) {
      if (!c.visible) continue;
      this.ctx.save();
      this.ctx.globalAlpha = c.opacidad;
      this.ctx.drawImage(c.canvas, c.x, c.y);
      this.ctx.restore();
    }
    this.gestorSeleccion.dibujarBorde(this.ctx);
    this.lienzo.style.width = (this.documento.ancho * this.zoom) + 'px';
    this.lienzo.style.height = (this.documento.alto * this.zoom) + 'px';
  }

  cambiarZoom(z) {
    this.zoom = Math.min(10, Math.max(0.05, z));
    this.renderizar();
    if (this.onZoomActualizado) this.onZoomActualizado(this.zoom);
  }

  aplicarMirror(horizontal = true) {
    const c = this.capaActiva;
    if (!c) return;
    this.guardarHistorial();
    const origW = c.ancho, origH = c.alto;
    let targetW = horizontal ? origW * 2 : origW;
    let targetH = horizontal ? origH : origH * 2;

    const MAX_DIM = 4096;
    if (targetW > MAX_DIM || targetH > MAX_DIM) {
      const escala = Math.min(MAX_DIM / targetW, MAX_DIM / targetH);
      targetW = Math.round(targetW * escala);
      targetH = Math.round(targetH * escala);
    }

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = targetW; tempCanvas.height = targetH;
    const tctx = tempCanvas.getContext('2d');
    tctx.imageSmoothingEnabled = true;
    tctx.imageSmoothingQuality = 'high';

    if (horizontal) {
      const halfW = Math.round(targetW / 2);
      tctx.drawImage(c.canvas, 0, 0, origW, origH, 0, 0, halfW, targetH);
      tctx.save();
      tctx.translate(targetW, 0);
      tctx.scale(-1, 1);
      tctx.drawImage(c.canvas, 0, 0, origW, origH, 0, 0, halfW, targetH);
      tctx.restore();
    } else {
      const halfH = Math.round(targetH / 2);
      tctx.drawImage(c.canvas, 0, 0, origW, origH, 0, 0, targetW, halfH);
      tctx.save();
      tctx.translate(0, targetH);
      tctx.scale(1, -1);
      tctx.drawImage(c.canvas, 0, 0, origW, origH, 0, 0, targetW, halfH);
      tctx.restore();
    }

    c.redimensionar(targetW, targetH);
    c.ctx.clearRect(0, 0, targetW, targetH);
    c.ctx.drawImage(tempCanvas, 0, 0);

    if (targetW > this.documento.ancho || targetH > this.documento.alto) {
      this.documento.ancho = Math.max(this.documento.ancho, targetW);
      this.documento.alto = Math.max(this.documento.alto, targetH);
    }
    this.renderizar();
  }

  aplicarFiltroPixel(cb) {
    const c = this.capaActiva;
    if (!c) return;
    this.guardarHistorial();
    const imgData = c.ctx.getImageData(0, 0, c.ancho, c.alto);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      const res = cb(d[i], d[i+1], d[i+2], d[i+3]);
      d[i] = res[0]; d[i+1] = res[1]; d[i+2] = res[2]; d[i+3] = res[3];
    }
    c.ctx.putImageData(imgData, 0, 0);
    this.renderizar();
  }

  aplicarGLFX(tipo, params = {}) {
    const c = this.capaActiva;
    if (!c || !this.fxCanvas) return alert('GLFX WebGL engine not available.');
    this.guardarHistorial();
    const w = c.ancho, h = c.alto;
    const tex = this.fxCanvas.texture(c.canvas);
    let fxInst = this.fxCanvas.draw(tex);
    if (tipo === 'reducir_ruido') fxInst.denoise(params.exponente || 20);
    else if (tipo === 'enfocar') fxInst.unsharpMask(params.radio || 5, params.fuerza || 1);
    else if (tipo === 'ruido') fxInst.noise(params.cantidad || 0.15);
    else if (tipo === 'vineta') fxInst.vignette(params.tamano || 0.5, params.cantidad || 0.5);
    else if (tipo === 'desenfoque_zoom') fxInst.zoomBlur(w / 2, h / 2, params.fuerza || 0.1);
    else if (tipo === 'desenfoque_triangular') fxInst.triangleBlur(params.radio || 10);
    else if (tipo === 'remolino') fxInst.swirl(w / 2, h / 2, params.radio || 200, params.angulo || 3);
    else if (tipo === 'burbuja') fxInst.bulgePinch(w / 2, h / 2, params.radio || 200, params.fuerza || 0.5);
    fxInst.update();
    c.ctx.clearRect(0, 0, c.ancho, c.alto);
    c.ctx.drawImage(this.fxCanvas, 0, 0);
    this.renderizar();
  }

  async exportarEstado() {
    const list = [];
    for (const c of this.capas) {
      list.push({
        id: c.id, nombre: c.nombre, x: c.x, y: c.y,
        ancho: c.ancho, alto: c.alto, opacidad: c.opacidad, visible: c.visible,
        imagenData: c.canvas.toDataURL('image/png')
      });
    }
    return {
      documento: { ...this.documento },
      indiceActiva: this.indiceActiva,
      tamano: this.tamano, dureza: this.dureza, fuerza: this.fuerza, rotacion: this.rotacion, color: this.color,
      capas: list
    };
  }

  async cargarEstado(st) {
    if (!st || !st.capas) return;
    this.documento = { ...st.documento };
    this.tamano = st.tamano || 30;
    this.dureza = st.dureza || 0.7;
    this.fuerza = st.fuerza || 1;
    this.rotacion = st.rotacion || 0;
    this.color = st.color || '#ffffff';
    this.capas = [];
    for (const dc of st.capas) {
      const c = new Capa(dc.ancho, dc.alto, dc.nombre);
      c.id = dc.id; c.x = dc.x; c.y = dc.y;
      c.opacidad = dc.opacidad; c.visible = dc.visible;
      await new Promise(r => {
        const img = new Image();
        img.onload = () => { c.ctx.drawImage(img, 0, 0); r(); };
        img.src = dc.imagenData;
      });
      this.capas.push(c);
    }
    this.indiceActiva = Math.min(st.indiceActiva, this.capas.length - 1);
    this.notificarCapas();
    this.renderizar();
  }
}

class InterfazUsuario {
  constructor(app, contenedorIzq, contenedorDer, contenedorCentral) {
    this.app = app;
    this.contenedorIzq = contenedorIzq;
    this.contenedorDer = contenedorDer;
    this.contenedorCentral = contenedorCentral;
    this.btnsH = {};
    this.panelSesionesModal = null;
    this.init();
  }
  init() {
    UI.Theme.inject();
    UI.Theme.set({
      'panel-width': '100%',
      'font-size-panel-title': '11px',
      'font-size-label': '10px',
      'font-size-btn': '10px'
    });
    this.construirPanelHerramientas();
    this.construirPanelClipboard();
    this.construirPanelPropiedades();
    this.construirPanelZoom();
    this.construirPanelCapas();
    this.construirPanelCurvas();
    this.construirPanelMirror();
    this.construirPanelFiltrosClasicos();
    this.construirPanelGLFX();
    this.construirPanelExportar();
    this.enlazarEventosLienzo();

    this.app.onCapasActualizadas = () => this.actualizarPanelCapas();
    this.app.onColorActualizado = col => { if (this.inColor) this.inColor.value = col; };
    this.app.onZoomActualizado = z => { if (this.lblZoom) this.lblZoom.setText(Math.round(z * 100) + '%'); };
  }

  construirPanelHerramientas() {
    const p = new UISmartPanel({ title: 'Tools & Shapes', floating: false });
    const inBuscar = new UIInputText({ placeholder: 'Search tool...', value: '' });
    p.addRow(inBuscar);

    this.listaH = [
      ['pincel', 'Brush (B)'],
      ['borrador', 'Eraser (E)'],
      ['linea', 'Straight Line'],
      ['rectangulo', 'Rectangle'],
      ['circulo', 'Circle / Ellipse'],
      ['flecha', 'Arrow'],
      ['cuentagotas', 'Eyedropper'],
      ['clonar', 'Clone (C, Alt+Click)'],
      ['sello', 'Image Stamp (S)'],
      ['mover', 'Move Layer (M)'],
      ['sel_rect', 'Rect Select'],
      ['sel_lasso', 'Lasso Select']
    ];

    const cont = document.createElement('div');
    cont.style.cssText = 'display:flex; flex-direction:column; gap:4px;';
    this.listaH.forEach(([id, txt]) => {
      const b = new UIButton({ text: txt });
      b.element.style.width = '100%';
      b.element.onclick = () => {
        this.app.herramienta = id;
        if (id === 'sel_rect') this.app.gestorSeleccion.activarModo('rect');
        else if (id === 'sel_lasso') this.app.gestorSeleccion.activarModo('lasso');
        else this.app.gestorSeleccion.modo = 'ninguno';

        if (id === 'cuentagotas') {
          this.app.gimpPicker.abrir(this.app.color);
        }

        this.actualizarToolsUI(id);
      };
      this.btnsH[id] = b;
      cont.appendChild(b.element);
    });
    p.body.appendChild(cont);

    inBuscar.element.addEventListener('input', () => {
      const q = inBuscar.getValue().toLowerCase();
      this.listaH.forEach(([id, txt]) => {
        this.btnsH[id].element.style.display = txt.toLowerCase().includes(q) ? 'block' : 'none';
      });
    });

    const chkRellenar = new UICheckbox({
      label: 'Fill Shape',
      checked: false,
      onChange: v => { this.app.rellenarForma = v; }
    });
    p.addRow(chkRellenar);

    const btnCargarSello = new UIButton({ text: 'Load Stamp Image' });
    btnCargarSello.element.onclick = () => document.getElementById('archivoSello').click();
    document.getElementById('archivoSello').onchange = e => {
      if (e.target.files && e.target.files[0]) {
        const rd = new FileReader();
        rd.onload = ev => {
          const im = new Image();
          im.onload = () => {
            this.app.imagenSello = im;
            this.app.herramienta = 'sello';
            this.actualizarToolsUI('sello');
          };
          im.src = ev.target.result;
        };
        rd.readAsDataURL(e.target.files[0]);
        e.target.value = '';
      }
    };
    p.addRow(btnCargarSello);
    p.mount(this.contenedorIzq);
    this.actualizarToolsUI('pincel');
  }

  actualizarToolsUI(act) {
    this.listaH.forEach(([id]) => {
      const el = this.btnsH[id].element;
      if (id === act) { el.style.background = '#3b82f6'; el.style.color = '#fff'; }
      else { el.style.background = ''; el.style.color = ''; }
    });
  }

  construirPanelClipboard() {
    const p = new UISmartPanel({ title: 'Clip & Selection', floating: false });
    const btnCopiar = new UIButton({ text: 'Copy' });
    btnCopiar.element.onclick = () => this.app.gestorSeleccion.copiar();
    const btnCortar = new UIButton({ text: 'Cut' });
    btnCortar.element.onclick = () => this.app.gestorSeleccion.cortar();
    const btnPegar = new UIButton({ text: 'Paste Crop', variant: 'primary' });
    btnPegar.element.onclick = () => this.app.gestorSeleccion.pegarComoCapa();
    const btnBorrar = new UIButton({ text: 'Delete Area', variant: 'danger' });
    btnBorrar.element.onclick = () => this.app.gestorSeleccion.eliminar();
    p.addRow(btnCopiar, btnCortar);
    p.addRow(btnPegar, btnBorrar);
    p.mount(this.contenedorIzq);
  }

  construirPanelPropiedades() {
    const p = new UISmartPanel({ title: 'Brush & Color Properties', floating: false });
    const slTam = new UIConfigurableSlider({ label: 'Size', min: 1, max: 1200, step: 1, value: 30, onChange: v => { this.app.tamano = v; } });
    const slDur = new UIConfigurableSlider({ label: 'Hardness', min: 0, max: 1, step: 0.05, value: 0.7, onChange: v => { this.app.dureza = v; } });
    const slFza = new UIConfigurableSlider({ label: 'Strength', min: 0.05, max: 1, step: 0.05, value: 1, onChange: v => { this.app.fuerza = v; } });
    const slRot = new UIConfigurableSlider({ label: 'Rotation', min: 0, max: 360, step: 1, value: 0, onChange: v => { this.app.rotacion = v; } });

    const slFeather = new UIConfigurableSlider({ 
      label: 'Edge Feather (Decay)', 
      min: 0, 
      max: 1, 
      step: 0.02, 
      value: 0.5, 
      onChange: v => { 
        this.app.desgasteBorde = v; 
        this.app.mascaraCache = null;
      } 
    });

    const inCol = document.createElement('input');
    inCol.type = 'color'; inCol.value = '#ffffff';
    inCol.style.cssText = 'flex:1; height:26px; border:none; background:transparent; cursor:pointer;';
    inCol.oninput = e => { this.app.color = e.target.value; };
    this.inColor = inCol;

    const btnGimp = new UIButton({ text: 'GIMP Picker', variant: 'primary' });
    btnGimp.element.onclick = () => this.app.gimpPicker.abrir(this.app.color);

    p.addRow(slTam); 
    p.addRow(slDur); 
    p.addRow(slFza); 
    p.addRow(slRot);
    p.addRow(slFeather);
    p.addRow(new UILabel({ text: 'Color:' }), inCol, btnGimp);
    p.mount(this.contenedorIzq);
  }

  construirPanelZoom() {
    const p = new UISmartPanel({ title: 'Document & Zoom', floating: false });
    const btnZoomMenos = new UIButton({ text: '-' });
    btnZoomMenos.element.onclick = () => this.app.cambiarZoom(this.app.zoom / 1.25);
    const btnZoomMas = new UIButton({ text: '+' });
    btnZoomMas.element.onclick = () => this.app.cambiarZoom(this.app.zoom * 1.25);
    const btnZoom100 = new UIButton({ text: '100%' });
    btnZoom100.element.onclick = () => this.app.cambiarZoom(1);
    const btnFit = new UIButton({ text: 'Fit Canvas' });
    btnFit.element.onclick = () => {
      const r = this.contenedorCentral.getBoundingClientRect();
      const z = Math.min((r.width - 60) / this.app.documento.ancho, (r.height - 60) / this.app.documento.alto);
      this.app.cambiarZoom(Math.max(0.05, z));
    };
    this.lblZoom = new UILabel({ text: '100%' });
    p.addRow(btnZoomMenos, this.lblZoom, btnZoomMas);
    p.addRow(btnZoom100, btnFit);

    const btnFitLayer = new UIButton({ text: 'Fit Canvas to Layer (Q)', variant: 'primary' });
    btnFitLayer.element.onclick = () => this.app.ajustarCanvasACapa();
    p.addRow(btnFitLayer);
    p.mount(this.contenedorIzq);
  }

  construirPanelCapas() {
    const p = new UISmartPanel({ title: 'Layers & Blend Modes', floating: false });
    const btnNC = new UIButton({ text: 'New', variant: 'primary' });
    btnNC.element.onclick = () => this.app.nuevaCapa();
    const btnDC = new UIButton({ text: 'Duplicate' });
    btnDC.element.onclick = () => this.app.duplicarCapa();
    const btnEC = new UIButton({ text: 'Delete', variant: 'danger' });
    btnEC.element.onclick = () => this.app.eliminarCapa();
    p.addRow(btnNC, btnDC, btnEC);

    const btnSub = new UIButton({ text: 'Move Up' });
    btnSub.element.onclick = () => this.app.subirCapa();
    const btnBaj = new UIButton({ text: 'Move Down' });
    btnBaj.element.onclick = () => this.app.bajarCapa();
    p.addRow(btnSub, btnBaj);

    const btnVolH = new UIButton({ text: 'Flip H' });
    btnVolH.element.onclick = () => { if (this.app.capaActiva) { this.app.guardarHistorial(); this.app.capaActiva.voltear(true); this.app.renderizar(); } };
    const btnVolV = new UIButton({ text: 'Flip V' });
    btnVolV.element.onclick = () => { if (this.app.capaActiva) { this.app.guardarHistorial(); this.app.capaActiva.voltear(false); this.app.renderizar(); } };
    p.addRow(btnVolH, btnVolV);

    const selModo = document.createElement('select');
    selModo.style.cssText = 'flex:1; background:#0f1116; color:#eee; border:1px solid #232731; border-radius:4px; padding:4px; font-size:10px;';
    ['normal', 'multiply', 'screen', 'overlay', 'difference'].forEach(m => {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m.toUpperCase();
      selModo.appendChild(opt);
    });

    const btnMerge = new UIButton({ text: 'Merge Down', variant: 'primary' });
    btnMerge.element.onclick = () => {
      if (this.app.indiceActiva <= 0) return alert('Select a layer that has another layer below it.');
      const sup = this.app.capas[this.app.indiceActiva];
      const inf = this.app.capas[this.app.indiceActiva - 1];
      const res = this.app.mezclador.mezclar(sup, inf, selModo.value, sup.opacidad);
      if (res) {
        this.app.guardarHistorial();
        inf.redimensionar(res.ancho, res.alto);
        inf.x = res.x; inf.y = res.y;
        inf.ctx.putImageData(res.imageData, 0, 0);
        this.app.capas.splice(this.app.indiceActiva, 1);
        this.app.indiceActiva = Math.max(0, this.app.indiceActiva - 1);
        this.actualizarPanelCapas();
        this.app.renderizar();
      }
    };
    p.addRow(selModo, btnMerge);

    const btnLoadImg = new UIButton({ text: 'Import Image as Layer' });
    btnLoadImg.element.onclick = () => document.getElementById('archivoCapa').click();
    document.getElementById('archivoCapa').onchange = e => {
      if (e.target.files && e.target.files[0]) {
        const f = e.target.files[0];
        const rd = new FileReader();
        rd.onload = ev => {
          const im = new Image();
          im.onload = () => {
            const c = new Capa(im.naturalWidth, im.naturalHeight, f.name);
            c.ctx.drawImage(im, 0, 0);
            this.app.capas.push(c);
            this.app.indiceActiva = this.app.capas.length - 1;
            this.actualizarPanelCapas();
            this.app.renderizar();
          };
          im.src = ev.target.result;
        };
        rd.readAsDataURL(f);
        e.target.value = '';
      }
    };
    p.addRow(btnLoadImg);

    this.contListaCapas = document.createElement('div');
    this.contListaCapas.style.cssText = 'display:flex; flex-direction:column; gap:4px; margin-top:6px;';
    p.body.appendChild(this.contListaCapas);
    p.mount(this.contenedorDer);
    this.actualizarPanelCapas();
  }

  actualizarPanelCapas() {
    if (!this.contListaCapas) return;
    this.contListaCapas.innerHTML = '';
    for (let i = this.app.capas.length - 1; i >= 0; i--) {
      const c = this.app.capas[i];
      const row = new UIRow({ align: 0 });
      const chk = new UICheckbox({
        label: c.nombre,
        checked: c.visible,
        onChange: v => { c.visible = v; this.app.renderizar(); }
      });
      chk.element.style.flex = '1';
      chk.element.onclick = e => {
        if (e.target.tagName !== 'INPUT') {
          this.app.indiceActiva = i;
          this.actualizarPanelCapas();
        }
      };
      if (i === this.app.indiceActiva) chk.element.style.color = '#3b82f6';
      row.append(chk);
      const sl = new UIConfigurableSlider({
        label: '', min: 0, max: 100, step: 1, value: Math.round(c.opacidad * 100),
        onChange: v => { c.opacidad = v / 100; this.app.renderizar(); }
      });
      sl.element.style.width = '80px';
      row.append(sl);
      this.contListaCapas.appendChild(row.element);
    }
  }

  construirPanelCurvas() {
    this.app.curvas.mount(this.contenedorDer);
  }

  construirPanelMirror() {
    const p = new UISmartPanel({ title: 'Mirror Transformations', floating: false });
    const lblDesc = new UILabel({ text: 'Duplicate & Invert (Max dimension 4096px):' });
    lblDesc.element.style.fontSize = '10px';
    lblDesc.element.style.color = '#9ca3af';
    p.addRow(lblDesc);

    const btnMirrorH = new UIButton({ text: 'Mirror Horizontal (x2 Width)', variant: 'primary' });
    btnMirrorH.element.onclick = () => this.app.aplicarMirror(true);

    const btnMirrorV = new UIButton({ text: 'Mirror Vertical (x2 Height)', variant: 'primary' });
    btnMirrorV.element.onclick = () => this.app.aplicarMirror(false);

    p.addRow(btnMirrorH, btnMirrorV);
    p.mount(this.contenedorDer);
  }

  construirPanelFiltrosClasicos() {
    const p = new UISmartPanel({ title: 'Classic Filters & Adjustments', floating: false });
    const slBri = new UIConfigurableSlider({ label: 'Brightness', min: 0, max: 200, step: 1, value: 100 });
    const slCon = new UIConfigurableSlider({ label: 'Contrast', min: 0, max: 200, step: 1, value: 100 });
    const slSat = new UIConfigurableSlider({ label: 'Saturation', min: 0, max: 200, step: 1, value: 100 });
    const slBlur = new UIConfigurableSlider({ label: 'Blur px', min: 0, max: 30, step: 0.5, value: 0 });

    const btnApplyCSS = new UIButton({ text: 'Apply Adjustments', variant: 'primary' });
    btnApplyCSS.element.onclick = () => {
      const c = this.app.capaActiva;
      if (!c) return;
      this.app.guardarHistorial();
      const t = document.createElement('canvas');
      t.width = c.ancho; t.height = c.alto;
      const tc = t.getContext('2d');
      tc.filter = `brightness(${slBri.getValue()}%) contrast(${slCon.getValue()}%) saturate(${slSat.getValue()}%) blur(${slBlur.getValue()}px)`;
      tc.drawImage(c.canvas, 0, 0);
      c.ctx.clearRect(0, 0, c.ancho, c.alto);
      c.ctx.drawImage(t, 0, 0);
      this.app.renderizar();
    };
    p.addRow(slBri); p.addRow(slCon); p.addRow(slSat); p.addRow(slBlur); p.addRow(btnApplyCSS);

    const btnGray = new UIButton({ text: 'Grayscale' });
    btnGray.element.onclick = () => this.app.aplicarFiltroPixel((r, g, b, a) => {
      const v = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
      return [v, v, v, a];
    });
    const btnBW = new UIButton({ text: 'Black & White' });
    btnBW.element.onclick = () => this.app.aplicarFiltroPixel((r, g, b, a) => {
      const v = (0.299 * r + 0.587 * g + 0.114 * b) > 128 ? 255 : 0;
      return [v, v, v, a];
    });
    p.addRow(btnGray, btnBW);

    const btnInvert = new UIButton({ text: 'Invert Colors' });
    btnInvert.element.onclick = () => this.app.aplicarFiltroPixel((r, g, b, a) => [255 - r, 255 - g, 255 - b, a]);
    const btnSepia = new UIButton({ text: 'Sepia Vintage' });
    btnSepia.element.onclick = () => this.app.aplicarFiltroPixel((r, g, b, a) => {
      const nr = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
      const ng = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
      const nb = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
      return [nr, ng, nb, a];
    });
    p.addRow(btnInvert, btnSepia);
    p.mount(this.contenedorDer);
  }

  construirPanelGLFX() {
    const p = new UISmartPanel({ title: 'WebGL Hardware Filters (GLFX)', floating: false });

    const btnDenoise = new UIButton({ text: 'Denoise' });
    btnDenoise.element.onclick = () => this.app.aplicarGLFX('reducir_ruido', { exponente: 25 });
    const btnSharpen = new UIButton({ text: 'Sharpen' });
    btnSharpen.element.onclick = () => this.app.aplicarGLFX('enfocar', { radio: 5, fuerza: 1.2 });
    p.addRow(btnDenoise, btnSharpen);

    const btnNoise = new UIButton({ text: 'Add Noise' });
    btnNoise.element.onclick = () => this.app.aplicarGLFX('ruido', { cantidad: 0.15 });
    const btnVignette = new UIButton({ text: 'Vignette' });
    btnVignette.element.onclick = () => this.app.aplicarGLFX('vineta', { tamano: 0.5, cantidad: 0.6 });
    p.addRow(btnNoise, btnVignette);

    p.mount(this.contenedorDer);
  }

  construirPanelExportar() {
    const p = new UISmartPanel({ title: 'Export & File Storage', floating: false });

    const btnDLpng = new UIButton({ text: 'Download PNG', variant: 'primary' });
    btnDLpng.element.onclick = () => {
      const a = document.createElement('a');
      a.download = 'render.png'; a.href = this.app.lienzo.toDataURL('image/png'); a.click();
    };
    const btnDLjpg = new UIButton({ text: 'Download JPG' });
    btnDLjpg.element.onclick = () => {
      const t = document.createElement('canvas');
      t.width = this.app.lienzo.width; t.height = this.app.lienzo.height;
      const tc = t.getContext('2d');
      tc.fillStyle = '#ffffff'; tc.fillRect(0, 0, t.width, t.height);
      tc.drawImage(this.app.lienzo, 0, 0);
      const a = document.createElement('a');
      a.download = 'render.jpg'; a.href = t.toDataURL('image/jpeg', 0.95); a.click();
    };
    p.addRow(btnDLpng, btnDLjpg);

    const btnGuardarJSON = new UIButton({ text: 'Export JSON' });
    btnGuardarJSON.element.onclick = async () => {
      const st = await this.app.exportarEstado();
      const b = new Blob([JSON.stringify(st)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `project_${Date.now()}.json`;
      a.click();
    };
    const btnCargarJSON = new UIButton({ text: 'Import JSON' });
    btnCargarJSON.element.onclick = () => document.getElementById('archivoJSON').click();
    document.getElementById('archivoJSON').onchange = e => {
      if (e.target.files && e.target.files[0]) {
        const rd = new FileReader();
        rd.onload = ev => this.app.cargarEstado(JSON.parse(ev.target.result));
        rd.readAsText(e.target.files[0]);
        e.target.value = '';
      }
    };
    p.addRow(btnGuardarJSON, btnCargarJSON);

    p.mount(this.contenedorDer);
  }

  enlazarEventosLienzo() {
    this.app.lienzo.addEventListener('pointerdown', e => {
      this.app.lienzo.setPointerCapture(e.pointerId);
      this.app.onPuntero('down', e);
    });
    this.app.lienzo.addEventListener('pointermove', e => this.app.onPuntero('move', e));
    this.app.lienzo.addEventListener('pointerup', e => this.app.onPuntero('up', e));
    this.app.lienzo.addEventListener('pointercancel', e => this.app.onPuntero('up', e));
    this.app.lienzo.addEventListener('pointerleave', () => this.app.previsualizacion.style.display = 'none');

    this.contenedorCentral.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 0.88;
      this.app.cambiarZoom(this.app.zoom * factor);
    }, { passive: false });

    window.addEventListener('keydown', ev => {
      if (ev.target.tagName === 'INPUT') return;
      const k = ev.key.toLowerCase();
      if (ev.ctrlKey && !ev.shiftKey && k === 'z') { ev.preventDefault(); this.app.deshacer(); return; }
      if ((ev.ctrlKey && ev.shiftKey && k === 'z') || (ev.ctrlKey && k === 'y')) { ev.preventDefault(); this.app.rehacer(); return; }
      if (k === 'q') { ev.preventDefault(); this.app.ajustarCanvasACapa(); return; }
      if (k === 'b') { this.app.herramienta = 'pincel'; this.actualizarToolsUI('pincel'); return; }
      if (k === 'e') { this.app.herramienta = 'borrador'; this.actualizarToolsUI('borrador'); return; }
      if (k === 'c') { this.app.herramienta = 'clonar'; this.actualizarToolsUI('clonar'); return; }
      if (k === 's') { this.app.herramienta = 'sello'; this.actualizarToolsUI('sello'); return; }
      if (k === 'm') { this.app.herramienta = 'mover'; this.actualizarToolsUI('mover'); return; }
    });
  }
}

const appInstancia = new AplicacionPaint(
  document.getElementById('lienzoComposicion'),
  document.getElementById('previsualizacionPincel'),
  document.getElementById('areaLienzoCentral')
);

const uiInstancia = new InterfazUsuario(
  appInstancia,
  document.getElementById('columnaIzquierda'),
  document.getElementById('columnaDerecha'),
  document.getElementById('areaLienzoCentral')
);
</script>
</body>
</html>
