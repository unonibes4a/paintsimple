class EditorCurvas {
  constructor(ancho, alto) {
    this.ancho = ancho;
    this.alto = alto;
    this.margen = 8;
    this.canales = {
      master: this.puntosPorDefecto(),
      r: this.puntosPorDefecto(),
      g: this.puntosPorDefecto(),
      b: this.puntosPorDefecto()
    };
    this.colores = { master: '#e8e8e8', r: '#ff5b5b', g: '#4ee36a', b: '#5b9dff' };
    this.canalActivo = 'master';
    this.indiceArrastrado = -1;
    this.radioPunto = 6;
    this.canvas = document.createElement('canvas');
    this.canvas.id = 'lienzoCurvas';
    this.canvas.width = ancho;
    this.canvas.height = alto;
    this.ctx = this.canvas.getContext('2d');
    this.enlazarEventos();
    this.redibujar();
  }
  puntosPorDefecto() {
    return [{ x: 0, y: 0 }, { x: 255, y: 255 }];
  }
  reiniciarCanal() {
    this.canales[this.canalActivo] = this.puntosPorDefecto();
    this.redibujar();
  }
  reiniciarTodo() {
    for (const k in this.canales) this.canales[k] = this.puntosPorDefecto();
    this.redibujar();
  }
  xAPixel(x) { return this.margen + (x / 255) * (this.ancho - this.margen * 2); }
  yAPixel(y) { return this.alto - this.margen - (y / 255) * (this.alto - this.margen * 2); }
  pixelAX(px) { return Math.max(0, Math.min(255, ((px - this.margen) / (this.ancho - this.margen * 2)) * 255)); }
  pixelAY(py) { return Math.max(0, Math.min(255, ((this.alto - this.margen - py) / (this.alto - this.margen * 2)) * 255)); }
  puntosOrdenados(canal) { return this.canales[canal].slice().sort((a, b) => a.x - b.x); }
  encontrarPuntoCercano(px, py) {
    const pts = this.canales[this.canalActivo];
    for (let i = 0; i < pts.length; i++) {
      const sx = this.xAPixel(pts[i].x);
      const sy = this.yAPixel(pts[i].y);
      if (Math.hypot(sx - px, sy - py) <= this.radioPunto + 4) return i;
    }
    return -1;
  }
  enlazarEventos() {
    const posDesdeEvento = ev => {
      const rect = this.canvas.getBoundingClientRect();
      const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
      return { px: (cx - rect.left) * (this.canvas.width / rect.width), py: (cy - rect.top) * (this.canvas.height / rect.height) };
    };
    this.canvas.addEventListener('mousedown', ev => {
      const p = posDesdeEvento(ev);
      const idx = this.encontrarPuntoCercano(p.px, p.py);
      if (idx >= 0) {
        this.indiceArrastrado = idx;
      } else {
        const x = this.pixelAX(p.px);
        const y = this.pixelAY(p.py);
        this.canales[this.canalActivo].push({ x, y });
        this.canales[this.canalActivo].sort((a, b) => a.x - b.x);
        this.indiceArrastrado = this.canales[this.canalActivo].findIndex(pt => pt.x === x && pt.y === y);
        this.redibujar();
      }
    });
    window.addEventListener('mousemove', ev => {
      if (this.indiceArrastrado < 0) return;
      const p = posDesdeEvento(ev);
      const pts = this.canales[this.canalActivo];
      let nx = this.pixelAX(p.px);
      const ny = this.pixelAY(p.py);
      const esExtremo = this.indiceArrastrado === 0 || this.indiceArrastrado === pts.length - 1;
      if (this.indiceArrastrado === 0) nx = 0;
      if (this.indiceArrastrado === pts.length - 1) nx = 255;
      if (!esExtremo) {
        nx = Math.max(pts[this.indiceArrastrado - 1].x + 1, Math.min(pts[this.indiceArrastrado + 1].x - 1, nx));
      }
      pts[this.indiceArrastrado].x = nx;
      pts[this.indiceArrastrado].y = ny;
      this.redibujar();
    });
    window.addEventListener('mouseup', () => { this.indiceArrastrado = -1; });
    this.canvas.addEventListener('dblclick', ev => {
      const p = posDesdeEvento(ev);
      const idx = this.encontrarPuntoCercano(p.px, p.py);
      const pts = this.canales[this.canalActivo];
      if (idx > 0 && idx < pts.length - 1) { pts.splice(idx, 1); this.redibujar(); }
    });
  }
  catmullRom(p0, p1, p2, p3, t) {
    const t2 = t * t, t3 = t2 * t;
    return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
  }
  evaluarCurva(pts, x) {
    if (x <= pts[0].x) return pts[0].y;
    if (x >= pts[pts.length - 1].x) return pts[pts.length - 1].y;
    let i = 0;
    while (i < pts.length - 1 && pts[i + 1].x < x) i++;
    const p0 = pts[Math.max(0, i - 1)];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[Math.min(pts.length - 1, i + 2)];
    const t = (x - p1.x) / ((p2.x - p1.x) + 0.0001);
    return this.catmullRom(p0.y, p1.y, p2.y, p3.y, t);
  }
  calcularLUT(canal) {
    const pts = this.puntosOrdenados(canal);
    const lut = new Uint8ClampedArray(256);
    for (let x = 0; x < 256; x++) lut[x] = Math.round(this.evaluarCurva(pts, x));
    return lut;
  }
  calcularTodasLUT() {
    return { master: this.calcularLUT('master'), r: this.calcularLUT('r'), g: this.calcularLUT('g'), b: this.calcularLUT('b') };
  }
  redibujar() {
    const ctx = this.ctx, w = this.ancho, h = this.alto;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#141414';
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    for (let i = 0; i <= 4; i++) {
      const gx = this.margen + (i / 4) * (w - this.margen * 2);
      const gy = this.margen + (i / 4) * (h - this.margen * 2);
      ctx.beginPath(); ctx.moveTo(gx, this.margen); ctx.lineTo(gx, h - this.margen); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(this.margen, gy); ctx.lineTo(w - this.margen, gy); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.moveTo(this.xAPixel(0), this.yAPixel(0)); ctx.lineTo(this.xAPixel(255), this.yAPixel(255)); ctx.stroke();
    const orden = ['r', 'g', 'b', 'master'].filter(c => c !== this.canalActivo);
    orden.push(this.canalActivo);
    for (const canal of orden) {
      const pts = this.puntosOrdenados(canal);
      const activo = canal === this.canalActivo;
      ctx.strokeStyle = this.colores[canal];
      ctx.globalAlpha = activo ? 1 : 0.25;
      ctx.lineWidth = activo ? 2 : 1;
      ctx.beginPath();
      for (let x = 0; x <= 255; x++) {
        const y = this.evaluarCurva(pts, x);
        const px = this.xAPixel(x), py = this.yAPixel(y);
        if (x === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
      if (activo) {
        for (const p of pts) {
          ctx.beginPath();
          ctx.arc(this.xAPixel(p.x), this.yAPixel(p.y), this.radioPunto, 0, Math.PI * 2);
          ctx.fillStyle = '#0b0b0b'; ctx.fill();
          ctx.lineWidth = 2; ctx.strokeStyle = this.colores[canal]; ctx.stroke();
        }
      }
    }
  }
}

class GestorFiltros {
  constructor(app) {
    this.app = app;
    this.fxCanvas = null;
    this.algoritmos = new AlgoritmosColor();
    this.ruido = new RuidoSimplex();
    try { this.fxCanvas = fx.canvas(); } catch (err) { this.fxCanvas = null; }
  }
  obtenerCapa() { return this.app.capaActiva; }
  aplicarFiltroCss(cadenaFiltro) {
    const capa = this.obtenerCapa();
    if (!capa) return;
    this.app.guardarHistorial();
    const temp = document.createElement('canvas');
    temp.width = capa.ancho;
    temp.height = capa.alto;
    const tctx = temp.getContext('2d');
    tctx.filter = cadenaFiltro;
    tctx.drawImage(capa.canvas, 0, 0);
    capa.ctx.clearRect(0, 0, capa.ancho, capa.alto);
    capa.ctx.drawImage(temp, 0, 0);
    this.app.renderizar();
  }
  aplicarGLFX(nombre, params) {
    const capa = this.obtenerCapa();
    if (!capa || !this.fxCanvas) { alert('GLFX no disponible (revisa tu conexión a internet)'); return; }
    this.app.guardarHistorial();
    const w = capa.ancho, h = capa.alto;
    const textura = this.fxCanvas.texture(capa.canvas);
    let pipeline = this.fxCanvas.draw(textura);
    if (nombre === 'brillo_contraste') pipeline.brightnessContrast(params.brillo, params.contraste);
    else if (nombre === 'matiz_saturacion') pipeline.hueSaturation(params.matiz, params.saturacion);
    else if (nombre === 'vivacidad') pipeline.vibrance(params.cantidad);
    else if (nombre === 'reducir_ruido') pipeline.denoise(params.exponente);
    else if (nombre === 'enfocar') pipeline.unsharpMask(params.radio, params.fuerza);
    else if (nombre === 'ruido') pipeline.noise(params.cantidad);
    else if (nombre === 'sepia') pipeline.sepia(params.cantidad);
    else if (nombre === 'vineta') pipeline.vignette(params.tamano, params.cantidad);
    else if (nombre === 'desenfoque_zoom') pipeline.zoomBlur(w / 2, h / 2, params.fuerza);
    else if (nombre === 'desenfoque_triangular') pipeline.triangleBlur(params.radio);
    else if (nombre === 'tilt_shift') pipeline.tiltShift(0, h / 2, w, h / 2, params.desenfoque, params.gradiente);
    else if (nombre === 'remolino') pipeline.swirl(w / 2, h / 2, params.radio, params.angulo);
    else if (nombre === 'burbuja') pipeline.bulgePinch(w / 2, h / 2, params.radio, params.fuerza);
    else if (nombre === 'tinta') pipeline.ink(params.fuerza);
    else if (nombre === 'pixelado_hex') pipeline.hexagonalPixelate(w / 2, h / 2, params.escala);
    else if (nombre === 'pantalla_puntos') pipeline.dotScreen(w / 2, h / 2, params.angulo, params.tamano);
    else return;
    pipeline.update();
    capa.ctx.clearRect(0, 0, w, h);
    capa.ctx.drawImage(this.fxCanvas, 0, 0);
    this.app.renderizar();
  }
  aplicarCurvas(editorCurvas) {
    const capa = this.obtenerCapa();
    if (!capa) return;
    this.app.guardarHistorial();
    const luts = editorCurvas.calcularTodasLUT();
    const datos = capa.ctx.getImageData(0, 0, capa.ancho, capa.alto);
    const d = datos.data;
    for (let i = 0; i < d.length; i += 4) {
      d[i] = luts.r[luts.master[d[i]]];
      d[i + 1] = luts.g[luts.master[d[i + 1]]];
      d[i + 2] = luts.b[luts.master[d[i + 2]]];
    }
    capa.ctx.putImageData(datos, 0, 0);
    this.app.renderizar();
  }
  aplicarAlgoritmo(nombreMetodo, ...args) {
    const capa = this.obtenerCapa();
    if (!capa) return;
    this.app.guardarHistorial();
    let datos = capa.ctx.getImageData(0, 0, capa.ancho, capa.alto);
    datos = this.algoritmos[nombreMetodo](datos, ...args);
    capa.ctx.putImageData(datos, 0, 0);
    this.app.renderizar();
  }
  
  aplicarMejorarcolor3dmesh() {
    const capa = this.obtenerCapa();
    if (!capa) return;
    this.app.guardarHistorial();
    const w = capa.ancho, h = capa.alto;   
    let datos = capa.ctx.getImageData(0, 0, w, h);
    datos = this.algoritmos.mejorarcolor3dmesh(datos );
    capa.ctx.putImageData(datos, 0, 0);
    this.app.renderizar();
  }
  aplicarGradienteBlanco(vluemenosamas, saturation) {
    const capa = this.obtenerCapa();
    if (!capa) return;
    this.app.guardarHistorial();
    const w = capa.ancho, h = capa.alto;
    const aux = document.createElement('canvas');
    aux.width = w; aux.height = h;
    const actx = aux.getContext('2d');
    const grad = actx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) / 2);
    grad.addColorStop(0, 'white');
    grad.addColorStop(1, 'black');
    actx.fillStyle = grad;
    actx.fillRect(0, 0, w, h);
    const datosBlanco = actx.getImageData(0, 0, w, h);
    let datos = capa.ctx.getImageData(0, 0, w, h);
    datos = this.algoritmos.ftilelimites(datos, datosBlanco, vluemenosamas, saturation);
    capa.ctx.putImageData(datos, 0, 0);
    this.app.renderizar();
  }
  generarNormalMap(bias, strength, invertir, usarR, usarG) {
    const capa = this.obtenerCapa();
    if (!capa) return;
    this.app.guardarHistorial();
    const w = capa.ancho, h = capa.alto;
    const datos = capa.ctx.getImageData(0, 0, w, h);
    const data = datos.data;
    const nueva = new Uint8ClampedArray(data.length);
    const getRed = (x, y) => { if (x < 0 || x >= w || y < 0 || y >= h) return 0; return data[(y * w + x) * 4]; };
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = (y * w + x) * 4;
        const d1 = getRed(x + 1, y) / 255, d2 = getRed(x - 1, y) / 255;
        const d3 = getRed(x, y + 1) / 255, d4 = getRed(x, y - 1) / 255;
        const dx = (d2 - d1) * strength * (invertir ? -1 : 1);
        const dy = (d4 - d3) * strength * (invertir ? -1 : 1);
        const dz = 1 / Math.max(bias, 0.01);
        const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
        nueva[idx] = usarR ? Math.floor((dx / len * 0.5 + 0.5) * 255) : data[idx];
        nueva[idx + 1] = usarG ? Math.floor((dy / len * 0.5 + 0.5) * 255) : data[idx + 1];
        nueva[idx + 2] = Math.floor((dz / len * 0.5 + 0.5) * 255);
        nueva[idx + 3] = 255;
      }
    }
    capa.ctx.putImageData(new ImageData(nueva, w, h), 0, 0);
    this.app.renderizar();
  }
  mejorarImagen() {
    const capa = this.obtenerCapa();
    if (!capa) return;
    this.app.guardarHistorial();
    const escala = 2;
    const temp = document.createElement('canvas');
    temp.width = capa.ancho * escala;
    temp.height = capa.alto * escala;
    const tctx = temp.getContext('2d');
    tctx.imageSmoothingEnabled = true;
    tctx.imageSmoothingQuality = 'high';
    tctx.filter = 'contrast(110%) brightness(105%) saturate(110%)';
    tctx.drawImage(capa.canvas, 0, 0, temp.width, temp.height);
    capa.redimensionar(temp.width, temp.height);
    capa.ctx.clearRect(0, 0, capa.ancho, capa.alto);
    capa.ctx.drawImage(temp, 0, 0);
    this.app.renderizar();
  }
  centrarEIncrustar() {
    const capa = this.obtenerCapa();
    if (!capa) return;
    const resolucion = parseInt(prompt('Resolución de salida:', '2048')) || 2048;
    const margen = parseInt(prompt('Margen de centrado (px):', '45')) || 45;
    const esBlanco = confirm('¿Fondo blanco? (Cancelar = negro)');
    this.app.guardarHistorial();
    const temp = document.createElement('canvas');
    temp.width = resolucion; temp.height = resolucion;
    const tctx = temp.getContext('2d');
    tctx.fillStyle = esBlanco ? '#ffffff' : '#000000';
    tctx.fillRect(0, 0, resolucion, resolucion);
    const anchoActual = capa.ancho, altoActual = capa.alto;
    const maxDim = resolucion - margen * 2;
    let escaladoAncho, escaladoAlto;
    if (anchoActual > altoActual) { escaladoAncho = maxDim; escaladoAlto = altoActual * maxDim / anchoActual; }
    else { escaladoAlto = maxDim; escaladoAncho = anchoActual * maxDim / altoActual; }
    const x = (resolucion - escaladoAncho) / 2;
    const y = (resolucion - escaladoAlto) / 2;
    tctx.drawImage(capa.canvas, x, y, escaladoAncho, escaladoAlto);
    capa.redimensionar(resolucion, resolucion);
    capa.x = 0; capa.y = 0;
    capa.ctx.clearRect(0, 0, resolucion, resolucion);
    capa.ctx.drawImage(temp, 0, 0);
    this.app.renderizar();
  }
  async removerFondoIA(elementoEstado) {
    const capa = this.obtenerCapa();
    if (!capa || !window.removeBackground) { alert('IA no disponible (revisa tu conexión)'); return; }
    if (elementoEstado) { elementoEstado.style.display = 'block'; elementoEstado.textContent = 'Procesando remoción de fondo...'; }
    this.app.guardarHistorial();
    try {
      const blob = await window.removeBackground(capa.canvas.toDataURL());
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        capa.ctx.clearRect(0, 0, capa.ancho, capa.alto);
        capa.ctx.drawImage(img, 0, 0, capa.ancho, capa.alto);
        this.app.renderizar();
        if (elementoEstado) { elementoEstado.textContent = 'Fondo removido'; setTimeout(() => elementoEstado.style.display = 'none', 2000); }
      };
      img.src = url;
    } catch (err) {
      alert('Error removiendo fondo: ' + err.message);
      if (elementoEstado) elementoEstado.style.display = 'none';
    }
  }
  generarOxido(cantidad, fuerza, escala, ruido) {
    const capa = this.obtenerCapa();
    if (!capa) return;
    this.app.guardarHistorial();
    const w = capa.ancho, h = capa.alto;
    capa.ctx.fillStyle = '#686C70';
    capa.ctx.fillRect(0, 0, w, h);
    const imageData = capa.ctx.getImageData(0, 0, w, h);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
      const x = (i / 4) % w, y = Math.floor((i / 4) / w);
      const n1 = ruido.ruido2D(x / escala, y / escala);
      const n2 = ruido.ruido2D(x / (escala / 2), y / (escala / 2));
      const noiseVal = (n1 + n2) / 2;
      if (noiseVal > 1 - cantidad) {
        const factor = Math.min((noiseVal - (1 - cantidad)) * (1 / cantidad) * (fuerza * 4), 1);
        data[i] = data[i] + (122 - data[i]) * factor;
        data[i + 1] = data[i + 1] + (58 - data[i + 1]) * factor;
        data[i + 2] = data[i + 2] + (13 - data[i + 2]) * factor;
      }
    }
    capa.ctx.putImageData(imageData, 0, 0);
    this.app.renderizar();
  }
  generarRoca(escala, fuerza, ruido) {
    const capa = this.obtenerCapa();
    if (!capa) return;
    this.app.guardarHistorial();
    const w = capa.ancho, h = capa.alto;
    const imageData = capa.ctx.createImageData(w, h);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
      const x = (i / 4) % w, y = Math.floor((i / 4) / w);
      let noiseVal = 0, amp = 1, freq = escala / 1000;
      for (let j = 0; j < 4; j++) { noiseVal += ruido.ruido2D(x * freq, y * freq) * amp; amp *= 0.5; freq *= 2; }
      noiseVal = (noiseVal + 1) / 2;
      const color = Math.min(255, Math.max(0, 255 * Math.pow(noiseVal, fuerza)));
      data[i] = color; data[i + 1] = color; data[i + 2] = color; data[i + 3] = 255;
    }
    capa.ctx.putImageData(imageData, 0, 0);
    this.app.renderizar();
  }
  generarLadrillos(anchoLadrillo, altoLadrillo, espaciado, varColor) {
    const capa = this.obtenerCapa();
    if (!capa) return;
    this.app.guardarHistorial();
    const w = capa.ancho, h = capa.alto;
    const ctx = capa.ctx;
    ctx.fillStyle = '#888888';
    ctx.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += altoLadrillo + espaciado) {
      for (let x = -anchoLadrillo; x < w + anchoLadrillo; x += anchoLadrillo + espaciado) {
        const offsetX = (Math.floor(y / (altoLadrillo + espaciado)) % 2) * (anchoLadrillo / 2);
        const r = Math.min(255, Math.max(0, 150 - Math.random() * 255 * varColor));
        const g = Math.min(255, Math.max(0, 70 - Math.random() * 255 * varColor));
        const b = Math.min(255, Math.max(0, 50 - Math.random() * 255 * varColor));
        ctx.fillStyle = `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)})`;
        ctx.fillRect(x - offsetX, y, anchoLadrillo, altoLadrillo);
      }
    }
    this.app.renderizar();
  }
  generarMadera(escalaVeta, distorsion, fuerzaAnillos, ruido) {
    const capa = this.obtenerCapa();
    if (!capa) return;
    this.app.guardarHistorial();
    const w = capa.ancho, h = capa.alto;
    const imageData = capa.ctx.createImageData(w, h);
    const data = imageData.data;
    const wood1 = { r: 139, g: 69, b: 19 }, wood2 = { r: 193, g: 154, b: 107 };
    for (let i = 0; i < data.length; i += 4) {
      const x = (i / 4) % w, y = Math.floor((i / 4) / w);
      const yStretched = y * escalaVeta;
      const xDistort = x + ruido.ruido2D(x / (distorsion * 2), y / (distorsion * 2)) * distorsion;
      const noiseVal = ruido.ruido2D(xDistort / 100, yStretched / 100);
      const ringVal = 0.5 + 0.5 * Math.sin((noiseVal * 10 + y / 20) * Math.PI);
      const finalVal = Math.pow(ringVal, fuerzaAnillos);
      data[i] = wood1.r + (wood2.r - wood1.r) * finalVal;
      data[i + 1] = wood1.g + (wood2.g - wood1.g) * finalVal;
      data[i + 2] = wood1.b + (wood2.b - wood1.b) * finalVal;
      data[i + 3] = 255;
    }
    capa.ctx.putImageData(imageData, 0, 0);
    this.app.renderizar();
  }
}

AplicacionPaint.prototype.mezclarCapas = function(modo, opacidad = 1.0) {
  if (this.indiceActiva <= 0) {
    alert('Select a layer that has another layer below');
    return;
  }
  
  const capaSuperior = this.capas[this.indiceActiva];
  const capaInferior = this.capas[this.indiceActiva - 1];
  
  this.guardarHistorial();
  
  const mezclador = new ModosMezcla({ modo, opacidad });
  const nuevaCapa = mezclador.aplicarACapa(capaSuperior, capaInferior, modo, opacidad);
  
  if (nuevaCapa) {
    this.capas.splice(this.indiceActiva + 1, 0, nuevaCapa);
    this.indiceActiva = this.indiceActiva + 1;
    this.actualizarPanelCapas();
    this.renderizar();
  }
};


class Ajustecss{

    static aplicarClaseATag=(tag, claseCSS)=> {
    
    const elementos = document.querySelectorAll(tag);
 
    elementos.forEach(elemento => { 
        const clases = claseCSS.split(' ');
        elemento.classList.add(...clases);
    });

    console.log(`Se aplicó la clase "${claseCSS}" a ${elementos.length} elementos <${tag}>.`);
}
}
window.addEventListener('load', () => {
    Ajustecss.aplicarClaseATag('button', 'btnCl');
 
});
