    initContextMenu() {
        const menu = this.ctxMenu;

        document.getElementById('ctx-copy').onclick = async () => {
            menu.style.display = 'none';
            await this.app.clipboard.copy(this.app.layers.getActiveLayer(), this.app.selection);
        };

        document.getElementById('ctx-cut').onclick = async () => {
            menu.style.display = 'none';
            const act = this.app.layers.getActiveLayer();
            if (act) {
                const before = act.getSnapshot();
                await this.app.clipboard.cut(act, this.app.selection);
                const after = act.getSnapshot();
                this.app.history.push({
                    undo: () => act.restoreSnapshot(before),
                    redo: () => act.restoreSnapshot(after)
                });
            }
        };

        document.getElementById('ctx-paste').onclick = () => {
            menu.style.display = 'none';
            if (this.app.clipboard.buffer) {
                this.app.pegarComoNuevaCapa(this.app.clipboard.buffer, 'Trozo Copiado');
            }
        };

        document.getElementById('ctx-save-png').onclick = () => {
            menu.style.display = 'none';
            ProjectExporter.exportImage(this.app.layers, 'png');
        };

        document.getElementById('ctx-save-jpg').onclick = () => {
            menu.style.display = 'none';
            ProjectExporter.exportImage(this.app.layers, 'jpg');
        };

        document.getElementById('ctx-fit-piece').onclick = () => {
            menu.style.display = 'none';
            this.app.ajustarCanvasACapaActiva();
        };

        document.getElementById('ctx-clone-origin').onclick = () => {
            menu.style.display = 'none';
            this.app.tools.fijarOrigenClonacion(this.app.contextCoords.x, this.app.contextCoords.y);
        };

        document.getElementById('ctx-eyedrop').onclick = () => {
            menu.style.display = 'none';
            this.app.tools.sampleColor(this.app.contextCoords.x, this.app.contextCoords.y);
        };

        document.getElementById('ctx-deselect').onclick = () => {
            menu.style.display = 'none';
            this.app.selection.clear();
        };

        window.addEventListener('click', (e) => {
            if (!menu.contains(e.target)) menu.style.display = 'none';
        });
    }

    showContextMenu(screenX, screenY, isCloneTool) {
        const cloneOpt = document.getElementById('ctx-clone-origin');
        if (cloneOpt) {
            cloneOpt.style.display = isCloneTool ? 'flex' : 'none';
        }

        const posX = Math.min(screenX, window.innerWidth - 230);
        const posY = Math.min(screenY, window.innerHeight - 260);

        this.ctxMenu.style.left = posX + 'px';
        this.ctxMenu.style.top = posY + 'px';
        this.ctxMenu.style.display = 'block';
    }

    hideContextMenu() {
        if (this.ctxMenu) this.ctxMenu.style.display = 'none';
    }
}


class EffectsManager {
    constructor(app) {
        this.app = app;

        // Fuentes temporales compartidas o dinámicas
        this.curveSourceCanvas = null;
        this.pixelArtSourceCanvas = null;
        this.glfxSourceCanvas = null;

        this.initBackgroundRemover();
        this.initGLFX();
        this.initPixelArt();
        this.initCurves();
        this.initBGRMPipeline();
        this.initToolPanels();
    }

    /* ========================================================
       1. REMOVEDOR DE FONDO SIMPLE (IA)
       ======================================================== */
    initBackgroundRemover() {
        this.bgRemover = new BackgroundRemover({
            keepTransparency: true,
            onStart: () => this.app.ui.setHUD(' Removiendo fondo con IA...'),
            onProgress: (pct) => this.app.ui.setHUD(`Modelo IA: ${pct}%`),
            onFinish: ({ canvas }) => {
                const act = this.app.layers.getActiveLayer();
                if (!act) return;
                const before = act.getSnapshot();
                act.ctx.clearRect(0, 0, act.width, act.height);
                act.ctx.drawImage(canvas, 0, 0);
                const after = act.getSnapshot();

                this.app.history.push({
                    undo: () => { act.restoreSnapshot(before); this.app.ajustarCanvasACapaActiva(); },
                    redo: () => { act.restoreSnapshot(after); this.app.ajustarCanvasACapaActiva(); }
                });

                this.app.ajustarCanvasACapaActiva();
                this.app.ui.setHUD('Background successfully removed');
            },
            onError: (err) => {
                alert('Error removing background: ' + err.message);
                this.app.ui.setHUD('✕ Error removing background');
            }
        });
    }

    /* ========================================================
       2. WEBGL GLFX
       ======================================================== */
    initGLFX() {
        this.glfxEngine = new GLFXEngine();
        this.glfxActive = false;
        this.glfxOriginalSnapshot = null;

        this.glfxEngine.onRender = (filteredCanvas) => {
            const act = this.app.layers.getActiveLayer();
            if (!act || !this.glfxActive) return;
            act.ctx.clearRect(0, 0, act.width, act.height);
            act.ctx.drawImage(filteredCanvas, 0, 0);
        };

        this.glfxUI = new GLFXUI(this.glfxEngine, {
            title: 'Filtros WebGL & Efectos',
            x: 76, y: 60, floating: true,
            onApply: () => {
                const act = this.app.layers.getActiveLayer();
                if (!act || !this.glfxOriginalSnapshot) return;
                const before = this.glfxOriginalSnapshot;
                const after = act.getSnapshot();
                this.app.history.push({
                    undo: () => { act.restoreSnapshot(before); this.app.ajustarCanvasACapaActiva(); },
                    redo: () => { act.restoreSnapshot(after); this.app.ajustarCanvasACapaActiva(); }
                });
                this.glfxOriginalSnapshot = after;
                this.glfxActive = false;
                this.glfxUI.panel.close();
                this.app.ui.setHUD('✓ Filtro aplicado definitivamente');
            }
        });

        const prevClose = this.glfxUI.panel.onCloseCallback;
        this.glfxUI.panel.onCloseCallback = (p) => {
            if (prevClose) prevClose(p);
            if (this.glfxActive && this.glfxOriginalSnapshot) {
                const act = this.app.layers.getActiveLayer();
                if (act) act.restoreSnapshot(this.glfxOriginalSnapshot);
                this.glfxActive = false;
            }
        };

        this.glfxUI.panel.element.querySelector('.ui-btn-danger').onclick = () => {
            if (this.glfxOriginalSnapshot) {
                const act = this.app.layers.getActiveLayer();
                if (act) act.restoreSnapshot(this.glfxOriginalSnapshot);
                this.glfxEngine.reset();
            }
        };
        this.glfxUI.panel.close();
    }

    /* ========================================================

       ======================================================== */
    initBGRMPipeline() {
        this.bgrmPipeline = new BGRMPipeline();
        this.bgrmActive = false;
        this.bgrmOriginalSnapshot = null;

        this.bgrmUI = new uiBGRMPipeline(this.bgrmPipeline, {
            title: 'AI Background Remover',
            x: 80, y: 80, floating: true,
            onRender: (filteredCanvas) => {
                const act = this.app.layers.getActiveLayer();
                if (!act || !this.bgrmActive) return;
                act.ctx.clearRect(0, 0, act.width, act.height);
                act.ctx.drawImage(filteredCanvas, 0, 0);
            },
            onApply: () => {
                const act = this.app.layers.getActiveLayer();
                if (!act || !this.bgrmOriginalSnapshot) return;
                const before = this.bgrmOriginalSnapshot;
                const after = act.getSnapshot();
                this.app.history.push({
                    undo: () => { act.restoreSnapshot(before); this.app.ajustarCanvasACapaActiva(); },
                    redo: () => { act.restoreSnapshot(after); this.app.ajustarCanvasACapaActiva(); }
                });
                this.bgrmOriginalSnapshot = after;
                this.bgrmActive = false;
                this.bgrmUI.panel.close();
                this.app.ajustarCanvasACapaActiva();
            },
            onReset: () => {
                const act = this.app.layers.getActiveLayer();
                if (act && this.bgrmOriginalSnapshot) act.restoreSnapshot(this.bgrmOriginalSnapshot);
            }
        });

        const prevClose = this.bgrmUI.panel.onCloseCallback;
        this.bgrmUI.panel.onCloseCallback = (p) => {
            if (prevClose) prevClose(p);
            if (this.bgrmActive && this.bgrmOriginalSnapshot) {
                const act = this.app.layers.getActiveLayer();
                if (act) act.restoreSnapshot(this.bgrmOriginalSnapshot);
                this.bgrmActive = false;
                this.app.ajustarCanvasACapaActiva();
            }
        };
        this.bgrmUI.panel.close();
    }

    /* ========================================================
       6. PANELES SECUNDARIOS
       ======================================================== */
    initToolPanels() {
        this.brushTipUI = new BrushTipMakerUI(this.app.brush, {
            title: 'Brush Generator', x: 80, y: 80, floating: true,
            onApply: () => this.brushTipUI.panel.close()
        });
        this.brushTipUI.panel.close();

        this.brushDynamicsUI = new BrushDynamicsUI(this.app.brush, {
            title: 'Dynamic Brush Settings', x: 80, y: 120, floating: true
        });

        this.projectStorageUI = new ProjectStorageUI(this.app, {
            title: 'Gestor de Proyectos', x: 80, y: 80, floating: true
        });
        this.projectStorageUI.panel.close();
    }

    /* ========================================================
       MÉTODOS DE APERTURA / ACCIÓN
       ======================================================== */
    abrirFiltrosGLFX() {
        const act = this.app.layers.getActiveLayer();
        if (!act) return alert('No hay capa activa');

        this.glfxOriginalSnapshot = act.getSnapshot();
        this.glfxActive = true;

        if (!this.glfxSourceCanvas) this.glfxSourceCanvas = document.createElement('canvas');
        this.glfxSourceCanvas.width = act.width;
        this.glfxSourceCanvas.height = act.height;
        const sctx = this.glfxSourceCanvas.getContext('2d');
        sctx.clearRect(0, 0, act.width, act.height);
        sctx.drawImage(act.canvas, 0, 0);

        this.glfxEngine.setSource(this.glfxSourceCanvas);
        this.glfxUI.panel.open();
        this.app.ui.setHUD('Modo Filtros: Vista previa en tiempo real activa');
    }

    abrirPixelArt() {
        const act = this.app.layers.getActiveLayer();
        if (!act) return alert('No hay capa activa');

        this.pixelArtOriginalSnapshot = act.getSnapshot();
        this.pixelArtActive = true;

        if (!this.pixelArtSourceCanvas) this.pixelArtSourceCanvas = document.createElement('canvas');
        this.pixelArtSourceCanvas.width = act.width;
        this.pixelArtSourceCanvas.height = act.height;
        const sctx = this.pixelArtSourceCanvas.getContext('2d');
        sctx.clearRect(0, 0, act.width, act.height);
        sctx.drawImage(act.canvas, 0, 0);

        this.pixelArtEngine.setSource(this.pixelArtSourceCanvas);
        this.pixelArtUI.panel.open();
    }

    abrirCurvasRGBA() {
        const act = this.app.layers.getActiveLayer();
        if (!act) return alert('No hay capa activa');

        this.curveOriginalSnapshot = act.getSnapshot();
        this.curveActive = true;

        if (!this.curveSourceCanvas) this.curveSourceCanvas = document.createElement('canvas');
        this.curveSourceCanvas.width = act.width;
        this.curveSourceCanvas.height = act.height;
        const sctx = this.curveSourceCanvas.getContext('2d');
        sctx.clearRect(0, 0, act.width, act.height);
        sctx.drawImage(act.canvas, 0, 0);

        this.curveEngine.setSource(this.curveSourceCanvas);
        this.curveUI.panel.open();
    }

    abrirBGRMPipeline() {
        const act = this.app.layers.getActiveLayer();
        if (!act) return alert('No hay capa activa');

        this.bgrmOriginalSnapshot = act.getSnapshot();
        this.bgrmActive = true;

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = act.width;
        tempCanvas.height = act.height;
        tempCanvas.getContext('2d').drawImage(act.canvas, 0, 0);

        this.bgrmUI.process(tempCanvas);
    }
}




class InputController {
    constructor(app) {
        this.app = app;
        this.isSpacePressed = false;
        this.bindEvents();
    }

    bindEvents() {
        // Menú Contextual en Click Derecho
        window.addEventListener('contextmenu', (e) => {
            if (e.target.closest('#canvas-stage')) {
                e.preventDefault();
                if (this.app.tools.currentTool === 'cad') return;

                this.app.contextCoords = this.app.zoom.screenToWorld(e.clientX, e.clientY);
                this.app.ui.showContextMenu(e.clientX, e.clientY, this.app.tools.currentTool === 'clone');
            }
        });

        // Drag & Drop de imágenes
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                if (file.type.startsWith('image/')) {
                    const img = new Image();
                    img.onload = () => this.app.pegarComoNuevaCapa(img, file.name.replace(/\.[^/.]+$/, ""));
                    img.src = URL.createObjectURL(file);
                }
            }
        });

        // Pegar imagen del portapapeles nativo (Ctrl + V)
        window.addEventListener('paste', async (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
            let pastedImage = false;

            if (items) {
                for (let item of items) {
                    if (item.type.indexOf('image') !== -1) {
                        const blob = item.getAsFile();
                        if (blob) {
                            pastedImage = true;
                            e.preventDefault();
                            const img = new Image();
                            img.onload = () => this.app.pegarComoNuevaCapa(img, 'Trozo Pegado');
                            img.src = URL.createObjectURL(blob);
                            return;
                        }
                    }
                }
            }
            if (!pastedImage && this.app.clipboard.buffer) {
                e.preventDefault();
                this.app.pegarComoNuevaCapa(this.app.clipboard.buffer, 'Trozo Pegado');
            }
        });

        // Atajos de teclado
        window.addEventListener('keydown', (e) => this.handleKeyDown(e));
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                this.isSpacePressed = false;
                this.app.ui.setCursor('crosshair');
                this.app.zoom.endPan();
            }
        });

        // Puntero / Dibujo / Navegación
        this.app.ui.stage.addEventListener('pointerdown', (e) => {
            this.app.ui.hideContextMenu();
            if (this.isSpacePressed || e.button === 1) {
                this.app.zoom.startPan(e.clientX, e.clientY);
                return;
            }
            const coords = this.app.zoom.screenToWorld(e.clientX, e.clientY);
            this.app.tools.pointerDown(coords.x, coords.y, e);
        });

        window.addEventListener('pointermove', (e) => {
            if (this.app.zoom.isPanning) {
                this.app.zoom.pan(e.clientX, e.clientY);
                return;
            }
            const coords = this.app.zoom.screenToWorld(e.clientX, e.clientY);
            this.app.tools.pointerMove(coords.x, coords.y);
        });

        window.addEventListener('pointerup', (e) => {
            if (this.app.zoom.isPanning) {
                this.app.zoom.endPan();
                return;
            }
            const coords = this.app.zoom.screenToWorld(e.clientX, e.clientY);
            this.app.tools.pointerUp(coords.x, coords.y);
        });
    }

    async handleKeyDown(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        if (e.code === 'Space' && !this.isSpacePressed) {
            this.isSpacePressed = true;
            this.app.ui.setCursor('grab');
        }
        if (e.code === 'Enter' && this.app.tools.currentTool === 'cad') {
            e.preventDefault();
            const act = this.app.layers.getActiveLayer();
            if (act) {
                this.app.tools.onStrokeStart(act);
                this.app.cad.bakeToLayer(act);
                this.app.cad.clearAll();
                this.app.tools.onStrokeFinished(act);
            }
            return;
        }
        if (e.ctrlKey && (e.code === 'KeyC' || e.key === 'c' || e.key === 'C')) {
            e.preventDefault();
            await this.app.clipboard.copy(this.app.layers.getActiveLayer(), this.app.selection);
        }
        if (e.ctrlKey && (e.code === 'KeyX' || e.key === 'x' || e.key === 'X')) {
            e.preventDefault();
            const act = this.app.layers.getActiveLayer();
            if (act) await this.app.clipboard.cut(act, this.app.selection);
        }
      // DESHACER: Ctrl + Z (sin Shift)
        if (e.ctrlKey && (e.code === 'KeyZ' || e.key === 'z' || e.key === 'Z') && !e.shiftKey) {
            e.preventDefault();
            this.app.history.undo();
            return;
        }

        // REHACER: Ctrl + Y  O  Ctrl + Shift + Z
        const isRedo = (e.ctrlKey && (e.code === 'KeyY' || e.key === 'y' || e.key === 'Y')) ||
                       (e.ctrlKey && e.shiftKey && (e.code === 'KeyZ' || e.key === 'z' || e.key === 'Z'));

        if (isRedo) {
            e.preventDefault();
            this.app.history.redo();
            return;
        }
        if (e.key === 'Escape') {
            e.preventDefault();
            this.app.tools.cancelSelection();
            if (this.app.cad) this.app.cad.clearAll();
            this.app.ui.hideContextMenu();
        }
        if (e.key === 'q' || e.key === 'Q') {
            e.preventDefault();
            this.app.ajustarCanvasACapaActiva();
        }
        if (e.key === 'w' || e.key === 'W') {
            e.preventDefault();
            this.app.adaptarCapaActivaAlCanvas();
        }

        // Selección rápida de herramientas
        if (e.key === 'g' || e.key === 'G') this.app.setActiveTool('fill');
        if (e.key === 'b' || e.key === 'B') this.app.setActiveTool('brush');
        if (e.key === 'e' || e.key === 'E') this.app.setActiveTool('eraser');
        if (e.key === 'c' && !e.ctrlKey) this.app.setActiveTool('clone');
        if (e.key === 'm' || e.key === 'M') this.app.setActiveTool('move');
    }
}





 class ApplicationAdapter {
    constructor() {
        this.initialCanvasWidth = 1024;
        this.initialCanvasHeight = 768;
        this.defaultWidth = 1024;
        this.defaultHeight = 768;
        this.isInternalColorSync = false;
        this.preStrokeState = null;
        this.contextCoords = { x: 0, y: 0 };

        // 1. Iniciar motores base
        this.initCoreEngines();

        // 2. Interfaz de Usuario
        this.ui = new ApplicationUI(this);

        // 3. Módulos especializados
        this.effects = new EffectsManager(this);
        this.input = new InputController(this);

        // 4. Sincronizar y configurar capa inicial
        this.syncInteractiveCanvases(this.defaultWidth, this.defaultHeight);
        this.layers.createLayer('Fondo', this.defaultWidth, this.defaultHeight);
        requestAnimationFrame(() => this.ajustarCanvasACapaActiva());
    }

    initCoreEngines() {
        const stageEl = document.getElementById('canvas-stage');
        const targetEl = document.getElementById('viewport-transform');
        const layersEl = document.getElementById('layers-render-target');
        const cadCanvas = document.getElementById('cad-vector-canvas');
        const selectionCanvas = document.getElementById('selection-canvas');
        const previewCanvas = document.getElementById('preview-canvas');

        this.zoom = new CanvasZoomManager({
            container: stageEl,
            target: targetEl,
            onTransformChange: (scale) => {
                if (this.ui) this.ui.setHUD(`Zoom: ${(scale * 100).toFixed(0)}% | Q: Adaptar Trozo`);
            }
        });

        this.history = new HistoryManager({ onStateChange: () => {} });

        this.layers = new LayerStackEngine({
            defaultWidth: this.defaultWidth,
            defaultHeight: this.defaultHeight,
            renderContainer: layersEl,
            onStackChanged: (list, activeId) => {
                if (this.ui && this.ui.reorderList) {
                    this.ui.reorderList.setItems(list.map(l => ({
                        id: l.id, name: l.name, visible: l.visible, opacity: l.opacity
                    })), list.findIndex(l => l.id === activeId));
                }
            }
        });

        this.brush = new BrushSettingsEngine({
            onSettingsChange: (k, v) => {
                if (k === 'mainColor' && this.ui?.colorPicker && !this.isInternalColorSync) {
                    this.isInternalColorSync = true;
                    this.ui.colorPicker.setHex(v);
                    this.isInternalColorSync = false;
                }
            }
        });

        this.selection = new SelectionManager({ selectionCanvas });
        this.clipboard = new ClipboardManager();
        this.cad = new CadVectorEngine({ canvas: cadCanvas, brushEngine: this.brush });

        this.tools = new ToolManager({
            previewCanvas,
            layerStackEngine: this.layers,
            brushSettingsEngine: this.brush,
            selectionManager: this.selection,
            cadEngine: this.cad,
            onColorSampled: (hex) => {
                this.isInternalColorSync = true;
                this.brush.set('mainColor', hex, true);
                if (this.ui?.colorPicker) this.ui.colorPicker.setHex(hex);
                this.isInternalColorSync = false;
            },
            onStrokeStart: (layer) => { this.preStrokeState = layer.getSnapshot(); },
            onStrokeFinished: (layer) => {
                if (!this.preStrokeState) return;
                const before = this.preStrokeState;
                const after = layer.getSnapshot();
                const targetLayer = layer;
                this.history.push({
                    undo: () => targetLayer.restoreSnapshot(before),
                    redo: () => targetLayer.restoreSnapshot(after)
                });
                this.preStrokeState = null;
            }
        });
    }

    syncInteractiveCanvases(w, h) {
        if (this.ui) this.ui.syncInteractiveCanvases(w, h);
        if (this.cad) this.cad.setSize(w, h);
        if (this.selection) this.selection.setSize(w, h);
    }

    setActiveTool(toolId) {
        this.tools.setTool(toolId);
        this.ui.setActiveToolButton(toolId);
    }

    centerView(w = null, h = null) {
        const act = this.layers.getActiveLayer();
        const width = w || (act ? act.width : this.defaultWidth);
        const height = h || (act ? act.height : this.defaultHeight);
        const leftMargin = 70;
        const rightMargin = 330;
        const availW = Math.max(100, window.innerWidth - leftMargin - rightMargin);
        const availH = Math.max(100, window.innerHeight - 50);

        const fit = Math.min(availW / width, availH / height, 1.0) * 0.90;
        this.zoom.scale = Math.max(0.05, fit);
        const centerX = leftMargin + availW / 2;
        const centerY = window.innerHeight / 2;
        this.zoom.panX = centerX - (width * this.zoom.scale) / 2;
        this.zoom.panY = centerY - (height * this.zoom.scale) / 2;
        this.zoom.apply();
    }

    ajustarCanvasACapaActiva() {
        const act = this.layers.getActiveLayer();
        if (!act) return;

        const targetW = act.originalWidth || act.width;
        const targetH = act.originalHeight || act.height;

        if (act.width !== targetW || act.height !== targetH) {
            act.setSize(targetW, targetH, true);
        }

        this.layers.layers.forEach(l => {
            l.canvas.style.display = l.visible ? 'block' : 'none';
        });

        this.defaultWidth = targetW;
        this.defaultHeight = targetH;
        this.layers.defaultWidth = targetW;
        this.layers.defaultHeight = targetH;

        if (this.ui.layersContainer) {
            this.ui.layersContainer.style.width = targetW + 'px';
            this.ui.layersContainer.style.height = targetH + 'px';
            this.ui.layersContainer.style.overflow = 'hidden';
        }

        this.syncInteractiveCanvases(targetW, targetH);
        this.centerView(targetW, targetH);

        if (this.ui.reorderList) {
            this.ui.reorderList.setItems(
                this.layers.getLayerList(),
                this.layers.layers.findIndex(l => l.id === act.id)
            );
        }

        this.ui.setHUD(`✓ Capa Trozo: ${act.name} [${targetW}x${targetH} px]`);
    }

    adaptarCapaActivaAlCanvas() {
        const act = this.layers.getActiveLayer();
        if (!act) return;
        const targetW = this.initialCanvasWidth;
        const targetH = this.initialCanvasHeight;
        if (act.width === targetW && act.height === targetH) return;

        const before = act.getSnapshot();
        act.setSize(targetW, targetH, true);
        const after = act.getSnapshot();

        this.history.push({
            undo: () => {
                act.restoreSnapshot(before);
                this.syncInteractiveCanvases(before.width, before.height);
                this.centerView(before.width, before.height);
            },
            redo: () => {
                act.restoreSnapshot(after);
                this.syncInteractiveCanvases(after.width, after.height);
                this.centerView(after.width, after.height);
            }
        });
        this.syncInteractiveCanvases(targetW, targetH);
        this.centerView(targetW, targetH);
    }

    pegarComoNuevaCapa(canvasRecorte, nombre = 'Trozo Pegado') {
        if (!canvasRecorte || canvasRecorte.width <= 0 || canvasRecorte.height <= 0) return;

        const w = canvasRecorte.naturalWidth || canvasRecorte.width;
        const h = canvasRecorte.naturalHeight || canvasRecorte.height;

        const nuevaCapa = this.layers.createLayer(`${nombre} (${w}x${h})`, w, h);
        nuevaCapa.originalWidth = w;
        nuevaCapa.originalHeight = h;
        nuevaCapa.ctx.drawImage(canvasRecorte, 0, 0, w, h);

        const capaId = nuevaCapa.id;
        const indiceOriginal = this.layers.layers.findIndex(l => l.id === capaId);

        this.layers.setActiveLayer(nuevaCapa.id);

        this.history.push({
            undo: () => this.layers.deleteLayer(capaId),
            redo: () => {
                this.layers.layers.splice(indiceOriginal, 0, nuevaCapa);
                this.layers.setActiveLayer(nuevaCapa.id);
                this.layers.syncDOM();
                this.ajustarCanvasACapaActiva();
            }
        });

        this.selection.clear();
        this.ajustarCanvasACapaActiva();
    }

    // Puentes (Proxies) para que los botones existentes de ApplicationUI sigan funcionando sin cambios
    abrirFiltrosGLFX() { this.effects.abrirFiltrosGLFX(); }
    abrirPixelArt() { this.effects.abrirPixelArt(); }
    abrirCurvasRGBA() { this.effects.abrirCurvasRGBA(); }
    abrirBGRMPipeline() { this.effects.abrirBGRMPipeline(); }
    abrirBrushTipMaker() { this.effects.brushTipUI.panel.open(); }
    abrirBrushDynamics() { this.effects.brushDynamicsUI.panel.open(); }
    abrirProjectStorage() {
        this.effects.projectStorageUI.refreshList();
        this.effects.projectStorageUI.panel.open();
    }
}
window.addEventListener('DOMContentLoaded', () => {
    window.AppInstance = new ApplicationAdapter();
});
</script>
